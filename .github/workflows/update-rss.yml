name: Update RSS articles

on:
  schedule:
    - cron: "0 4 * * *"
    - cron: "0 16 * * *"
  workflow_dispatch:
  push:
    paths:
      - "Fluent_Reader_Export.opml"
      - "scripts/fetch_rss.py"
      - ".github/workflows/update-rss.yml"

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Fetch RSS articles
        run: python scripts/fetch_rss.py

      - name: Save updated articles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/rss.json
          git diff --cached --quiet || git commit -m "chore: update RSS articles"
          git push
