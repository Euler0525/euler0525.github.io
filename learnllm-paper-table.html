<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="LLM 经典论文与技术里程碑，收录 2017 年至今的重要研究工作。">
  <meta name="color-scheme" content="dark">
  <title>LLM 论文精选</title>
  <style>
    :root {
      --bg: #090d0c;
      --surface: #111715;
      --surface-strong: #151d1a;
      --line: rgba(221, 255, 235, .12);
      --line-strong: rgba(91, 230, 151, .38);
      --text: #f2f8f4;
      --muted: #9aaba2;
      --green: #4ee68c;
      --green-dark: #142c20;
      --gold: #e8c777;
      --radius: 12px;
      font-family: Inter, "Segoe UI", "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    * { box-sizing: border-box; }
    html { background: var(--bg); }
    body {
      margin: 0;
      min-width: 320px;
      color: var(--text);
      background:
        radial-gradient(circle at 14% -10%, rgba(44, 185, 105, .12), transparent 31rem),
        radial-gradient(circle at 88% 0%, rgba(89, 116, 239, .07), transparent 28rem),
        var(--bg);
      font-size: 16px;
      overflow: hidden;
    }

    button, a { font: inherit; }
    button { color: inherit; }

    .app {
      height: 100dvh;
      display: flex;
      flex-direction: column;
      min-height: 0;
    }

    .topbar {
      min-height: 72px;
      padding: 14px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      background: rgba(8, 13, 11, .94);
      border-bottom: 1px solid var(--line);
      box-shadow: 0 14px 35px rgba(0, 0, 0, .24);
      z-index: 40;
    }

    .brand {
      min-width: 0;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-mark {
      width: 42px;
      height: 42px;
      flex: 0 0 42px;
      display: grid;
      place-items: center;
      color: #07110b;
      background: linear-gradient(145deg, #65f09e, #25af64);
      border-radius: 10px 4px 10px 4px;
      box-shadow: 0 0 28px rgba(78, 230, 140, .2);
      font-weight: 900;
      letter-spacing: -.08em;
    }

    .brand-copy { min-width: 0; }
    .brand-name {
      margin: 0;
      font-size: 1.2rem;
      line-height: 1.15;
      letter-spacing: .01em;
      white-space: nowrap;
    }
    .brand-name span { color: var(--muted); font-weight: 450; }
    .brand-note {
      margin: 4px 0 0;
      color: var(--muted);
      font-size: .8rem;
    }

    .stats {
      display: flex;
      align-items: center;
      gap: 8px;
      color: var(--muted);
      font-size: .82rem;
      white-space: nowrap;
    }
    .stat {
      padding: 7px 10px;
      border: 1px solid var(--line);
      border-radius: 999px;
      background: rgba(255, 255, 255, .025);
    }
    .stat strong { color: var(--text); font-weight: 700; }

    .contextbar {
      min-height: 44px;
      padding: 8px 20px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      color: var(--muted);
      background: rgba(13, 19, 17, .92);
      border-bottom: 1px solid var(--line);
      font-size: .82rem;
    }
    .view-label {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #dce8e1;
      font-weight: 650;
    }
    .view-label::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--green);
      box-shadow: 0 0 12px var(--green);
    }

    .table-shell {
      position: relative;
      flex: 1 1 auto;
      min-height: 0;
      overflow: auto;
      scrollbar-color: #3e6150 #101613;
      scrollbar-width: thin;
      overscroll-behavior: contain;
    }
    .table-shell:focus-visible {
      outline: 2px solid var(--green);
      outline-offset: -2px;
    }

    table {
      width: max-content;
      min-width: 100%;
      border-spacing: 0;
      border-collapse: separate;
      table-layout: fixed;
    }

    thead th {
      position: sticky;
      top: 0;
      z-index: 20;
      width: 164px;
      min-width: 164px;
      height: 58px;
      padding: 9px 12px;
      color: #e4ede7;
      background: rgba(14, 20, 18, .98);
      border-right: 1px solid var(--line);
      border-bottom: 1px solid rgba(95, 230, 153, .26);
      text-align: left;
      font-size: .84rem;
      line-height: 1.25;
      font-weight: 700;
    }

    thead .year-head {
      left: 0;
      z-index: 30;
      width: 88px;
      min-width: 88px;
      color: var(--green);
    }

    tbody tr { --row-bg: #18201d; --row-accent: var(--green); }
    tbody th, tbody td {
      background: var(--row-bg);
      border-right: 1px solid rgba(255, 255, 255, .055);
      border-bottom: 1px solid rgba(255, 255, 255, .07);
    }

    tbody th.year {
      position: sticky;
      left: 0;
      z-index: 10;
      width: 88px;
      min-width: 88px;
      padding: 16px 12px;
      vertical-align: top;
      text-align: left;
      box-shadow: inset 3px 0 var(--row-accent), 14px 0 24px rgba(0, 0, 0, .1);
    }
    .year strong {
      display: block;
      color: var(--row-accent);
      font-size: 1rem;
    }
    .year span {
      display: block;
      margin-top: 5px;
      color: rgba(238, 246, 241, .62);
      font-size: .72rem;
      font-weight: 500;
    }

    tbody td {
      width: 164px;
      min-width: 164px;
      padding: 8px;
      vertical-align: top;
    }

    .cell-stack { display: grid; gap: 6px; }
    .milestone {
      width: 100%;
      min-height: 58px;
      padding: 9px 10px 10px;
      display: block;
      text-align: left;
      border: 1px solid transparent;
      border-radius: 8px;
      background: rgba(6, 10, 8, .17);
      cursor: pointer;
      transition: background .16s ease, border-color .16s ease, transform .16s ease, box-shadow .16s ease;
    }
    .milestone:hover {
      background: rgba(7, 13, 10, .48);
      border-color: color-mix(in srgb, var(--row-accent) 60%, transparent);
      transform: translateY(-1px);
      box-shadow: 0 8px 18px rgba(0, 0, 0, .18);
    }
    .milestone:focus-visible {
      outline: 2px solid var(--row-accent);
      outline-offset: 2px;
    }
    .milestone-top {
      min-height: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 6px;
    }
    .milestone time {
      color: color-mix(in srgb, var(--row-accent) 65%, white);
      font-size: .7rem;
      font-variant-numeric: tabular-nums;
      letter-spacing: .04em;
    }
    .markers { display: inline-flex; gap: 3px; font-size: .58rem; }
    .marker-major { color: var(--gold); }
    .marker-free { color: var(--green); }
    .milestone-title {
      display: block;
      margin-top: 3px;
      color: #f1f6f3;
      font-size: .89rem;
      line-height: 1.28;
      font-weight: 560;
      overflow-wrap: anywhere;
    }

    dialog {
      width: min(860px, calc(100vw - 32px));
      max-width: none;
      max-height: min(88dvh, 900px);
      padding: 0;
      color: var(--text);
      background: transparent;
      border: 0;
      overflow: visible;
    }
    dialog::backdrop {
      background: rgba(0, 5, 3, .8);
      backdrop-filter: blur(7px);
    }

    .dialog-panel {
      max-height: min(88dvh, 900px);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      background:
        linear-gradient(145deg, rgba(31, 48, 39, .62), transparent 34%),
        #111815;
      border: 1px solid rgba(82, 228, 145, .34);
      border-radius: 16px;
      box-shadow: 0 30px 100px rgba(0, 0, 0, .62), 0 0 45px rgba(61, 221, 132, .08);
    }

    .dialog-header {
      position: relative;
      padding: 24px 64px 19px 24px;
      display: flex;
      align-items: flex-start;
      gap: 15px;
      border-bottom: 1px solid var(--line);
    }
    .logo-wrap {
      width: 46px;
      height: 46px;
      flex: 0 0 46px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 12px;
      background: rgba(255, 255, 255, .94);
      overflow: hidden;
      color: #173322;
      font-weight: 850;
    }
    .logo-wrap img { width: 32px; height: 32px; object-fit: contain; }
    .dialog-heading { min-width: 0; }
    .eyebrow {
      margin: 0 0 5px;
      color: var(--green);
      font-size: .72rem;
      font-weight: 750;
      letter-spacing: .1em;
      text-transform: uppercase;
    }
    .dialog-heading h2 {
      margin: 0;
      font-size: clamp(1.45rem, 3vw, 2.1rem);
      line-height: 1.13;
      overflow-wrap: anywhere;
    }
    .source-title {
      margin: 7px 0 0;
      max-width: 680px;
      color: var(--muted);
      font-size: .9rem;
      line-height: 1.45;
    }
    .close-button {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 38px;
      height: 38px;
      display: grid;
      place-items: center;
      border: 1px solid var(--line);
      border-radius: 10px;
      color: var(--muted);
      background: rgba(255, 255, 255, .035);
      cursor: pointer;
    }
    .close-button:hover { color: white; border-color: var(--line-strong); }
    .close-button:focus-visible { outline: 2px solid var(--green); outline-offset: 2px; }

    .dialog-scroll {
      padding: 20px 24px 28px;
      overflow-y: auto;
      scrollbar-color: #3e6150 transparent;
    }
    .badges {
      display: flex;
      flex-wrap: wrap;
      gap: 7px;
      margin-bottom: 20px;
    }
    .badge {
      padding: 5px 9px;
      border: 1px solid var(--line);
      border-radius: 999px;
      color: #c6d4cc;
      background: rgba(255, 255, 255, .028);
      font-size: .74rem;
    }
    .badge-accent { color: var(--green); border-color: rgba(78, 230, 140, .32); background: rgba(78, 230, 140, .06); }
    .badge-gold { color: var(--gold); border-color: rgba(232, 199, 119, .3); background: rgba(232, 199, 119, .055); }

    .section-title {
      margin: 0 0 10px;
      color: #f0f6f2;
      font-size: .8rem;
      letter-spacing: .08em;
      text-transform: uppercase;
    }
    .description {
      color: #cbd6d0;
      font-size: .96rem;
      line-height: 1.78;
    }
    .description p { margin: 0 0 12px; }
    .description p:last-child { margin-bottom: 0; }
    .description ul { margin: 0 0 12px; padding-left: 1.2rem; }
    .description li + li { margin-top: 4px; }
    .description strong { color: #eff8f2; font-weight: 720; }

    .nodes-heading {
      margin-top: 27px;
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 12px;
    }
    .nodes-heading .section-title { margin: 0; }
    .node-count { color: var(--muted); font-size: .76rem; }
    .node-list { margin-top: 11px; display: grid; gap: 8px; }
    .node {
      border: 1px solid var(--line);
      border-radius: 10px;
      background: rgba(255, 255, 255, .018);
      overflow: clip;
    }
    .node[open] { border-color: rgba(78, 230, 140, .25); background: rgba(78, 230, 140, .025); }
    .node summary {
      min-height: 48px;
      padding: 12px 14px;
      display: flex;
      align-items: center;
      gap: 10px;
      cursor: pointer;
      list-style: none;
      font-size: .9rem;
      font-weight: 650;
    }
    .node summary::-webkit-details-marker { display: none; }
    .node summary::after {
      content: "+";
      margin-left: auto;
      color: var(--green);
      font-size: 1.1rem;
      font-weight: 400;
    }
    .node[open] summary::after { content: "−"; }
    .node summary:focus-visible { outline: 2px solid var(--green); outline-offset: -2px; }
    .node-index {
      width: 24px;
      height: 24px;
      flex: 0 0 24px;
      display: grid;
      place-items: center;
      color: var(--green);
      background: var(--green-dark);
      border: 1px solid rgba(78, 230, 140, .24);
      border-radius: 7px;
      font-size: .68rem;
      font-variant-numeric: tabular-nums;
    }
    .node-body {
      padding: 0 14px 15px 48px;
      color: #b8c8bf;
      font-size: .9rem;
      line-height: 1.7;
    }

    .dialog-footer {
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 18px;
      border-top: 1px solid var(--line);
      background: rgba(8, 13, 11, .94);
    }
    .footer-note { color: var(--muted); font-size: .76rem; line-height: 1.4; }
    .source-link {
      flex: 0 0 auto;
      padding: 10px 15px;
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: #07130b;
      background: var(--green);
      border-radius: 9px;
      text-decoration: none;
      font-size: .86rem;
      font-weight: 780;
      box-shadow: 0 8px 24px rgba(78, 230, 140, .14);
    }
    .source-link:hover { background: #72f2a7; }
    .source-link:focus-visible { outline: 2px solid white; outline-offset: 3px; }

    @media (max-width: 760px) {
      .topbar { min-height: 64px; padding: 10px 12px; gap: 10px; }
      .brand-mark { width: 38px; height: 38px; flex-basis: 38px; }
      .brand-name { font-size: 1rem; }
      .brand-note { display: none; }
      .stats .stat:nth-child(2), .stats .stat:nth-child(3) { display: none; }
      .contextbar { padding: 7px 12px; }
      .contextbar > span:last-child { display: none; }
      dialog { width: calc(100vw - 16px); max-height: 94dvh; }
      .dialog-panel { max-height: 94dvh; border-radius: 13px; }
      .dialog-header { padding: 18px 54px 16px 16px; gap: 11px; }
      .logo-wrap { width: 40px; height: 40px; flex-basis: 40px; }
      .logo-wrap img { width: 27px; height: 27px; }
      .dialog-scroll { padding: 17px 16px 24px; }
      .dialog-footer { padding: 12px 16px; align-items: stretch; flex-direction: column; gap: 10px; }
      .source-link { justify-content: center; }
      .node-body { padding-left: 14px; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; transition: none !important; }
    }

    @media print {
      body { overflow: visible; background: white; color: black; }
      .app { height: auto; }
      .topbar, .contextbar { position: static; color: black; background: white; }
      .table-shell { overflow: visible; }
      table { width: 100%; font-size: 8px; }
      thead th, tbody td { width: auto; min-width: 0; }
      .year, .year-head, thead th { position: static !important; }
      dialog { display: none; }
    }
  </style>
</head>

  <script id="learning-data" type="application/json">{"snapshotDate":"2026-09-08","types":[{"id":1,"slug":"llm","title":"LLM","order":1},{"id":6,"slug":"llm-training","title":"大模型训练","order":2},{"id":13,"slug":"fine-tuning","title":"微调","order":3},{"id":3,"slug":"alignment","title":"对齐","order":4},{"id":4,"slug":"quantization","title":"量化","order":5},{"id":5,"slug":"llm-tech","title":"大模型技术","order":6},{"id":7,"slug":"framework","title":"开发框架","order":7},{"id":14,"slug":"agent","title":"Agent","order":8},{"id":9,"slug":"lvm","title":"LVM 大视觉模型","order":9},{"id":10,"slug":"mmlm","title":"MMLM 多模态大模型","order":10},{"id":11,"slug":"speech-model","title":"语音模型","order":11},{"id":12,"slug":"text-to-image","title":"文生图","order":12},{"id":8,"slug":"model-philosophy","title":"模型哲学","order":13},{"id":2,"slug":"gpu","title":"显卡","order":14}],"milestones":[{"id":164,"slug":"tesla-v100","title":"V100","description":"NVIDIA Tesla V100 GPU","sourceName":"NVIDIA Tesla V100 GPU Architecture","sourceUrl":"https://images.nvidia.com/content/volta-architecture/pdf/volta-architecture-whitepaper.pdf","publishedDate":"2017-05-11","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":397,"slug":"tesla-v100-basics","title":"V100","description":"英伟达 V100 通过其革命性的 Volta 架构，特别是首次引入的 Tensor Core，为 AI 和科学计算领域树立了新的性能标杆。它不仅是一款产品，更标志着计算范式向加速计算转变的关键节点，为后续更先进的 GPU（如 A100、H100）奠定了坚实的技术基础。","order":1,"sourceName":"","sourceUrl":""}]},{"id":165,"slug":"transformer","title":"Transformer","description":"在 Transformer 出现之前，处理序列数据（如语言）的主流模型是循环神经网络（RNN）及其变体（如 LSTM、GRU）。然而，RNN 存在一个根本性缺陷：顺序处理。它必须逐个处理序列中的词元，导致计算无法并行化，训练速度非常慢。更关键的是，RNN 在处理长序列时难以记住远距离的依赖关系（即句子开头的信息可能难以影响到句子末尾的生成），这被称为长程依赖问题。虽然一些研究尝试使用卷积神经网络或结合注意力机制来改进，但效果有限，且注意力机制通常只是作为 RNN 的辅助工具。\r\nTransformer 模型是自然语言处理领域的一个革命性工作，它彻底改变了序列处理模型的设计思路，为当今众多大语言模型奠定了核心架构基础。","sourceName":"Attention Is All You Need","sourceUrl":"https://arxiv.org/abs/1706.03762","publishedDate":"2017-06-12","isFree":true,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":398,"slug":"transformer-data","title":"数据","description":"论文中的主要实验是在两个公认的高质量机器翻译数据集上进行的：WMT 2014 英语-德语翻译数据集和 WMT 2014 英语-法语翻译数据集。","order":1,"sourceName":"","sourceUrl":""},{"id":399,"slug":"transformer-model","title":"模型","description":"Transformer 架构的核心思想是完全摒弃传统的循环神经网络和卷积神经网络，仅依赖自注意力机制来捕捉输入序列中的全局依赖关系，从而实现极高的并行化处理能力。","order":2,"sourceName":"","sourceUrl":""},{"id":400,"slug":"transformer-training","title":"训练细节","description":"Transformer 的训练成功得益于几个关键设计，除了高效的并行化架构，摆脱了 RNN 的序列依赖性，大大缩短了训练时间；还有精心调校的优化策略，特别是带有预热的 Adam 优化器，确保了稳定快速的收敛；也包括了有效的正则化组合，残差 Dropout 和标签平滑共同作用，防止了在深层网络和大模型上的过拟合。","order":3,"sourceName":"","sourceUrl":""},{"id":401,"slug":"transformer-evaluation","title":"评估","description":"Transformer通过纯注意力机制取代循环/卷积结构，在翻译质量、训练速度与泛化能力上均取得突破，为后续序列建模研究奠定了新范式","order":4,"sourceName":"","sourceUrl":""}]},{"id":166,"slug":"rlhf","title":"RLHF","description":"传统强化学习需要设计精确的奖励函数，但这在复杂任务中可能不切实际。RLHF 转而利用人类对智能体行为轨迹的偏好进行比较（例如，展示两段轨迹片段，让人选择哪个更优），从而间接定义学习目标。","sourceName":"Deep reinforcement learning from human preferences","sourceUrl":"https://arxiv.org/abs/1706.03741","publishedDate":"2017-07-02","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["alignment"],"nodes":[{"id":402,"slug":"rlhf-basics","title":"RLHF","description":"传统强化学习需要设计精确的奖励函数，但这在复杂任务中可能不切实际。RLHF 转而利用人类对智能体行为轨迹的偏好进行比较（例如，展示两段轨迹片段，让人选择哪个更优），从而间接定义学习目标。","order":1,"sourceName":"","sourceUrl":""}]},{"id":167,"slug":"ppo","title":"PPO","description":"与传统的策略梯度方法（每采样一个数据样本就进行一次梯度更新）不同，PPO 提出了一个新的目标函数，使得可以进行多个轮次的小批量更新，大大提高了数据利用效率。PPO算法旨在获得信任域策略优化（TRPO） 算法的主要优点（即稳定、单调提升的性能），但同时具有显著优势：PPO 的实现比 TRPO 简单得多，无需复杂的二阶优化计算；易于与各种模型架构（如循环神经网络）结合；经验证据表明，PPO 在单位时间内能取得更好的性能。","sourceName":"Proximal Policy Optimization Algorithms","sourceUrl":"https://arxiv.org/abs/1707.06347","publishedDate":"2017-07-20","isFree":false,"isMajor":false,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["alignment"],"nodes":[{"id":403,"slug":"ppo-basics","title":"PPO","description":"与传统的策略梯度方法（每采样一个数据样本就进行一次梯度更新）不同，PPO 提出了一个新的目标函数，使得可以进行多个轮次的小批量更新，大大提高了数据利用效率。PPO 算法旨在获得信任域策略优化（TRPO） 算法的主要优点（即稳定、单调提升的性能），但同时具有显著优势：PPO 的实现比 TRPO 简单得多，无需复杂的二阶优化计算；易于与各种模型架构（如循环神经网络）结合；经验证据表明，PPO 在单位时间内能取得更好的性能。","order":1,"sourceName":"Proximal Policy Optimization Algorithms","sourceUrl":"https://arxiv.org/abs/1707.06347"}]},{"id":168,"slug":"qat","title":"QAT","description":"深度学习模型通常使用32位浮点数（FP32）进行计算，计算成本和内存占用高，难以在只有低精度整数运算单元的低功耗硬件上高效运行。\n\n论文提出了一套完整的量化感知训练（Quantization-Aware Training, QAT） 方案，其核心目标是实现仅使用整数运算就能高效完成神经网络推理，从而显著提升模型在移动设备、嵌入式系统等资源受限环境下的部署效率。\n\n它设计了一种量化方法，使得前向推理过程中的所有权重和激活值都可以用8位整数（INT8）表示和计算，从而利用整数运算的高效性，同时尽可能保持模型原有的精度。","sourceName":"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference","sourceUrl":"https://arxiv.org/abs/1712.05877","publishedDate":"2017-12-15","isFree":false,"isMajor":false,"logoUrl":"","types":["quantization"],"nodes":[{"id":404,"slug":"qat-overview","title":"QAT","description":"深度学习模型通常使用32位浮点数（FP32）进行计算，计算成本和内存占用高，难以在只有低精度整数运算单元的低功耗硬件上高效运行。\n\n论文提出了一套完整的量化感知训练（Quantization-Aware Training, QAT） 方案，其核心目标是实现仅使用整数运算就能高效完成神经网络推理，从而显著提升模型在移动设备、嵌入式系统等资源受限环境下的部署效率。\n\n它设计了一种量化方法，使得前向推理过程中的所有权重和激活值都可以用8位整数（INT8）表示和计算，从而利用整数运算的高效性，同时尽可能保持模型原有的精度。","order":1,"sourceName":"Quantization and Training of Neural Networks for Efficient Integer-Arithmetic-Only Inference","sourceUrl":"https://arxiv.org/abs/1712.05877"}]},{"id":169,"slug":"top-k","title":"Top-k","description":"2018 年，Top-k 采样这一方法在《Hierarchical Neural Story Generation》这篇论文中被正式提出并推广。该论文由 Angela Fan、Mike Lewis 和 Yann Dauphin 共同撰写，并在 ICLR 2018 会议上发表。虽然同期还有其他研究（如 Holtzman 等人 2018 年的工作）也探索了类似的采样思想，但 Fan 等人的这篇论文是系统阐述并将 Top-k 采样应用于故事生成这一开放域文本生成任务的标志性工作之一。","sourceName":"Hierarchical Neural Story Generation","sourceUrl":"https://arxiv.org/abs/1805.04833","publishedDate":"2018-05-13","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":405,"slug":"top-k-basics","title":"Top-k","description":"2018 年，Top-k 采样这一方法在《Hierarchical Neural Story Generation》这篇论文中被正式提出并推广。该论文由 Angela Fan、Mike Lewis 和 Yann Dauphin 共同撰写，并在 ICLR 2018 会议上发表。虽然同期还有其他研究（如 Holtzman 等人 2018 年的工作）也探索了类似的采样思想，但 Fan 等人的这篇论文是系统阐述并将 Top-k 采样应用于故事生成这一开放域文本生成任务的标志性工作之一。","order":1,"sourceName":"Hierarchical Neural Story Generation","sourceUrl":"https://arxiv.org/abs/1805.04833"}]},{"id":170,"slug":"gpt1","title":"GPT-1","description":"在 GPT-1 出现之前，主流自然语言处理方法严重依赖针对特定任务的大规模高质量标注数据进行有监督训练。这带来了两个主要问题：一是高质量标注数据的获取成本高昂，极大地限制了模型性能的上限；二是为不同任务（如文本分类、问答、语义相似度判断）训练专有模型，导致模型泛化能力差，难以适应新任务。同时，虽然 Word2Vec 等词向量技术缓解了对标注数据的部分依赖，但它们主要提供词级别的静态表示，难以捕捉更深层次的上下文语义信息。2017 年，Transformer 架构的提出为捕捉长距离依赖关系提供了更强大的模型基础。GPT-1（Generative Pre-trained Transformer 1）是 OpenAI 在 2018 年发布的生成式预训练语言模型，它首次将“无监督预训练 + 有监督微调”的两阶段范式成功应用于自然语言处理领域，为后续大语言模型的发展奠定了重要基础。","sourceName":"Improving Language Understanding by Generative Pre-Training","sourceUrl":"https://cdn.openai.com/research-covers/language-unsupervised/language_understanding_paper.pdf","publishedDate":"2018-06-11","isFree":true,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["llm"],"nodes":[{"id":406,"slug":"gpt1-pretraining-data","title":"预训练数据","description":"GPT-1 的成功很大程度上得益于在 BooksCorpus 这一高质量、长文本数据集上的生成式预训练，这为模型后续在各种下游任务上的出色泛化能力奠定了坚实基础。","order":1,"sourceName":"","sourceUrl":""},{"id":407,"slug":"gpt1-pretraining-model","title":"预训练模型","description":"GPT-1的核心创新在于一个简单而有效的两阶段框架：\n\n无监督生成式预训练：在一个大规模、多样化的文本语料库上，使用标准的语言建模目标（即根据前文预测下一个词）来训练一个通用模型。这使得模型能够学习到丰富的语言知识、世界知识和长距离依赖关系。\n\n有监督判别式微调：将预训练好的模型直接应用于下游任务（如文本分类、问答等），使用有标签的数据对模型进行微调。微调时，只需对模型输入进行最小化的调整，并增加一个简单的线性输出层。","order":2,"sourceName":"","sourceUrl":""},{"id":408,"slug":"gpt1-pretraining-details","title":"预训练细节","description":"预训练的目标是训练一个通用的语言模型，使其能够通过预测下一个词来理解和生成自然语言。这被认为是一种无监督学习，因为不需要人工标注的标签。","order":3,"sourceName":"","sourceUrl":""},{"id":409,"slug":"gpt1-downstream-data","title":"下游任务数据","description":"GPT-1的关键下游任务分为四类：\n- 文本分类（Text Classification）\n- 自然语言推理（Natural Language Inference）\n- 语义相似性（Semantic Similarity）\n- 问答与常识推理（Question Answering & Commonsense Reasoning）。","order":4,"sourceName":"","sourceUrl":""},{"id":410,"slug":"gpt1-finetuning-model","title":"微调模型","description":"GPT-1 采用两阶段训练：首先在大型无标注文本语料库（如 BooksCorpus）上进行生成式语言模型预训练，然后针对具体任务进行监督式微调。微调时，模型通过任务特定的输入变换，将结构化输入（如句子对、问答三元组）转换为单一令牌序列，从而最小化架构改动。","order":5,"sourceName":"","sourceUrl":""},{"id":411,"slug":"gpt1-finetuning-details","title":"微调细节","description":"GPT-1 的下游微调策略精髓在于 “最大程度复用，最小程度修改”：模型架构统一，几乎所有参数都来自预训练模型，微调阶段只引入极少量新参数（输出层 Wy和分隔符的嵌入）；输入格式统一，通过序列化转换，使不同任务都能被同一模型处理，无需为每个任务设计复杂定制架构；目标函数增强，通过加入语言模型辅助损失，有效平衡了特定任务学习和通用知识保留。","order":6,"sourceName":"","sourceUrl":""},{"id":412,"slug":"gpt1-evaluation","title":"评估","description":"GPT-1 在 12 个任务中的 9 个实现了state-of-the-art，包括GLUE基准（得分72.8，优于前最佳68.9）。其成功源于预训练捕获的长期依赖和世界知识，以及微调的灵活性。","order":7,"sourceName":"","sourceUrl":""}]},{"id":171,"slug":"gpu-tesla-t4","title":"Tesla T4","description":"NVIDIA Tesla T4 是基于 Turing 架构的 GPU，专为高能效 AI 推理和高密度服务器部署而设计。","sourceName":"NVIDIA","sourceUrl":"https://www.nvidia.com/en-us/data-center/tesla-t4/","publishedDate":"2018-09-13","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":413,"slug":"gpu-tesla-t4-basics","title":"Tesla T4","description":"本节点介绍 NVIDIA Tesla T4 GPU 的核心技术，包括 Turing 架构、Tensor Core、RT Core 等。","order":1,"sourceName":"NVIDIA","sourceUrl":"https://www.nvidia.com/en-us/data-center/tesla-t4/"}]},{"id":172,"slug":"bert","title":"BERT","description":"在发布之初，BERT 在 11 项自然语言理解任务上取得了碾压性的突破，其“深层双向编码器”架构在需要深度语义理解的任务（如文本分类、情感分析、问答系统）上表现出了巨大优势。它证明了一个通用的、深度预训练的模型，仅需添加一个简单的输出层，就可以在多种任务上取得优异表现，极大地推动了“预训练 + 微调”范式的普及。\r\n\r\n尽管 GPT-1 在初始的各项理解任务评测中表现不如 BERT 耀眼，但它坚定地走在生成式预训练的道路上。其后的 GPT-2、GPT-3 等模型通过不断扩大模型规模和数据量，最终展现出强大的上下文学习（In-Context Learning）和提示驱动（Prompt-driven）能力，实现了无需微调即可完成多种任务的突破，最终引领了生成式 AI 的浪潮。","sourceName":"BERT: Pre-training of Deep Bidirectional Transformers for Language Understanding","sourceUrl":"https://arxiv.org/abs/1810.04805","publishedDate":"2018-10-11","isFree":true,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":414,"slug":"bert-pretraining-data","title":"预训练数据","description":"BERT 的预训练数据规模巨大、质量高、格式统一（文档级文本），并通过 MLM 和 NSP 这两个巧妙的预训练任务，使模型学会了丰富的语言知识和推理能力，为其在各种下游任务上的卓越表现奠定了坚实基础。数据来源是 BooksCorpus (书籍语料库) 和 英文维基百科 (English Wikipedia)。","order":1,"sourceName":"","sourceUrl":""},{"id":415,"slug":"bert-pretraining-model","title":"预训练模型","description":"BERT 沿用了 GPT-1 的“预训练-微调”范式，使用大规模无标注数据学习通用语言表示，并能通过微调适配多种下游任务","order":2,"sourceName":"","sourceUrl":""},{"id":416,"slug":"bert-pretraining-details","title":"预训练细节","description":"BERT的威力源于其两个精心设计的预训练任务，它们让模型学会了理解和推理语言：\n- 掩码语言模型（Masked Language Model, MLM）的目标是使模型能够进行深度双向的上下文理解。它随机遮蔽输入序列中15%的词汇，然后让模型根据上下文预测这些被遮蔽的原始词汇。这个过程类似于“完形填空”；\n- 下一句预测（Next Sentence Prediction, NSP）的目标是让模型理解句子间的关系，这对问答、自然语言推理等任务至关重要。","order":3,"sourceName":"","sourceUrl":""},{"id":417,"slug":"bert-downstream-data","title":"下游任务数据","description":"BERT 通过相对统一的架构和微调方法，适应了多种不同类型的下游自然语言处理任务，包括：句子对分类、单句分类、问答和序列标注。","order":4,"sourceName":"","sourceUrl":""},{"id":418,"slug":"bert-finetune-model","title":"微调模型","description":"BERT 沿用了 GPT-1 的“预训练（Pre-training）+ 微调（Fine-tuning）”的两阶段模式。预训练阶段（如通过 MLM 和 NSP 任务）让模型从海量文本中学习通用的语言规律和知识。微调阶段则利用下游任务（如文本分类、问答等）的标注数据，以较小的学习率对这些预训练参数进行端到端的更新，并训练一个新增的、相对简单的任务特定输出层（Task-Specific Head）。这种方式相比为每个任务从头训练模型，能大幅降低对标注数据量的需求，显著减少计算成本和时间，并凭借预训练获得的高质量初始参数，往往能实现更好的泛化性能，尤其在数据量较小的任务上表现更为突出。","order":5,"sourceName":"","sourceUrl":""},{"id":419,"slug":"bert-finetune-details","title":"微调细节","description":"BERT 微调的精髓在于，它并非让模型从头学起，而是引导一个已经具备通用语言知识的“通才”模型，快速适应特定的“专业”任务。这其中，针对性的微调策略和恰当的损失函数是成功的关键。","order":6,"sourceName":"","sourceUrl":""},{"id":420,"slug":"bert-evaluation","title":"评估","description":"评估 BERT 在下游任务上的表现是一个多维度的工作。它既需要选择与任务特性相匹配的评估指标，也需要在权威的基准测试上进行衡量，同时还要结合实际业务需求和在线实验进行综合判断。","order":7,"sourceName":"","sourceUrl":""}]},{"id":173,"slug":"gpipe","title":"GPipe","description":"为了解决单个加速器（如 GPU 或 TPU）内存无法容纳的超大型模型训练问题，GPipe 将一个复杂的神经网络模型按层划分为多个子序列，并将每个子序列放置在不同的加速器上。通过引入管道并行技术，它实现了在多个设备上对巨型模型进行并行训练。想象一个洗车流程，分为喷泡沫、刷洗、冲洗、擦干四个步骤。如果只有一个人，必须等一个车完成所有步骤才能洗下一辆。但如果有四个人每人负责一个步骤，当第一辆车进入刷洗阶段时，第二辆车就可以开始喷泡沫，这样整体效率大大提升。GPipe 的管道并行就是类似的原理。","sourceName":"GPipe: Efficient Training of Giant Neural Networks using Pipeline Parallelism","sourceUrl":"https://arxiv.org/abs/1811.06965","publishedDate":"2018-11-16","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":421,"slug":"gpipe-basics","title":"GPipe","description":"为了解决单个加速器（如 GPU 或 TPU）内存无法容纳的超大型模型训练问题，GPipe 将一个复杂的神经网络模型按层划分为多个子序列，并将每个子序列放置在不同的加速器上。通过引入管道并行技术，它实现了在多个设备上对巨型模型进行并行训练。想象一个洗车流程，分为喷泡沫、刷洗、冲洗、擦干四个步骤。如果只有一个人，必须等一个车完成所有步骤才能洗下一辆。但如果有四个人每人负责一个步骤，当第一辆车进入刷洗阶段时，第二辆车就可以开始喷泡沫，这样整体效率大大提升。GPipe 的管道并行就是类似的原理。","order":1,"sourceName":"GPipe: Efficient Training of Giant Neural Networks using Pipeline Parallelism","sourceUrl":"https://arxiv.org/abs/1811.06965"}]},{"id":174,"slug":"huggingface","title":"Hugging Face","description":"公司最初的聊天机器人应用虽然有一定创意和用户群体，但由于技术局限和清晰的盈利模式，发展缓慢，难以实现大规模增长。2018年，面对发展瓶颈，创始团队做出了一个关键决定：将他们在开发聊天机器人时使用和积累的底层技术——尤其是围绕 Transformer 架构的模型和工具库——在 GitHub 上开源。这个名为 `Transformers` 的开源库，因其统一的接口、出色的易用性以及对BERT、GPT等先进模型的强大支持，在开发者社区中迅速走红。","sourceName":"Hugging Face Documentation","sourceUrl":"https://huggingface.co/docs","publishedDate":"2018-11-26","isFree":false,"isMajor":false,"logoUrl":"","types":["framework"],"nodes":[{"id":422,"slug":"huggingface-intro","title":"Hugging Face","description":"公司最初的聊天机器人应用虽然有一定创意和用户群体，但由于技术局限和清晰的盈利模式，发展缓慢，难以实现大规模增长。2018年，面对发展瓶颈，创始团队做出了一个关键决定：将他们在开发聊天机器人时使用和积累的底层技术——尤其是围绕 Transformer 架构的模型和工具库——在 GitHub 上开源。这个名为 `Transformers` 的开源库，因其统一的接口、出色的易用性以及对BERT、GPT等先进模型的强大支持，在开发者社区中迅速走红。","order":1,"sourceName":"Hugging Face","sourceUrl":"https://huggingface.co"}]},{"id":175,"slug":"gpt2","title":"GPT-2","description":"2018 年，当 GPT-1 发布后不久，谷歌推出的 BERT 模型凭借其双向 Transformer 编码器架构和掩码语言模型（MLM）任务，在多项自然语言理解任务上取得了显著优于 GPT-1 的成绩，迅速成为领域主流。面对这一局面，OpenAI 内部需要进行战略抉择。是追随 BERT 的成功路径，转向双向架构？还是坚持自己基于 Transformer 解码器的自回归语言模型（即根据上文预测下一个词）路线？OpenAI 选择了后者，并决定将其推向极致。这一选择的背后，是他们对通用人工智能（AGI）发展路径的不同判断：他们认为，生成能力是智能更本质的体现，而扩大模型和数据规模是解锁这种能力的关键。","sourceName":"Language Models are Unsupervised Multitask Learners","sourceUrl":"https://cdn.openai.com/better-language-models/language_models_are_unsupervised_multitask_learners.pdf","publishedDate":"2019-02-14","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["llm"],"nodes":[{"id":423,"slug":"gpt2-training-data","title":"训练数据","description":"在 GPT-2 之前，大型语言模型的训练数据通常局限于单一领域（如新闻、维基百科），或者像 Common Crawl 这样的通用网页爬取数据虽然规模巨大但噪声很多、质量不高。OpenAI 的假设是：要让模型具备泛化到多种任务的能力，就必须使用一个既庞大又高质量，且覆盖领域极其广泛的数据集进行预训练。","order":1,"sourceName":"","sourceUrl":""},{"id":424,"slug":"gpt2-language-model","title":"语言模型","description":"GPT-2 采用 Transformer 解码器架构，延续了 GPT（Generative Pre-trained Transformer）的设计，但引入了如下改进：将层归一化（Layer Normalization）移动到每个子模块的输入位置，类似于预激活残差网络（Pre-activation Residual Network），并在最终自注意力块后添加了额外的层归一化；使用修改的初始化方法，考虑残差路径上的累积效应，权重初始化时按残差层数 $N$ 的平方根倒数 $1/\\sqrt{N}$ 进行缩放。","order":2,"sourceName":"","sourceUrl":""},{"id":425,"slug":"gpt2-training-details","title":"训练细节","description":"模型的优化目标是语言建模，即最大化序列的联合概率，训练时无任务特定监督，但模型通过预测文本序列隐式学习多任务（如翻译、问答），实现零样本转移。","order":3,"sourceName":"","sourceUrl":""},{"id":426,"slug":"gpt2-zero-shot","title":"Zero-shot","description":"GPT-2 的 Zero-shot 能力是其最核心的创新之一，它指的是模型在未经任何特定任务的数据训练或参数微调的情况下，直接执行下游任务（如问答、翻译、摘要等）的能力。","order":4,"sourceName":"","sourceUrl":""},{"id":427,"slug":"gpt2-evaluation","title":"评估","description":"GPT-2 的评估主要基于其在零样本（zero-shot）设置下的多任务性能，无需任何任务特定训练或微调。评估涵盖了多个自然语言处理任务，包括语言建模、阅读理解、摘要、翻译等，旨在验证模型的无监督多任务学习能力。","order":5,"sourceName":"","sourceUrl":""}]},{"id":176,"slug":"top-p","title":"Top-p","description":"尽管像 GPT-2 这样的神经语言模型在训练时以“最大似然”为目标，取得了巨大成功，但直接使用“最大概率”的策略来生成文本（即贪婪搜索或束搜索）会产生以下问题如重复性、平淡无趣、不符合人类习惯。在 Top-p 之前，常用的方法是 Top-k 采样。Top-k 的缺陷是k 值固定不灵活：对于不同的上下文，词的概率分布形状差异很大。有时，可能只有 2-3 个词是合理的（例如，句子 “The capital of France is ___”），此时 k=10 就会引入大量不合适的候选词。有时，可能有几十个词都很好（例如，故事的开头），此时 k=10 又会过度限制多样性。","sourceName":"The Curious Case of Neural Text Degeneration","sourceUrl":"https://arxiv.org/abs/1904.09751","publishedDate":"2019-04-22","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":428,"slug":"top-p-overview","title":"Top-p","description":"尽管像 GPT-2 这样的神经语言模型在训练时以“最大似然”为目标，取得了巨大成功，但直接使用“最大概率”的策略来生成文本（即贪婪搜索或束搜索）会产生以下问题如重复性、平淡无趣、不符合人类习惯。在 Top-p 之前，常用的方法是 Top-k 采样。Top-k 的缺陷是k 值固定不灵活：对于不同的上下文，词的概率分布形状差异很大。有时，可能只有 2-3 个词是合理的（例如，句子 “The capital of France is ___”），此时 k=10 就会引入大量不合适的候选词。有时，可能有几十个词都很好（例如，故事的开头），此时 k=10 又会过度限制多样性。","order":1,"sourceName":"The Curious Case of Neural Text Degeneration","sourceUrl":"https://arxiv.org/abs/1904.09751"}]},{"id":177,"slug":"tensor-parallel","title":"Tensor Parallel","description":"NVIDIA 在 2019 年发布的论文 《Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism》 提出了一种专门针对 Transformer 架构的模型并行方法，使得在当时硬件条件下训练数十亿参数规模的大语言模型成为可能。这篇论文的核心在于其提出的 张量并行（Tensor Parallelism） 方案，这是一种层内模型并行技术。它巧妙地将 Transformer 层中的矩阵运算分布到多个 GPU 上，从而突破了单 GPU 的内存限制。\n\n1. MLP 块并行：对 GEMM 采用 列并行 + 行并行 的切分策略，减少同步点。\n2. 自注意力块并行：基于多头注意力机制，将不同的注意力头分布到不同 GPU 上计算。\n3. 嵌入层并行：沿词汇表维度切分嵌入层权重，显著减少通信量。","sourceName":"Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism","sourceUrl":"https://arxiv.org/abs/1909.08053","publishedDate":"2019-09-17","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":429,"slug":"tensor-parallel-basics","title":"Tensor Parallel","description":"TP 的核心思想是将一个完整的模型层（例如 Transformer 中的一个全连接层或注意力头）拆分到多个计算设备（如 GPU）上。传统的数据并行是把整个模型复制到每个 GPU 上，然后给每个 GPU 分配不同的数据批次。当模型大到单个 GPU 放不下时，数据并行就失效了。而张量并行是更细粒度的拆分：它不再复制整个模型，而是把模型本身“切”开。","order":1,"sourceName":"Megatron-LM: Training Multi-Billion Parameter Language Models Using Model Parallelism","sourceUrl":"https://arxiv.org/abs/1909.08053"}]},{"id":178,"slug":"zero","title":"Data Parallel","description":"在 ZeRO 提出之前，训练越来越大的模型主要面临两大障碍：\n\n1. **模型规模的爆炸式增长**：随着 Transformer 等架构的出现，模型的参数量从亿级迅速向十亿、百亿甚至千亿迈进。例如，GPT-2 已有 15 亿参数，而更大的模型还在规划中。\n2. **传统数据并行的显存瓶颈**：为了利用多 GPU 加速训练，最常用的方法是数据并行。但在传统数据并行中，每个 GPU 上都保存着完整的模型副本。这不仅仅包括模型参数本身，还包括：梯度和优化器状态。\n\n这意味着，传统的数据并行方法虽然加快了训练速度，但并没有解决\"单卡放不下整个模型\"的根本问题。虽然模型并行（张量并行）和流水线并行可以将模型本身切分到多个 GPU 上，但它们通常需要复杂的模型代码重构，并不如数据并行那样通用和易用。\n\nZeRO 论文的目的非常明确：在保持数据并行易用性和计算效率的同时，从根本上消除其显存冗余，从而突破显存限制，让训练万亿参数模型成为可能。它的核心思想是与其在每个 GPU 上重复存储完整的模型状态，不如将这些状态（尤其是最占空间的优化器状态、梯度、以及最终的模型参数）进行分片，然后分布到所有参与数据并行的 GPU 上。每个 GPU 只负责更新和存储自己那一份分片。在前向或反向传播需要整个张量时，通过高效的集合通信临时收集所需部分，用完后立即释放。这本质上是一种\"以通信换显存\"的权衡。","sourceName":"ZeRO: Memory Optimizations Toward Training Trillion Parameter Models","sourceUrl":"https://arxiv.org/abs/1910.02054","publishedDate":"2019-10-07","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":430,"slug":"zero-basics","title":"ZeRO","description":"在传统的数据并行训练中，每个 GPU 上都保存有完整的模型副本（参数、梯度、优化器状态）。这对于大模型来说极其浪费内存。ZeRO（**Ze**ro **R**edundancy **O**ptimizer） 的核心理念是通过分区来消除数据并行中固有的内存冗余。它不像传统数据并行那样在每个 GPU 上复制所有数据，而是将模型的状态（参数、梯度、优化器状态）分区到所有 GPU 上。每个 GPU 只负责更新和保存其中的一部分。","order":1,"sourceName":"ZeRO: Memory Optimizations Toward Training Trillion Parameter Models","sourceUrl":"https://arxiv.org/abs/1910.02054"}]},{"id":179,"slug":"t5","title":"T5","description":"在 T5 问世之前，NLP 领域虽然已经因 BERT 和 GPT 的出现进入了预训练-微调的时代，但也面临着“幸福的烦恼”。当时存在多种有竞争力的技术路线。在模型架构上，有像 BERT 这样的纯编码器模型（擅长理解任务），有像 GPT 这样的纯解码器模型（擅长文本生成），还有原始的编码器-解码器模型（擅长序列到序列任务）。在预训练目标上，有 BERT 的掩码语言模型（MLM）、GPT 的自回归语言模型以及去噪自编码等。不同的模型针对不同的任务，有不同的输入输出格式和训练目标。这导致 NLP 领域的技术栈非常碎片化，研究人员和工程师需要为不同任务维护不同的模型和代码，难以直接比较不同方法的优劣，也阻碍了知识的迁移。T5 项目正是为了系统性地回答一个问题：“在给定的计算预算下，哪种迁移学习方法最有效？” Google 的研究团队进行了一场规模空前的“大消融”研究，对各种架构、预训练目标、数据集等进行了对照实验。T5 模型就是这个庞大研究项目的产物，它提出的统一框架旨在为 NLP 提供一个简洁而强大的通用解决方案。","sourceName":"Exploring the Limits of Transfer Learning with a Unified Text-to-Text Transformer","sourceUrl":"https://arxiv.org/abs/1910.10683","publishedDate":"2019-10-23","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":431,"slug":"t5-pretraining-data","title":"预训练数据","description":"T5 模型的预训练数据 C4 是一个从 Common Crawl 网页数据中经过严格清洗得到的、规模巨大的高质量英文文本语料库。它的成功证明了数据质量与数据规模同等重要，并且其构建方法对后续的大语言模型研究产生了深远影响。","order":1,"sourceName":"","sourceUrl":""},{"id":432,"slug":"t5-pretraining-model","title":"预训练模型","description":"T5 最核心、最具革命性的思想是提出了一个统一的文本到文本框架，T5 将所有 NLP 任务都建模为“文本输入”到“文本输出”的形式。这意味着，无论是文本分类、问答、摘要还是翻译，模型都接受文本字符串作为输入，并生成文本字符串作为输出。","order":2,"sourceName":"","sourceUrl":""},{"id":433,"slug":"t5-pretraining-details","title":"预训练细节","description":"T5 将所有的 NLP 任务都重构为文本到文本的任务。这意味着无论是翻译、分类还是问答，模型的输入和输出都是文本字符串。T5 没有采用 BERT（仅 Encoder）或 GPT（仅 Decoder）的架构，而是使用了原始的、完整的 Transformer 架构，包含编码器和解码器。论文通过实验证明，在这种文本到文本的框架下，标准的 Encoder-Decoder 模型表现优于“语言模型”风格（仅 Decoder）或“掩码语言模型”风格（仅 Encoder）的变体。模型尺寸从小到大有多个版本（T5-Small, T5-Base, T5-Large, T5-3B, T5-11B），其参数规模与 BERT 的对应版本相似。","order":3,"sourceName":"","sourceUrl":""},{"id":434,"slug":"t5-downstream-data","title":"下游任务数据","description":"T5 的下游任务几乎涵盖了当时 NLP 领域所有主流的理解与生成任务。 其贡献不在于发明新的下游任务，而在于用一个极其简单统一的模型框架，成功地解决了所有这些任务，并通过系统性的实验证明了该框架的有效性和强大潜力，为后续大语言模型（如 GPT-3 等）的“指令微调”范式奠定了基础。","order":4,"sourceName":"","sourceUrl":""},{"id":435,"slug":"t5-finetuning-model","title":"微调模型","description":"T5 将所有自然语言处理任务，无论是翻译、摘要、分类还是问答，都重塑为文本生成任务。模型接收一段带有任务指令的文本输入，然后直接生成另一段文本作为输出。实现这一点的关键是在输入前添加任务前缀，例如 \"translate English to German: \" 或 \"summarize: \"。这个前缀就像一个自然语言指令，告诉模型现在需要执行什么任务。因此，切换任务时，你只需要改变输入文本中的前缀指令，而完全无需触动模型本身的结构或参数。当下游任务的数据准备好后，你只需要将其构造成“任务前缀 + 输入文本”作为模型输入，以及“目标文本”作为期望的输出。然后，你可以使用标准的序列到序列训练方式，在特定任务的数据上对整个预训练的 T5 模型进行微调，而无需添加任何新的层。","order":5,"sourceName":"","sourceUrl":""},{"id":436,"slug":"t5-finetuning-details","title":"微调细节","description":"T5 的核心思想是“万物皆文本到文本”。这意味着无论是翻译、分类还是问答，所有任务都被统一格式化为：接收一个文本输入，生成一个文本输出。这个统一的框架极大地简化了微调过程。","order":6,"sourceName":"","sourceUrl":""},{"id":437,"slug":"t5-evaluation","title":"评估","description":"评估的核心思想是使用完全相同的模型架构、训练方法和评估流程，在所有任务上进行公平比较。这种统一格式使得可以使用相同的损失函数（交叉熵损失）和相同的评估指标（基于文本匹配的指标，如准确率、BLEU、ROUGE等）来衡量所有任务。","order":7,"sourceName":"","sourceUrl":""}]},{"id":180,"slug":"mqa","title":"MQA","description":"Multi-Query Attention（MQA）是一种优化 Transformer 推理效率的注意力机制，通过共享 Key 和 Value 矩阵来大幅减少 KV Cache 的内存占用。","sourceName":"Fast Transformer Decoding: One Write-Head is All You Need","sourceUrl":"https://arxiv.org/abs/1911.02150","publishedDate":"2019-11-06","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":438,"slug":"mqa-basics","title":"MQA","description":"MQA 是一项非常实用的工程优化技术。它通过一个简单的改变——让多头注意力共享 Key 和 Value——大幅减少了自回归解码时的内存带宽瓶颈，从而实现了解码速度的显著提升，虽然会带来轻微的性能损失，但在绝大多数实际应用场景中，这种速度带来的收益远远大于微小的质量损失。","order":1,"sourceName":"Fast Transformer Decoding: One Write-Head is All You Need","sourceUrl":"https://arxiv.org/abs/1911.02150"}]},{"id":181,"slug":"scaling-law","title":"Scaling Law","description":"在 2020 年之前，AI 社区虽然普遍认同\"模型越大越好\"，但这更多是一种经验性的直觉。这篇论文的贡献在于，它通过大规模、系统性的控制变量实验，将这种直觉量化为可预测的数学规律。研究人员训练了从数百万到数十亿参数不等的系列模型，严格控制其他变量，分别观察模型参数量、数据集大小和训练计算量对最终模型损失的影响。结果发现，在三者不同时受限的情况下，模型性能与每个因素都呈现平滑的幂律关系，这种趋势跨越了多个数量级。这意味着，我们可以根据小规模实验的结果，相对准确地预测出更大规模的模型性能。","sourceName":"Scaling Laws for Neural Language Models","sourceUrl":"https://arxiv.org/abs/2001.08361","publishedDate":"2020-01-23","isFree":false,"isMajor":false,"logoUrl":"","types":["model-philosophy"],"nodes":[{"id":439,"slug":"scaling-law-basics","title":"Scaling Law","description":"语言模型的性能（通常用测试集上的交叉熵损失来衡量）可以以一种可预测的、平滑的幂律方式，随着三个关键因素的增加而提升。这三个关键因素是：模型规模（N）、数据集规模（D）、计算量（C）。","order":1,"sourceName":"Scaling Laws for Neural Language Models","sourceUrl":"https://arxiv.org/abs/2001.08361"}]},{"id":182,"slug":"nvidia-a100","title":"A100","description":"NVIDIA 的 Ampere 架构是其于 2020 年发布的 GPU 架构，代表了当时在 AI 计算、图形渲染和高性能计算领域的一次重大飞跃。Ampere 架构（例如在数据中心 GPU A100 和消费级 GPU GeForce RTX 30 系列中实现）在技术上取得了显著进步，包括采用更先进的制程工艺（如 TSMC 7nm 或定制版 4N 工艺），集成更多晶体管（例如 A100 集成超过 540 亿个晶体管），并引入了第三代 Tensor Core 和第二代 RT Core，大幅提升了 AI 训练推理性能及光追效能。其多实例 GPU（MIG）技术允许将单个 GPU 划分为多个安全、独立的实例，供不同用户和工作负载使用，显著提升了大型数据中心的 GPU 利用率和投资回报率。","sourceName":"NVIDIA A100 Tensor Core GPU Architecture","sourceUrl":"https://images.nvidia.com/aem-dam/en-zz/Solutions/data-center/nvidia-ampere-architecture-whitepaper.pdf","publishedDate":"2020-05-04","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":440,"slug":"nvidia-a100-architecture","title":"A100","description":"英伟达 A100 是基于 **Ampere 架构** 的数据中心 GPU，其 Tensor Core 支持混合精度计算，包括新增的 **TF32** 格式。TF32 可自动兼容 FP32 代码，在无需修改代码的情况下将 AI 训练速度提升 20 倍，同时通过 FP64 精度支持科学计算任务。","order":1,"sourceName":"","sourceUrl":""}]},{"id":183,"slug":"gpt3","title":"GPT-3","description":"在 GPT-3 问世之前，自然语言处理领域的主流范式是“预训练 + 微调”。以 BERT 为代表的模型虽然通过预训练获得了强大的语言理解能力，但在应用到具体任务时，仍然需要大量高质量的标注数据进行微调。这带来了几个明显的痛点：首先，获取大量特定领域的标注数据成本高昂；其次，在小规模标注数据上微调容易导致模型过拟合，即在训练数据上表现很好，但遇到新情况时泛化能力差。OpenAI 在 GPT-2 上已经尝试了在不微调的情况下直接完成多任务（Zero-shot），但效果并不理想。然而，他们坚信“规模效应”的潜力。GPT-3 的核心假设是：当一个语言模型的容量足够大、见过的数据足够多时，它就能将解决各种任务的能力内化在参数中，只需通过几个任务示例（Few-shot）或简单的任务指令（Zero-shot），就能直接推广到新任务上，而无需更新权重。GPT-3 的发布产生了爆炸性影响。它有力地证明了扩大模型规模确实是提升性能的有效路径，直接引发了全球范围内的大模型“军备竞赛”。其“上下文学习”能力为后来的指令微调和提示工程等关键技术奠定了基础，是通向 ChatGPT 和 GPT-4 等模型的关键一步。此外，它展示了通用人工智能的潜力，极大地拓展了人们对 AI 应用场景的想象。","sourceName":"Language Models are Few-Shot Learners","sourceUrl":"https://arxiv.org/abs/2005.14165","publishedDate":"2020-05-28","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["llm"],"nodes":[{"id":441,"slug":"gpt3-training-data","title":"训练数据","description":"GPT-3 的训练数据是一个经过精心筛选和配比的海量、多源、高质量的英文文本混合体。其庞大的规模（数百 GB 的文本，对应近万亿个单词）和多样性是 GPT-3 实现强大“少样本学习”能力的基石，但同时也带来了诸如偏见、虚假信息等重要的社会和伦理问题。","order":1,"sourceName":"","sourceUrl":""},{"id":442,"slug":"gpt3-language-model","title":"语言模型","description":"GPT-3 采用了与它的前身 GPT-2 相似的自回归（Autoregressive）Transformer 解码器架构，这是一个基于注意力机制的模型，在生成文本时，每次只预测下一个词，并且只能关注到该词之前的内容（即单向模型），虽然架构相似，但 GPT-3 的模型规模被极大地扩展了。为了适应巨大的模型尺寸，论文中在一些层使用了局部稀疏注意力的变体，以提高计算效率。","order":2,"sourceName":"","sourceUrl":""},{"id":443,"slug":"gpt3-training-details","title":"训练细节","description":"在 GPT-3 之前，主流 NLP 范式是“预训练+微调”。虽然这种方法很有效，但它存在一个瓶颈：每个新任务都需要准备一个包含成千上万条标注数据的数据集来进行模型微调。这与人类的学习方式截然不同——人类通常只需要几个例子或一段简单的说明就能学会一个新任务。GPT-3 的目标就是挑战这一范式，探索模型是否能够像人类一样，通过“阅读”几个任务示例就直接理解和执行新任务。","order":3,"sourceName":"","sourceUrl":""},{"id":444,"slug":"gpt3-few-shot","title":"Few-shot","description":"当语言模型的规模被极大地扩展后，它能够在无需任何梯度更新或任务特定微调的情况下，仅通过少量的示例或纯文本指令，就能在众多 NLP 任务上达到极具竞争力的性能。这种能力被称为“任务无关的少样本学习”。","order":4,"sourceName":"","sourceUrl":""},{"id":445,"slug":"gpt3-evaluation","title":"评估","description":"GPT-3 的评估结果表明：通过将模型参数规模扩大到 1750 亿，GPT-3 证明了极大规模的语言模型可以实现强大的、任务无关的少样本学习能力；它验证了“提示（Prompting）”而非“微调（Fine-tuning）”作为与模型交互的主要方式的可行性；GPT-3 在众多截然不同的任务上都能表现出不错的竞争力，展示了其作为通用任务求解器的潜力；评估结果也清晰地划定了其能力边界，表明它在抽象推理、消除偏见等方面仍有很大提升空间，并引发了对其安全性和社会影响的广泛讨论。","order":5,"sourceName":"","sourceUrl":""}]},{"id":184,"slug":"gshard","title":"GShard","description":"GShard 提出了一套革命性的自动并行化方法，它基于 Transformer 的编码器-解码器结构，但使用稀疏激活的混合专家层替换了部分标准前馈网络层。MoE 层的核心思想是使用大量（例如数千个）的\"专家\"网络，但针对每个输入，只激活其中极少的一部分。","sourceName":"GShard: Scaling Giant Models with Conditional Computation and Automatic Sharding","sourceUrl":"https://arxiv.org/abs/2006.16668","publishedDate":"2020-06-30","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":446,"slug":"gshard-moe","title":"GShard","description":"GShard 是为了解决大规模神经网络模型（尤其是包含数千亿甚至万亿参数）训练时所面临的巨大挑战，即如何高效地将模型的计算和参数分布到数千个加速器（如 TPU/GPU）上。传统的数据并行（每个设备存一份完整的模型副本）在模型参数超过单个设备内存时就不再适用。GShard 提供了一种自动分片 的解决方案，让研究人员能够用很少的代码修改，轻松实现复杂的并行计算模式。","order":1,"sourceName":"GShard: Scaling Giant Models with Conditional Computation and Automatic Sharding","sourceUrl":"https://arxiv.org/abs/2006.16668"}]},{"id":197,"slug":"switch-transformer","title":"Switch Transformer","description":"Switch Transformer 是深度学习模型缩放史上的一个里程碑式的工作，它将 MoE 这一经典思想与 Transformer 架构巧妙结合，并使其变得简单高效，为今天万亿美元参数级别的大语言模型时代奠定了坚实的基础。最著名的就是 MoE 架构在 GPT-4 中的应用。根据 OpenAI 和微软的论文，GPT-4 很可能是一个采用了类似 MoE 技术的模型。此外，开源社区如 Mistral AI 发布的 Mixtral 8x7B 模型，也直接采用了 MoE（8 个专家）架构。","sourceName":"Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity","sourceUrl":"https://arxiv.org/abs/2101.03961","publishedDate":"2021-01-11","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":470,"slug":"switch-transformer-basics","title":"Switch Transformer","description":"Switch Transformer 的核心目标是**用更少的计算成本来训练和运行参数量极其巨大的模型**。它被认为是通向“万亿参数”甚至更大规模模型的关键技术之一。你可以将 Switch Transformer 理解为一种**智能的“分治”策略**。它通过一个巧妙的“开关”机制，将庞大的模型参数划分给众多专家，让每个输入都能高效地获得“专家级”的服务，而无需为整个“专家团队”付费。","order":1,"sourceName":"Switch Transformers: Scaling to Trillion Parameter Models with Simple and Efficient Sparsity","sourceUrl":"https://arxiv.org/abs/2101.03961"}]},{"id":198,"slug":"zero-offload","title":"ZeRO-Offload","description":"在 ZeRO-Offload 出现之前，训练像 GPT-3 这样拥有千亿参数的模型，需要数百个昂贵的高端 GPU 和复杂的分布式训练技术。这对于大多数研究者和机构来说是遥不可及的。ZeRO-Offload 通过巧妙地将 GPU 内存和计算压力卸载（Offload）到相对廉价的 CPU 和系统内存上，实现了\"平民化\"的大模型训练。","sourceName":"ZeRO-Offload: Democratizing Billion-Scale Model Training","sourceUrl":"https://arxiv.org/abs/2101.06840","publishedDate":"2021-01-18","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":471,"slug":"zero-offload-basics","title":"ZeRO-Offload","description":"在单个 NVIDIA V100 GPU 上，使用标准方法（如 PyTorch）最多只能训练约 14 亿参数的模型。而 ZeRO-Offload 可以在同一块 GPU 上训练超过 130 亿参数的模型，将模型规模提升了近 10 倍。","order":1,"sourceName":"ZeRO-Offload: Democratizing Billion-Scale Model Training","sourceUrl":"https://arxiv.org/abs/2101.06840"}]},{"id":199,"slug":"megatron-lm-3d","title":"Megatron-LM：3D 并行","description":"随着模型规模（参数数量）的爆炸式增长（如从亿级到万亿级），传统的单机多卡甚至简单的数据并行方法遇到了两个根本性瓶颈：\n\n- **内存墙（Memory Wall）**：单个 GPU 的内存容量有限，无法容纳整个大模型（包括参数、梯度、优化器状态等）。例如，一个 1750 亿参数的模型，仅参数以 FP16 格式存储就需要约 350GB 显存，远超当时任何单张 GPU 的容量。\n- **计算墙（Computation Wall）**：训练这些模型需要巨大的计算量（如万亿次浮点运算），如果训练速度太慢，则研究迭代和实际应用都无从谈起。\n\nMegatron-LM 的关键创新在于将三种不同维度的并行策略精巧地结合起来，以在数千个 GPU 上高效地训练万亿参数模型。","sourceName":"Efficient Large-Scale Language Model Training on GPU Clusters Using Megatron-LM","sourceUrl":"https://arxiv.org/abs/2104.04473","publishedDate":"2021-04-09","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":472,"slug":"megatron-lm-3d-parallelism","title":"3D 并行","description":"Megatron-LM 的核心创新在于将三种不同维度的并行策略精巧地结合起来，以在数千个 GPU 上高效地训练万亿参数模型。","order":1,"sourceName":"Efficient Large-Scale Language Model Training on GPU Clusters Using Megatron-LM","sourceUrl":"https://arxiv.org/abs/2104.04473"}]},{"id":200,"slug":"zero-infinity","title":"ZeRO-Infinity","description":"ZeRO-Offload 和 ZeRO-Infinity 是 DeepSpeed 团队提出的两个紧密相关但又有关键区别的技术：\n\n- **ZeRO-Offload** 可以看作是第一代的异构内存训练技术。它的核心思想是将优化器状态和梯度卸载到 CPU 上，利用 CPU 的内存和计算资源。\n- **ZeRO-Infinity** 是第二代技术，它不仅继承了 Offload 的思想，还引入了更激进、更全面的优化，最主要的突破是支持将数据卸载到 NVMe 硬盘，并提供了更高效的内存管理策略。","sourceName":"ZeRO-Infinity: Breaking the GPU Memory Wall for Extreme Scale Deep Learning","sourceUrl":"https://arxiv.org/abs/2104.07857","publishedDate":"2021-04-16","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-training"],"nodes":[{"id":473,"slug":"zero-infinity-basics","title":"ZeRO-Infinity","description":"ZeRO-Infinity 像是一个智能的分层存储数据中心。它把超高速但容量小的缓存（GPU）、速度一般但容量大的内存（CPU）、以及速度慢但容量巨大的仓库（NVMe）统一管理起来。它的目标是从系统层面高效地管理海量数据，而不仅仅是\"救急\"。","order":1,"sourceName":"ZeRO-Infinity: Breaking the GPU Memory Wall for Extreme Scale Deep Learning","sourceUrl":"https://arxiv.org/abs/2104.07857"}]},{"id":201,"slug":"lora","title":"LoRA","description":"这篇于 2021 年由微软研究人员提出的论文《LoRA: Low-Rank Adaptation of Large Language Models》，为解决大语言模型（LLM）在下游任务上微调的成本问题，提出了一种简单却非常有效的方法，极大地推动了高效微调技术的发展。","sourceName":"LoRA: Low-Rank Adaptation of Large Language Models","sourceUrl":"https://arxiv.org/abs/2106.09685","publishedDate":"2021-06-17","isFree":false,"isMajor":false,"logoUrl":"","types":["fine-tuning"],"nodes":[{"id":474,"slug":"lora-basics","title":"LoRA","description":"LoRA（低秩自适应） 的核心思想是在微调预训练大模型时，不更新整个模型的原始权重，而是只优化注入到模型层中的、参数量极小的“低秩矩阵”。由于其出色的效率和无延迟的特性，LoRA 已经成为当今微调大模型最主流和基础的技术之一，并被集成到众多流行的AI框架中。","order":1,"sourceName":"LoRA: Low-Rank Adaptation of Large Language Models","sourceUrl":"https://arxiv.org/abs/2106.09685"}]},{"id":202,"slug":"codex","title":"CodeX","description":"OpenAI 在 2021 年发布的论文《Evaluating Large Language Models Trained on Code》引入了 Codex 模型，该模型是 GitHub Copilot 等 AI 编程助手的核心技术基础，它的核心价值在于系统地论证了通过在大规模代码数据上微调通用大语言模型（如 GPT-3），可以显著提升其代码生成能力。它为此后整个 AI 编程助手领域的发展奠定了重要的方法论和评估基准。","sourceName":"Evaluating Large Language Models Trained on Code","sourceUrl":"https://arxiv.org/abs/2107.03374","publishedDate":"2021-07-07","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["llm"],"nodes":[{"id":475,"slug":"codex-pretraining-model","title":"预训练模型","description":"Codex 是在 GPT-3 的模型架构和权重基础上进行继续训练的。可以把它理解为 GPT-3 的一个“专门化”或“领域化”版本。","order":1,"sourceName":"","sourceUrl":""},{"id":476,"slug":"codex-finetuning-data","title":"微调数据","description":"Codex 的本质是一个在代码上进行微调的大型语言模型。其微调数据主要来自 GitHub 上公开的代码仓库，原始数据并非直接使用，而是经过了严格的清洗和筛选，以确保数据质量。","order":2,"sourceName":"","sourceUrl":""},{"id":477,"slug":"codex-finetuning-model","title":"微调模型","description":"Codex 模型是 AI 编程领域的里程碑。它证明了通过在海量代码上微调大型语言模型，可以获得强大的代码生成能力。它不仅催生了 GitHub Copilot 这样的革命性产品，也为后续的代码大模型的研究和发展奠定了坚实的基础。","order":3,"sourceName":"","sourceUrl":""},{"id":478,"slug":"codex-evaluation","title":"评估","description":"Codex 是一个基于 GPT-3 架构的大型语言模型，专门在来自 GitHub 的公开代码库上进行微调。其核心任务是根据自然语言描述（即函数文档字符串，docstring）生成相应的 Python 代码。其评估框架的核心是 HumanEval 数据集，评估核心指标是 pass@k.","order":4,"sourceName":"","sourceUrl":""}]},{"id":203,"slug":"glam","title":"GLaM","description":"这篇论文的核心思想是：在追求模型规模以提升性能的同时，必须高度重视训练和推理的效率。GLaM 是对当时流行的\"越大越好\"的密集模型（如 GPT-3）的一种高效替代方案。","sourceName":"GLaM: Efficient Scaling of Language Models with Mixture-of-Experts","sourceUrl":"https://arxiv.org/abs/2112.06905","publishedDate":"2021-12-13","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":479,"slug":"glam-basics","title":"GLaM","description":"GLaM 是由 Google 团队提出的一种稀疏激活的混合专家模型。它的核心目标是解决传统大语言模型在规模扩大时面临的计算成本过高的问题。论文的主要贡献是证明了通过更高效的模型架构 MoE，可以在显著减少训练和推理所需计算资源的同时，达到甚至超越同等计算预算下密集模型的性能。","order":1,"sourceName":"GLaM: Efficient Scaling of Language Models with Mixture-of-Experts","sourceUrl":"https://arxiv.org/abs/2112.06905"}]},{"id":204,"slug":"alphacode","title":"AlphaCode","description":"AlphaCode 在著名的竞争性编程平台 Codeforces 的比赛中进行了评估，其表现估计相当于人类参赛者的前 54%。这意味着它首次在真正的编程竞赛中展现了与人类竞争者相媲美的能力。虽然都是代码生成模型，但 Codex 主要解决的是相对简单的、描述清晰的函数级问题（如 HumanEval），而 AlphaCode 挑战的是需要复杂推理、算法创新和多种步骤整合的完整编程问题。","sourceName":"Competition-Level Code Generation with AlphaCode","sourceUrl":"https://arxiv.org/abs/2203.07814","publishedDate":"2022-02-08","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":480,"slug":"alphacode-pretrain-data","title":"预训练数据","description":"预训练阶段的目标是让模型学习广泛的编程语法、语义、逻辑以及自然语言与代码的对应关系。这为模型打下了坚实的代码基础。","order":1,"sourceName":"","sourceUrl":""},{"id":481,"slug":"alphacode-pretrain-model","title":"预训练模型","description":"AlphaCode 的预训练模型是一个以 T5 的 Encoder-Decoder 架构为蓝图，但在模型规模、训练数据和后续微调/推理策略上都进行了极致优化和创新的、专门为解决复杂代码生成任务而设计的系统。\n\nT5 的核心思想是将所有的 NLP 任务都统一为“文本到文本”的格式。这意味着无论是翻译、摘要还是问答，模型的输入和输出都是文本字符串。这对于代码生成任务来说是天然契合的，因为代码生成本质上就是“将问题描述文本（自然语言）转换为解决方案代码（编程语言）”的文本到文本任务。","order":2,"sourceName":"","sourceUrl":""},{"id":482,"slug":"alphacode-finetune-data","title":"微调数据","description":"尽管预训练模型已经很强，但要解决复杂的竞争性编程问题，还需要在特定领域的数据上进行微调。这是 AlphaCode 能够达到“竞赛水平”的关键。微调数据专门来自多个竞争性编程平台，创建了一个名为 CodeContests 的数据集。","order":3,"sourceName":"","sourceUrl":""},{"id":483,"slug":"alphacode-finetune-model","title":"微调模型","description":"预训练模型就像一个“通才”，它懂语法，能写各种代码，但它不一定理解竞争编程中特有的问题描述方式、复杂的算法要求（如动态规划、图论）和严格的输入输出格式。微调的目的就是让模型专门化，使其更擅长解决竞争编程这类特定、复杂的问题。","order":4,"sourceName":"","sourceUrl":""},{"id":484,"slug":"alphacode-evaluation","title":"评估","description":"AlphaCode 的核心目标是解决竞争级别的编程问题，这类问题远比简单的代码补全或根据注释生成代码要复杂。它们通常涉及：复杂的自然语言理解、算法推理能力、创造性问题解决。为了准确评估 AlphaCode 在这方面的能力，论文在Codeforces 上进行评估，评估过程模拟了一个人类参赛者参加 Codeforces 比赛的真实场景：将问题的自然语言描述（包括示例）输入给 AlphaCode；AlphaCode 不是只生成一个答案，而是利用其大规模模型，为每个问题生成大量的候选代码方案（数量级在成千上万）；生成的方案大部分是错误的，系统会通过运行示例测试用例等方式，过滤掉大部分明显错误的方案，最终为每个问题只保留一个极小数量（例如10个左右）的、最有可能正确的方案进行提交。这模仿了人类选手在提交前进行测试、并拥有有限提交次数的行为。","order":5,"sourceName":"","sourceUrl":""}]},{"id":205,"slug":"instructgpt","title":"instructGPT","description":"InstructGPT 是 OpenAI 在 GPT-3 之后提出的一种关键模型，它标志着人工智能对齐领域的一个重要里程碑。其核心思想是：与其一味地追求模型变大，不如通过人类反馈来教导模型更好地理解和遵循人类的意图。","sourceName":"Training language models to follow instructions with human feedback","sourceUrl":"https://arxiv.org/abs/2203.02155","publishedDate":"2022-03-04","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["llm"],"nodes":[{"id":485,"slug":"instructgpt-pretrain","title":"预训练模型（使用 GPT-3）","description":"InstructGPT 并不是一个从零开始训练的模型，而是以预训练好的 GPT-3 系列模型作为“基石”或“起点”，通过人类反馈强化学习 RLHF，对其进行“改造”和“优化”后得到的产物。","order":1,"sourceName":"","sourceUrl":""},{"id":486,"slug":"instructgpt-sft","title":"有监督微调（SFT）","description":"在 InstructGPT 的三大阶段训练流程中，有监督微调（SFT）是至关重要的第一步，它为后续的奖励模型训练和强化学习优化奠定了基础。其核心目标是让预训练好的 GPT-3 模型初步获得“听懂指令并按要求生成回答”的能力。简单来说，SFT 阶段就像是给一位知识渊博但缺乏特定技能的学生（GPT-3）请了一位启蒙老师。","order":2,"sourceName":"","sourceUrl":""},{"id":487,"slug":"instructgpt-rm","title":"奖励模型训练（RM）","description":"在 SFT（有监督微调）阶段，模型学会了“模仿”人类提供的标准答案。但现实世界的问题往往没有唯一解，不同答案在“有用性”、“真实性”、“无害性”等方面可能存在细微差别。RM 的目标就是将这些抽象、主观的“偏好”量化成一个具体的分数。其核心思想是：不再追求一个“标准答案”，而是学习一个“比较标准”。即，对于同一个问题，如果回答 A 比回答 B 更受人类喜欢，那么 RM 就应该给 A 打出比 B 更高的分数。这是一种相对评价，而非绝对评价，这更符合人类判断的思维方式。","order":3,"sourceName":"","sourceUrl":""},{"id":488,"slug":"instructgpt-rl","title":"对齐-强化学习优化（RL）","description":"在 InstructGPT 的三大阶段训练流程中，强化学习优化（RL）是最终也是最关键的一步。它的核心目标是，利用第二步训练好的奖励模型（RM）作为“裁判”，通过近端策略优化（PPO）算法，引导初始的有监督微调（SFT）模型生成更符合人类偏好的回答。","order":4,"sourceName":"","sourceUrl":""},{"id":489,"slug":"instructgpt-evaluation","title":"评估","description":"经过 RLHF 训练的模型，是否真的更符合人类的意图和价值观？综合所有评估维度，InstructGPT 模型在最重要的指标（人类偏好）上表现卓越，在安全性和真实性上也有大幅提升，同时仅以最小的代价牺牲了部分传统 NLP 任务的性能。这充分证明了 RLHF 是对齐大型语言模型的一条有效路径。","order":5,"sourceName":"","sourceUrl":""}]},{"id":206,"slug":"h100","title":"H100","description":"Hopper 架构是 NVIDIA 为数据中心和极致 AI 计算需求打造的第九代 GPU 架构，其首款产品 H100 展现了多项突破性技术创新：革命性的 Transformer 引擎是 H100 的核心亮点，它能够动态处理 FP8 和 16 位精度数据，专门为训练和运行当今主流的大型语言模型（LLMs）等 Transformer 模型优化，官方数据显示可带来数倍至数十倍的性能提升；通过第四代 NVLink 和新的 NVLink Switch 系统，可以将多达 256 个 H100 GPU 连接在一起，构建高效的 AI 超级计算机，以应对万亿参数级别的巨型模型；H100 拥有 800 亿个晶体管，采用台积电 4N 工艺，是首款支持 HBM3 内存和 PCIe 5.0 的 GPU，内存带宽高达 3TB/s。它还支持机密计算，能更好地保护 AI 模型和客户数据隐私。","sourceName":"NVIDIA H100 Tensor Core GPU Architecture","sourceUrl":"https://resources.nvidia.com/en-us-hopper-architecture/nvidia-h100-tensor-c","publishedDate":"2022-03-22","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":490,"slug":"h100-architecture","title":"H100","description":"英伟达 H100 是一款基于 Hopper 架构的数据中心 GPU，其最亮眼的技术创新是引入了第四代张量核心和专用的 Transformer 引擎。","order":1,"sourceName":"","sourceUrl":""}]},{"id":207,"slug":"chinchilla","title":"Chinchilla","description":"这篇发表于 2022 年 NeurIPS 会议、由 DeepMind 团队完成的论文《Training Compute-Optimal Large Language Models》（通常以其模型名 Chinchilla 指代），对当时大型语言模型的训练范式产生了深远影响。它通过严谨的实验挑战了\"模型越大越好\"的普遍观念，指出在给定计算预算下，扩大模型参数和增加训练数据量同等重要。","sourceName":"Training Compute-Optimal Large Language Models","sourceUrl":"https://arxiv.org/abs/2203.15556","publishedDate":"2022-03-29","isFree":false,"isMajor":false,"logoUrl":"","types":["model-philosophy"],"nodes":[{"id":491,"slug":"chinchilla-scaling-law","title":"Chinchilla","description":"Chinchilla（又称 Chinchilla 70B）是 DeepMind 为了验证“计算最优”训练定律而训练的一个大型语言模型。它的核心结论是：与其一味地增加模型参数，同等规模地增加训练数据量才是更高效利用计算预算的关键。","order":1,"sourceName":"Training Compute-Optimal Large Language Models","sourceUrl":"https://arxiv.org/abs/2203.15556"}]},{"id":208,"slug":"llm-int8","title":"LLM.int8()","description":"这篇论文的核心是解决大语言模型推理时显存占用过高的问题，提出了一种 8 位整数量化方法，使得在不损失模型性能的前提下，将模型显存占用降低约一半。","sourceName":"LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale","sourceUrl":"https://arxiv.org/abs/2208.07339","publishedDate":"2022-08-15","isFree":false,"isMajor":false,"logoUrl":"","types":["quantization"],"nodes":[{"id":492,"slug":"llm-int8-method","title":"LLM.int8()","description":"像 GPT-3（175B 参数）这样的巨型模型，如果用标准的 16 位或 32 位浮点数加载，需要数百 GB 的 GPU 内存，这远远超出了普通消费级显卡的能力，使得大模型推理成本高昂且难以普及。\n\n简单的 8 位量化虽然能减少内存占用，但当应用于超过 60 亿参数的大模型时，会导致模型性能（如推理准确度）急剧下降，无法实用。\n\nLLM.int8() 是一种创新的量化技术，它的核心目标是：在不损失模型性能的前提下，将大型语言模型（LLM）的推理内存占用减半。首先，你需要理解大模型性能下降的根源在于 “异常值特征” 的出现，然后再了解LLM.int8() 的解决方案是一个“混合精度”的两阶段过程：向量化绝对值量化和混合精度分解。","order":1,"sourceName":"LLM.int8(): 8-bit Matrix Multiplication for Transformers at Scale","sourceUrl":"https://arxiv.org/abs/2208.07339"}]},{"id":209,"slug":"cot","title":"COT","description":"这篇 Paper 是思维链（CoT）领域的开创性工作，它提出了一种简单而有效的方法——链式思维提示（Chain-of-Thought Prompting）。该方法的核心是让大语言模型在解答复杂问题时，不是直接输出答案，而是先生成一系列连续的、类似人类思考的中间推理步骤（即\"思维链\"），最后再得出最终答案。","sourceName":"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models","sourceUrl":"https://arxiv.org/abs/2201.11903","publishedDate":"2022-02-28","isFree":false,"isMajor":false,"logoUrl":"","types":["agent"],"nodes":[{"id":493,"slug":"cot-basics","title":"COT","description":"这篇 Paper 是思维链（CoT）领域的开创性工作，它提出了一种简单而有效的方法——链式思维提示（Chain-of-Thought Prompting）。该方法的核心是让大语言模型在解答复杂问题时，不是直接输出答案，而是先生成一系列连续的、类似人类思考的中间推理步骤（即\"思维链\"），最后再得出最终答案。","order":1,"sourceName":"Chain-of-Thought Prompting Elicits Reasoning in Large Language Models","sourceUrl":"https://arxiv.org/abs/2201.11903"}]},{"id":210,"slug":"flashattention","title":"FlashAttention","description":"传统自注意力机制的时间和内存复杂度与序列长度呈二次方关系，导致序列变长时，模型训练和推理变得非常缓慢且消耗大量内存。虽然一些近似注意力方法试图通过降低模型质量来减少计算量，但往往无法实现实际运行速度的提升。论文指出，以往的这些方法忽略了一个关键原则：让注意力算法具备 IO 感知能力。即，需要充分考虑数据在 GPU 不同层级内存（如高速显存 HBM 和片上缓存 SRAM）之间的读写开销。FlashAttention 的核心创新正是通过分块和重计算技术，显著减少在 HBM 和 SRAM 之间读写中间结果的次数，通过优化内存读写效率，在不牺牲计算精度的前提下，大幅提升了注意力机制的速度并降低了内存消耗，使得处理长序列数据变得更为可行。","sourceName":"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness","sourceUrl":"https://arxiv.org/abs/2205.14135","publishedDate":"2022-05-27","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":494,"slug":"flashattention-basics","title":"FlashAttention","description":"传统自注意力机制的时间和内存复杂度与序列长度呈二次方关系，导致序列变长时，模型训练和推理变得非常缓慢且消耗大量内存。虽然一些近似注意力方法试图通过降低模型质量来减少计算量，但往往无法实现实际运行速度的提升。论文指出，以往的这些方法忽略了一个关键原则：让注意力算法具备 IO 感知能力。即，需要充分考虑数据在 GPU 不同层级内存（如高速显存 HBM 和片上缓存 SRAM）之间的读写开销。FlashAttention 的核心创新正是通过分块和重计算技术，显著减少在 HBM 和 SRAM 之间读写中间结果的次数，通过优化内存读写效率，在不牺牲计算精度的前提下，大幅提升了注意力机制的速度并降低了内存消耗，使得处理长序列数据变得更为可行。","order":1,"sourceName":"FlashAttention: Fast and Memory-Efficient Exact Attention with IO-Awareness","sourceUrl":"https://arxiv.org/abs/2205.14135"}]},{"id":211,"slug":"llama1","title":"LLaMA-1","description":"LLaMA 1 的核心在于其独特的研究目标：它并非追求最大的参数量，而是旨在给定的推理预算下实现最高的性能，从而挑战了“模型越大越好”的观念，更加注重实际应用效率。为实现这一目标，它采用了“更多数据训练较小模型”的关键策略，例如其 7B 参数模型使用了 1 万亿 token 进行训练，这验证了 Chinchilla 缩放定律，即在计算受限时，增加数据量比单纯放大模型更有效。\r\n\r\n在技术实现上，它并未发明新架构，而是集成了当时多项经过验证的改进，如预归一化、SwiGLU 激活函数和旋转位置编码，形成了一个稳定高效的现代 Transformer 基础。尤为重要的是，它完全基于公开可用的数据集进行训练，证明了无需依赖私有数据也能构建顶尖能力，极大地推动了研究的民主化。最终，其性能表现卓越：LLaMA-13B 在多数基准测试上超越了庞大的 GPT-3，而 LLaMA-65B 则能与当时最先进的 Chinchilla-70B 和 PaLM-540B 等巨型模型相媲美，全面印证了其核心路径的成功。","sourceName":"LLaMA: Open and Efficient Foundation Language Models","sourceUrl":"https://arxiv.org/pdf/2302.13971","publishedDate":"2023-02-27","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/meta.png","types":["llm"],"nodes":[{"id":495,"slug":"llama1-data","title":"数据","description":"LLaMA-1 的核心特点是完全使用公开可用的数据集，证明了无需专有数据也能训练出顶尖模型。","order":1,"sourceName":"","sourceUrl":""},{"id":496,"slug":"llama1-model","title":"模型","description":"LLaMA 本身没有发明新架构，而是精心集成并验证了当时最有效的 Transformer 改进，如预归一化（RMSNorm）、SwiGLU 激活函数和旋转位置编码（RoPE），形成了一个非常稳定和高效的模型基础。","order":2,"sourceName":"","sourceUrl":""},{"id":497,"slug":"llama1-training-details","title":"训练细节","description":"LLaMA-1 的训练细节体现了其“在给定推理预算下实现最佳性能”的核心设计哲学。在高效实现上，它采用了 xformers 库中的因果多头注意力，避免计算被掩码的权重以节省内存和计算；同时广泛使用激活检查点，通过牺牲计算换显存的方式，仅保存线性层等关键激活，支持了更大模型或批次的训练。其并行策略结合了模型并行（主要是张量并行，将模型参数横切到多个 GPU）和序列并行（将输入序列纵切以分摊中间激活的显存），从而将巨大的 65B 模型成功载入并高效训练，而未采用可能引入更多等待时间的流水线并行。这一切都运行在强大的训练基础设施之上，其使用 2048 张 A100-80GB GPU，并采用模型与序列并行、计算-通信重叠等技术来优化吞吐量，同时关注碳足迹等工程实践，最终在万亿级 token 的公开数据上训练出了性能卓越的基础模型。","order":3,"sourceName":"","sourceUrl":""},{"id":498,"slug":"llama1-base-model-evaluation","title":"基础模型评估","description":"LLaMA-1 对其基础模型（即未经指令微调的预训练模型）进行了全面而严格的评估，主要采用零样本和少样本评估，这与 GPT-3 等模型的评估方式一致，旨在检验模型的固有能力和泛化性，而非针对特定任务的拟合能力。主要涵盖常识推理、闭卷问答、阅读理解、数学推理、代码生成、大规模多任务语言理解等超过 20 个公认的基准测试。","order":4,"sourceName":"","sourceUrl":""},{"id":499,"slug":"llama1-instruction-tuning","title":"指令微调","description":"指令微调并不是原始 LLaMA-1 基础模型论文的核心贡献。该论文主要聚焦于如何高效地预训练一个强大的基础模型。然而，论文在最后一部分简要地展示了指令微调的巨大潜力，这为后续如 Alpaca、Vicuna 等模型的发展指明了方向。","order":5,"sourceName":"","sourceUrl":""}]},{"id":212,"slug":"flashattention-2","title":"FlashAttention-2","description":"FlashAttention-2 是经典 IO 优化算法 FlashAttention 的升级版本。它在完整保留 v1 内存高效优势的同时，专注于攻克其遗留的“计算墙”问题。该问题是指 v1 虽已解决“显存墙”，但其计算效率仅达到 GPU 理论峰值的 25% 至 40%。FlashAttention-2 通过更充分地利用 GPU 的并行计算能力，旨在使精确注意力机制的效率逼近高度优化的矩阵乘法（GEMM）操作的水平。","sourceName":"FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning","sourceUrl":"https://arxiv.org/abs/2307.08691","publishedDate":"2023-07-17","isFree":false,"isMajor":false,"logoUrl":"","types":["llm-tech"],"nodes":[{"id":500,"slug":"flashattention-2-basics","title":"FlashAttention-2","description":"FlashAttention-2 是经典 IO 优化算法 FlashAttention 的升级版本。它在完整保留 v1 内存高效优势的同时，专注于攻克其遗留的“计算墙”问题。该问题是指 v1 虽已解决“显存墙”，但其计算效率仅达到 GPU 理论峰值的 25% 至 40%。FlashAttention-2 通过更充分地利用 GPU 的并行计算能力，旨在使精确注意力机制的效率逼近高度优化的矩阵乘法（GEMM）操作的水平。","order":1,"sourceName":"FlashAttention-2: Faster Attention with Better Parallelism and Work Partitioning","sourceUrl":"https://arxiv.org/abs/2307.08691"}]},{"id":213,"slug":"llama2","title":"LLaMA-2","description":"LLaMA-2 是 Meta 发布的一系列开源大语言模型，涵盖从 70 亿到 700 亿参数的规模，其核心贡献在于推出了专为对话优化的 Llama 2-Chat 模型。该模型在预训练阶段将上下文长度扩展至 4K token 并使用了 2 万亿 token 的高质量数据；其关键创新在于采用了多轮、细粒度的人类反馈强化学习（RLHF）对齐技术，通过训练分别针对帮助性和安全性的独立奖励模型，并运用拒绝采样和近端策略优化进行多轮迭代微调，显著提升了对话质量。同时，论文特别强调安全性，引入了红队测试和安全上下文蒸馏等方法来降低有害输出。评估表明，Llama 2-Chat 在多数公开基准测试上超越了同规模开源模型，并在人类评估中接近部分闭源模型性能，加之其允许商业使用的开源策略，为业界构建安全、实用的对话 AI 提供了重要基础。","sourceName":"Llama 2: Open Foundation and Fine-Tuned Chat Models","sourceUrl":"https://arxiv.org/abs/2307.09288","publishedDate":"2023-07-18","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/meta.png","types":["llm"],"nodes":[{"id":501,"slug":"llama2-pretraining-data","title":"预训练数据","description":"Llama 2 的预训练数据是一个全新的、混合了多种公开来源的大规模语料库，其总量超过了 2 万亿个 token，相比前代 Llama 1 的 1.4 万亿 token 规模提升了约 40%。论文强调，其工作的核心焦点并非披露具体的数据源混合配方，而是致力于大幅提升数据的质量与安全性。为此，研究团队实施了严格的数据清洗流程，包括应用先进的数据去重技术，并特别加强了针对隐私信息（PII）和有害内容的安全过滤，旨在从预训练的源头就为模型构建起更安全、更可靠的知识基础。","order":1,"sourceName":"","sourceUrl":""},{"id":502,"slug":"llama2-pretraining-model","title":"预训练模型","description":"Llama 2 是一系列开源的大语言预训练模型，其规模涵盖从 70 亿到 700 亿参数。该系列模型作为基础模型，为后续专为对话优化的 Llama 2-Chat 模型提供了强大的能力基石。其架构基于经典的 Transformer Decoder 并进行了关键优化：将上下文长度扩展至 4096 个 token，并在更大的模型（如 70B 版本）中引入了分组查询注意力（GQA）机制，从而在保持模型性能的同时显著提升了推理速度。","order":2,"sourceName":"","sourceUrl":""},{"id":503,"slug":"llama2-pretraining-details","title":"预训练细节","description":"Llama 2 的预训练在上下文长度和训练策略上进行了关键性优化。其核心突破之一是将上下文长度从 Llama 1 的 2048 个 token 显著扩展至 4096 个 token，这主要通过结合创新的旋转位置编码（RoPE）和高效的训练方法实现。在训练策略上，研究团队采用了经过精心调优的 AdamW 优化器并结合余弦学习率调度器，同时运用梯度裁剪和权重衰减等技术来确保训练过程的稳定性。为应对长序列和大模型带来的显存挑战，训练中还集成了激活检查点（以计算换显存）和模型并行技术，从而在庞大的 2 万亿 token 数据集上高效地完成了模型训练，为后续的对话微调奠定了强大且可靠的基础。","order":3,"sourceName":"","sourceUrl":""},{"id":504,"slug":"llama2-base-model-evaluation","title":"基础模型评估","description":"和 LLaMA-1 一样，LLaMA-2 对其基础模型（即未经指令微调的预训练模型）进行了全面而严格的评估，主要采用零样本和少样本评估，这个评估方式最早可以追溯到 GPT-3，旨在检验模型的固有能力和泛化性，而非针对特定任务的拟合能力。主要涵盖常识推理、闭卷问答、阅读理解、数学推理、代码生成、大规模多任务语言理解等超过 20 个公认的基准测试。","order":4,"sourceName":"","sourceUrl":""},{"id":505,"slug":"llama2-sft","title":"SFT","description":"Llama 2 的 SFT 阶段是将其预训练基础模型优化为对话模型（Llama 2-Chat）的初始关键步骤，该阶段通过使用数万条高质量的人工编写的指令-应答配对数据进行有监督的微调，核心目标是让模型学会基本的指令遵循能力与对话格式，从而快速获得一个初始的、具备基本对话能力的模型版本，为后续更精细的 RLHF 优化奠定必要的基础。\n\n我们在 instructGPT 那边已经学过了 SFT，往后它将成为 Chat 模型的标配。","order":5,"sourceName":"","sourceUrl":""},{"id":506,"slug":"llama2-rlhf","title":"RLHF","description":"Llama 2 的 RLHF 阶段是在 SFT 获得初步对话模型后，通过三步骤流程进一步优化模型帮助性与安全性的核心过程：首先，基于人类对多个回答的偏好数据，分别训练专注于评估回答质量的帮助性奖励模型和判断内容风险的安全性奖励模型；然后，利用这两个奖励模型作为“裁判”，通过近端策略优化（PPO）和拒绝采样等强化学习算法对模型进行多轮迭代微调，其中 PPO 持续优化策略以追求更高奖励，而拒绝采样则从多个候选回答中择优；同时，该阶段还集成了红队测试生成对抗性指令来提升模型稳健性，并采用安全上下文蒸馏将安全准则内化到模型中。最终，这一精细化的 RLHF 流程使得 Llama 2-Chat 在人类评估中既能提供极具帮助的回答，又能显著降低有害输出，从而成为接近闭源模型水平的开源对话 AI。\n\n我们在 instructGPT 见过 RLHF，往后它将成为 Chat 模型的标配。","order":6,"sourceName":"","sourceUrl":""},{"id":507,"slug":"llama2-chat-model-evaluation","title":"对话模型评估","description":"微调后的 Llama 2-Chat 模型通过一套包含自动基准测试和大规模人类评估的严谨体系进行评估，其核心结论是：Llama 2-Chat 在大多数测试基准上的表现优于其他开源对话模型，并且基于人类对帮助性和安全性的评估，它被认为是闭源模型（如 ChatGPT）的一个可行替代品；该评估特别强调了模型的安全性，通过红队测试和迭代优化，其生成有害内容的比率显著降低，从而验证了从监督微调（SFT）到多轮人类反馈强化学习（RLHF）这一完整微调流程的有效性，为开源社区提供了一个强大且负责任的对话模型新标杆。","order":7,"sourceName":"","sourceUrl":""}]},{"id":214,"slug":"qwen-1","title":"Qwen-1","description":"Qwen-1 是通义千问大语言模型系列的首个版本，它是一个综合性的模型系列，包含了参数量不同的多种模型。该系列主要涵盖基础预训练模型（Qwen）和经过人类对齐技术微调的对话模型（Qwen-Chat）。其中，基础模型在众多下游任务中展现出卓越性能，而对话模型，特别是通过人类反馈强化学习（RLHF）训练的版本，具备高度竞争力，拥有先进的工具使用和规划能力，甚至能在代码解释器等复杂任务中与更大规模的模型媲美。此外，基于基础模型，团队还开发了专注于代码生成的 Code-Qwen 和专注于数学解题的 Math-Qwen 等专业模型，这些模型在各自领域相比开源模型性能显著提升，与闭源商业模型的差距也微乎其微。","sourceName":"Qwen Technical Report","sourceUrl":"https://arxiv.org/abs/2309.16609","publishedDate":"2023-09-28","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/qwen.jpeg","types":["llm"],"nodes":[{"id":508,"slug":"qwen-1-pretraining-data","title":"预训练数据","description":"Qwen 的技术报告并未详细介绍 Qwen-1 预训练数据的具体构成，但基于社区推断 Qwen-1 的预训练数据是一个经过精心构建的大规模、高质量语料库，其数据来源主要包括 Common Crawl 和 RefinedWeb 等通用网页爬虫数据、百科与书籍数据、学术论文以及来自 GitHub 等平台的代码数据，总规模约为 3 万亿个 token；这些数据经过了严格的去重、过滤和清洗流程，并以中文和英文为核心（中英文 token 比例接近 1:1），同时包含其他语言，其显著特点是通用知识与代码数据并重，为模型强大的通用能力、代码及数学专项能力奠定了坚实基础。","order":1,"sourceName":"","sourceUrl":""},{"id":509,"slug":"qwen-1-pretraining-model","title":"预训练模型","description":"Qwen-1 的预训练模型是该系列的基础语言模型（Qwen, the base pretrained language models）。这些基础模型在众多下游任务上持续表现出卓越的性能，是构建聊天模型（Qwen-Chat）和专业模型（如 Code-Qwen, Math-Qwen）的基石。它的预训练模型架构基本上和 LLaMA-2 类似。","order":2,"sourceName":"","sourceUrl":""},{"id":510,"slug":"qwen-1-pretraining-details","title":"预训练细节","description":"Qwen-1 架构上融合了 RoPE 位置嵌入、SwiGLU 激活函数和 Pre-Norm 设计，并在注意力层添加偏置以增强外推能力。预训练采用自回归语言建模，上下文长度 2048，使用 Flash Attention 加速计算，优化器为 AdamW（β1 = 0.9, β2 = 0.95），并应用余弦学习率调度。通过 NTK-aware 插值和窗口注意力等技术，模型在推理时可扩展上下文长度至 8192 以上。","order":3,"sourceName":"","sourceUrl":""},{"id":511,"slug":"qwen-1-base-model-evaluation","title":"基础模型评估","description":"该评估体系旨在全面衡量基础语言模型（未经对齐微调）的通用能力，共覆盖了 7 个主流基准测试，具体包括：\n\n- MMLU（5-shot）和 C-Eval（5-shot）用于评估综合知识与推理能力\n- GSM8K（8-shot）和 MATH（4-shot）用于测试数学解题能力\n- HumanEval（0-shot）和 MBPP（0-shot）用于衡量代码生成能力\n- BBH（3-shot）用于考察复杂推理能力\n\n实验结果表明，Qwen-1 系列模型（1.8B、7B、14B）在所有下游任务中均表现出色，其中 Qwen-14B 在 3 项任务上超越了参数规模更大的 LLaMA2-70B，而 Qwen-7B 也显著优于 LLaMA2-13B，甚至参数最少的 Qwen-1.8B 在特定任务中也能与更大模型竞争，凸显了其卓越的参数效率；此外，通过结合 NTK-aware 插值、LogN-Scaling 和分层窗口分配等技术，模型在超过 8192 token 的长上下文环境下仍能有效维持性能。整体评估充分验证了 Qwen 基础模型在不同参数规模下均具备均衡而强大的核心能力。","order":4,"sourceName":"","sourceUrl":""},{"id":512,"slug":"qwen-1-sft","title":"SFT","description":"Qwen-1 的 SFT 阶段是将其预训练基础模型优化为对话模型（Qwen-Chat）的初始关键步骤，该阶段通过使用数万条高质量的人工编写的指令-应答配对数据进行有监督的微调，核心目标是让模型学会基本的指令遵循能力与对话格式，从而快速获得一个初始的、具备基本对话能力的模型版本，为后续更精细的 RLHF 优化奠定必要的基础。\n我们在 instructGPT 和 LLaMA-2 那边已经学过了 SFT，往后它将成为 Chat 模型的标配。","order":5,"sourceName":"","sourceUrl":""},{"id":513,"slug":"qwen-1-rlhf","title":"RLHF","description":"Qwen-1 的 RLHF 阶段是一个系统性的对齐流程，旨在通过三步骤——首先利用监督微调（SFT）获得高质量的初始对话模型，继而训练奖励模型（RM）以量化人类偏好，最终采用强化学习（如 PPO）基于奖励信号优化模型策略——将模型行为与复杂的人类价值观深度对齐，从而显著提升其对话质量、安全性和实用性，最终打造出在工具使用、代码解释等复杂任务上极具竞争力的 Qwen-Chat 模型。\n我们在 instructGPT 和 LLaMA-2 那边已经学过了 RLHF，往后它将成为 Chat 模型的标配。","order":6,"sourceName":"","sourceUrl":""},{"id":514,"slug":"qwen-1-chat-model-evaluation","title":"对话模型评估","description":"Qwen-Chat 模型是经过人类对齐技术微调的聊天模型，这些模型极具竞争力。评估重点强调了其先进的工具使用和规划能力，使其能够用于创建智能体应用。即使在像使用代码解释器这样的复杂任务上，与规模更大的模型相比，其性能也令人印象深刻。此外，基于基础模型开发的代码专用模型（Code-Qwen-Chat）和数学专用模型（Math-Qwen-Chat）的性能相较于开源模型有显著提升，与闭源的专有模型相比差距微小。","order":7,"sourceName":"","sourceUrl":""}]},{"id":215,"slug":"mistral-7b","title":"Mistral 7B","description":"Mistral 7B 模型旨在实现卓越的性能与高效的推理效率，其在所有评估基准测试中均超越了参数量更大的 Llama 2 13B 模型，甚至在推理、数学和代码生成能力上超过了 Llama 1 34B 模型。为实现高效能，模型采用了分组查询注意力（GQA）以加速推理，并结合滑动窗口注意力（SWA）来以更低的成本有效处理任意长序列。论文还介绍了经过指令微调 SFT 的 Mistral 7B - Instruct 模型，该模型在人类评估和自动化基准测试中都优于 Llama 2 13B - Chat 模型。最终，所有模型均以宽松的 Apache 2.0 开源许可证发布，允许广泛的商业和研究使用。","sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825","publishedDate":"2023-10-10","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/mistral.png","types":["llm"],"nodes":[{"id":515,"slug":"mistral-7b-pretraining-data","title":"预训练数据","description":"Mistral AI 官方并未在原始论文中像其他一些模型（如 LLaMA）那样公开发布其预训练数据的完整细节。不过，根据行业惯例、模型表现出的能力以及官方的一些零星信息，我们可以对其预训练数据的特点进行一些推断和介绍：\n\n- **大规模与多样性**：作为一个拥有 70 亿参数的高性能模型，其预训练数据必定是海量且多样化的。这通常包括来自互联网的庞大文本集合，如网页、书籍、学术论文、新闻文章、代码库等，以确保模型获得广泛的语言知识和世界知识。\n- **多语言能力**：尽管 Mistral 7B 主要针对英语进行了优化，但其在预训练数据中很可能包含了相当比例的其他语言数据（特别是欧洲语言），这使得模型具备了一定的多语言理解和生成能力。\n- **代码数据**：论文明确指出 Mistral 7B 在代码生成方面表现优异，甚至超过了更大的模型。这强烈暗示其预训练数据中包含了大量高质量的代码数据（例如来自 GitHub 等平台的公开代码库），这是其强大编程能力的关键来源。\n- **数据质量与过滤**：为了达到更高的性能标准，Mistral AI 团队很可能对原始数据进行了严格的清洗、去重和质量过滤，以去除低质量、重复或有害的内容，确保数据集的精炼和高效。\n\n备注：无模块数据","order":1,"sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825"},{"id":516,"slug":"mistral-7b-pretraining-model","title":"预训练模型","description":"Mistral 7B 的预训练模型架构是一个经过优化的 Decoder-Only Transformer 模型。其核心竞争力在于成功地将 GQA 和 SWA 这两种高效的注意力机制集成到架构中，使得这个 70 亿参数的模型在保持高性能的同时，实现了更快的推理速度和更优的长序列处理能力，这正是在各项评测中能够超越更大规模模型的关键技术基础。","order":2,"sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825"},{"id":517,"slug":"mistral-7b-pretraining-details","title":"预训练细节","description":"Mistral AI 在其官方发布的技术报告或论文中，通常不会像其他机构（如 Meta 的 LLaMA）那样披露非常详尽的预训练超参数和数据构成。\n\n备注：无模块数据","order":3,"sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825"},{"id":518,"slug":"mistral-7b-base-model-evaluation","title":"基础模型评估","description":"为了确保对比的公平性，论文作者重新使用自己的评估流程运行了所有模型的基准测试，评估涵盖了一系列广泛认可的标准测试，包括常识推理（0-shot）、世界知识（5-shot）、阅读理解（0-shot）、数学能力（使用多数投票策略）、代码生成以及 MMLU 等综合能力聚合指标。详细的评估数据表明，Mistral 7B 在所有评估指标上均超越了参数更多的 Llama 2 13B 模型，例如在综合基准 MMLU 上达到 60.1%；尤其在代码、数学和推理领域表现卓越，其性能甚至超过了参数量达 340B 的 Llama 1 34B 模型，在 HumanEval 上接近专为代码微调的 Code-Llama 7B。进一步的效率分析还提出了“等效模型尺寸”概念，指出 Mistral 7B 在推理和理解任务上的性能相当于规模是其 3 倍以上的 Llama 2 模型，充分证明了其架构的高效性。\n\n备注：无模块数据","order":4,"sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825"},{"id":519,"slug":"mistral-7b-sft","title":"SFT","description":"Mistral 7B 的 SFT 阶段旨在评估其基础模型的泛化能力，整个过程强调简洁与透明。研究人员仅在 Hugging Face 仓库的公开指令数据集上对其进行有监督微调，未使用任何专有数据或复杂训练技巧，旨在证明其高质量的基础模型可通过简单流程获得优异性能。评估结果显示，所得的 Mistral 7B - Instruct 模型在 MT-Bench 自动化基准上优于所有同规模的 7B 模型，并与 13B 规模的聊天模型性能相当；更重要的是，在一个独立的匿名人类偏好评估平台（LLM Boxing）上，截至 2023 年 10 月 6 日，Mistral 7B 生成的回答获得了 25281 次偏好，显著高于 Llama 2 13B Chat 的 21257 次，这强有力地证明了其经过 SFT 后生成的回答在人类评判中具有更高质量。","order":5,"sourceName":"Mistral 7B","sourceUrl":"https://arxiv.org/abs/2310.06825"}]},{"id":216,"slug":"vit","title":"ViT","description":"本文提出了 Vision Transformer (ViT) 模型，挑战了卷积神经网络在计算机视觉领域的长期主导地位。论文主张，对 CNN 的依赖并非必要，并证明了一个纯粹的 Transformer 架构，在直接应用于图像块序列时，能够在图像分类任务上取得卓越性能。具体而言，ViT 将图像分割成固定大小的块（如 $16 \\times 16$ 像素），将这些块视为序列中的“词”，在嵌入后输入标准 Transformer 编码器进行处理。论文的关键发现是，当在大规模数据集（如 JFT-300M）上进行预训练后，再迁移到多个中型或小型图像识别基准（如 ImageNet、CIFAR-100、VTAB）上进行微调，ViT 不仅能达到或超越当时最先进的卷积网络的性能，而且在训练过程中所需的计算资源显著减少。因此，这项工作标志着视觉领域的一个范式转变，为 Transformer 成为统一的视觉建模骨干网络奠定了基础。","sourceName":"An Image is Worth 16x16 Words: Transformers for Image Recognition at Scale","sourceUrl":"https://arxiv.org/abs/2010.11929","publishedDate":"2020-10-22","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["lvm"],"nodes":[{"id":520,"slug":"vit-pretraining-data","title":"预训练数据","description":"ViT 论文所使用的预训练数据核心特征在于其超大规模。具体而言，模型主要在两个关键数据集上进行预训练：一是包含 3 亿张图像且标注有约 1.8 万个类别的私有数据集 JFT-300M，二是公开的 ImageNet-21k 数据集（包含约 1400 万张图像、2.1 万个类别）。这些数据的共同特点是数据量巨大、覆盖的视觉类别极其广泛，其形态为标准的带类别标签的图像。论文的核心论点正是，当在这种超大规模数据集上进行有监督的预训练后，ViT 所习得的通用视觉表征能力，能够使其在迁移到 ImageNet、CIFAR-100、VTAB 等多个中小型图像识别基准时，取得卓越的性能。\n\n论文的实验设计将 JFT-300M 作为超大规模数据的代表，将 ImageNet-21k 作为相对小规模的公开数据代表。\n\n核心论点是数据规模至关重要。实验结果表明，在超大规模的 JFT-300M 上预训练的 ViT 模型取得了最先进的性能，显著超越了当时的顶尖卷积网络。","order":1,"sourceName":"","sourceUrl":""},{"id":521,"slug":"vit-supervised-pretraining-model","title":"有监督预训练模型","description":"ViT 的有监督预训练模型核心流程可概括为：通过将图像分割为固定大小的块序列并输入纯 Transformer 编码器，在超大规模带标签数据集（如 JFT-300M 或 ImageNet-21k）上以图像分类任务进行训练，使模型学习通用视觉特征表示；预训练完成后获得的模型权重具备强大的特征提取能力。","order":2,"sourceName":"","sourceUrl":""},{"id":522,"slug":"vit-finetuning-tasks","title":"微调任务","description":"ViT 的微调任务是将大规模预训练后的模型迁移至中型或小型图像识别基准（如 ImageNet、CIFAR-100、VTAB 等）的过程：微调阶段使用目标领域数据（如 ImageNet-1K 的 130 万张图像）替换原分类头并进行端到端训练，最终在测试集上以分类准确率作为核心指标进行评估，并通过与卷积网络的性能对比验证其迁移效果与计算效率优势。","order":3,"sourceName":"","sourceUrl":""}]},{"id":217,"slug":"vilt","title":"ViLT","description":"视觉-语言预训练（VLP）模型旨在解决需要联合理解视觉和语言信息的任务，例如视觉问答、图像描述、跨模态检索和视觉推理。这些模型通过预训练（如图像文本匹配和掩码语言建模）学习跨模态表示，从而改善下游任务的性能。传统 VLP 模型常依赖计算密集的视觉特征提取（如目标检测或卷积网络），导致效率低下和表达力受限，而 ViLT 等新方法尝试优化这些问题。\r\n\r\nViLT（Vision-and-Language Transformer）提出了一种极简的视觉-语言预训练架构，其核心创新在于完全摒弃了传统 VLP 模型依赖的计算密集型视觉嵌入器（如基于目标检测的区域特征或深度卷积网络），转而采用与处理文本相同的轻量级方式——即简单的线性投影层来嵌入图像块（Patch）。这种设计使得模型首次将视觉特征提取与多模态交互统一到一个单一的 Transformer 模块中，从而在保持竞争性下游任务（如视觉问答、视觉推理和跨模态检索）性能的同时，实现了数十倍的训练和推理速度提升。\r\n\r\nViLT 证明了无需复杂的卷积或区域监督，仅通过统一的 Transformer 结构也能有效学习视觉与语言的联合表示，为高效多模态模型的研究开辟了新方向。","sourceName":"ViLT: Vision-and-Language Transformer Without Convolution or Region Supervision","sourceUrl":"https://arxiv.org/abs/2102.03334","publishedDate":"2021-02-05","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/naverlabs.png","types":["mmlm"],"nodes":[{"id":523,"slug":"vilt-pretraining-data","title":"预训练数据","description":"ViLT 的预训练数据整合了四个主流公开数据集——MSCOCO、Visual Genome (VG)、Google Conceptual Captions (GCC) 和 SBU Captions，总计约 400 万图像-文本对。这些数据兼具质量与规模：MSCOCO 和 VG 提供精确的人工标注（后者包含密集的区域描述），而 GCC 和 SBU 则提供大规模的网络爬取描述，虽带噪声但覆盖更广的真实场景。\n\nViLT 的训练数据输入 $x$ 是一个多模态序列：图像被分割成 $32 \\times 32$ 像素的 patch，通过线性投影嵌入为向量序列，文本通过 BERT tokenizer 分词并嵌入为 token 序列，两者与 `[CLS]`、`[SEP]` 等特殊 token 拼接，加上位置和模态类型编码，形成联合输入；\n目标 $y$ 根据预训练任务而异——对于图像文本匹配 (ITM)，$y$ 是二分类标签（`0` 或 `1`）表示图文是否匹配，对于掩码语言建模 (MLM)，$y$ 是被遮盖 token 的原始 ID，模型需预测这些标签。","order":1,"sourceName":"","sourceUrl":""},{"id":524,"slug":"vilt-pretraining-model","title":"预训练模型","description":"ViLT 的预训练模型采用极简主义设计，其核心创新在于完全摒弃了传统视觉-语言模型中依赖的计算密集型视觉嵌入器（如卷积神经网络或目标检测器），转而采用与文本嵌入对称的轻量级处理方式——将图像分割为图块并通过线性投影嵌入为向量序列，随后与文本标记拼接后输入统一的单流 Transformer（基于 ViT 初始化）进行深层跨模态交互；模型通过图像文本匹配和掩码语言建模（采用全词掩码以增强多模态学习）目标进行预训练，并结合图像增强技术，最终在实现数十倍效率提升的同时，于多种下游任务上保持了竞争性的性能，证明了无需复杂视觉编码器也能有效学习跨模态表示。","order":2,"sourceName":"","sourceUrl":""},{"id":525,"slug":"vilt-finetuning-tasks","title":"微调任务","description":"ViLT 的微调任务遵循经典的预训练-微调范式，在预训练完成后针对不同下游任务进行端到端的适配：对于分类任务（如视觉问答 VQA 和自然语言视觉推理 NLVR²），模型在 Transformer 输出之上添加轻量的多层感知机作为分类头，并采用特定输入策略（如 NLVR² 的 \"配对方法\"）进行处理；对于检索任务（如图文检索），则直接复用预训练的图像文本匹配头，采用对比学习方式拉近正样本对距离并推远负样本对；整个微调过程使用较小学习率并对所有参数（包括图像投影层）进行更新，同时创新性地引入图像增强技术来提升泛化能力，最终以极简的适配方式在多种任务上实现高效迁移。","order":3,"sourceName":"","sourceUrl":""}]},{"id":221,"slug":"dalle-1","title":"DALL·E 1","description":"这篇由 OpenAI 于 2021 年发布的开创性论文《Zero-Shot Text-to-Image Generation》（DALL·E 1）提出了一种基于两阶段训练流程的简单而强大的方法。\r\n首先，它训练一个离散变分自编码器（dVAE）将图像压缩成离散的视觉 token，从而将高分辨率图像转换为一个紧凑的、由 8192 个词汇组成的视觉码本；其次，它使用一个拥有 120 亿参数的稀疏自回归 Transformer 模型，将最多 256 个文本 token（BPE 编码）与 1024 个图像 token 拼接成一个序列，并学习其联合分布。\r\n通过在从互联网收集的 2.5 亿个文本-图像对上进行大规模训练，该方法在零样本（zero-shot）设置下取得了卓越性能：在 MS-COCO 数据集上，人类评估者认为其生成图像在 93% 的情况下更匹配文本描述，在 90% 的情况下比之前在该数据集上专门训练的模型更真实。\r\n此外，模型还展现出令人惊喜的涌现能力，如概念组合、文本渲染和初步的零样本图像到图像翻译。\r\n该工作的核心贡献在于证明，当模型和数据的规模足够大时，一个简单的、基于 Transformer 的自回归架构可以克服传统方法的复杂性，成为实现高质量、可控图像生成的有效路径，并强调了“规模”作为推动泛化能力和新兴能力的关键驱动力。","sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092","publishedDate":"2021-02-24","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["text-to-image"],"nodes":[{"id":538,"slug":"dalle-1-training-data","title":"训练数据","description":"DALL·E 1 的训练数据是一个专门为该项目从互联网上收集的、包含 2.5 亿个文本-图像对的超大数据集，其规模与 JFT-300M 等知名大型数据集相当。","order":1,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"},{"id":539,"slug":"dalle-1-dvae-stage","title":"dVAE 阶段","description":"DALL·E 1 论文中两阶段训练的第一阶段，其核心任务是训练一个离散变分自编码器（dVAE），目的是为图像创建一个高效的离散视觉码本。具体而言，此阶段旨在将一张 $256 \\times 256$ 的高分辨率 RGB 图像压缩成一个 $32 \\times 32$ 的离散 token 网格，其中每个 token 可取自一个包含 8192 个视觉词汇的码本，从而将序列长度减少 192 倍，极大缓解了后续 Transformer 的建模压力；实现上，一个编码器将图像转换为网格中每个位置的 logits，然后通过 Gumbel-Softmax 松弛技巧解决离散 token 选择的不可微问题，使模型可训练，而解码器则根据这 1024 个视觉 token 重建图像；训练目标为优化包含重建损失和 KL 散度的证据下界（ELB），其中重建项采用更匹配像素值有界特性的 Logit-Laplace 分布，并通过增大 KL 权重至 6.6 来提升码本使用率；最终，这一阶段产出一个强大的视觉编码器-解码器对，能够将图像转换为保留其主要结构和内容的离散 token 序列。","order":2,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"},{"id":540,"slug":"dalle-1-prior-learning","title":"学习先验阶段","description":"训练流程的第二阶段被称为“学习先验”，其核心目标是训练一个巨大的自回归 Transformer 模型来学习文本描述与图像内容之间的联合概率分布。\n在此阶段，第一阶段训练好的 dVAE 的编码器和解码器参数被固定，文本描述被 BPE 编码为最多 256 个 token，图像则通过冻结的 dVAE 编码器被转换为 $32 \\times 32 = 1024$ 个离散的图像 token；随后，文本 token 和图像 token 被拼接成一个单一序列，输入到具有稀疏注意力机制的 Transformer 中，模型以自回归的方式（即根据之前的全部 token 预测下一个 token）进行训练，其损失函数是文本和图像 token 的交叉熵损失，并对图像部分赋予更高权重以强调视觉保真度；\n最终，这个训练好的 Transformer 作为一个强大的“先验”模型，掌握了在给定文本条件下生成合理图像 token 序列的规律，从而能够在推理时仅根据文本输入自回归地生成完整的图像 token 序列，再通过固定的 dVAE 解码器将这些 token 转换为像素图像，实现了高质量的零样本文本到图像生成。","order":3,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"},{"id":541,"slug":"dalle-1-engineering-optimizations","title":"工程优化","description":"DALL·E 1 论文中关键的工程优化包括混合精度训练与分布式优化，二者协同解决了训练超大规模模型（120 亿参数）时面临的巨大挑战：混合精度训练通过让模型大部分计算（如前向/反向传播）使用 FP16 精度以提升速度并节省显存，同时维护 FP32 精度的主参数副本来保证数值稳定性，并结合损失缩放技术防止梯度下溢；而分布式优化则在此基础上，采用参数分片技术将模型拆分到同一机器内的多个 GPU 上以克服单卡内存限制，并通过类似 PowerSGD 的梯度压缩算法大幅减少机器间通信量，克服网络带宽瓶颈。","order":4,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"},{"id":542,"slug":"dalle-1-sample-generation","title":"样本生成","description":"这个过程是一个两阶段的生成-筛选流程。首先，输入文本经 BPE 编码为 token 序列后，输入至训练好的第二阶段 Transformer 先验模型，模型以自回归方式、在给定温度参数（通常设为 1）控制下，通过随机采样逐步生成一个包含 1024 个图像 token 的序列，此过程可重复进行以得到多个候选序列；随后，每个候选 token 序列被输入至冻结的第一阶段 dVAE 解码器，重建为 $256 \\times 256$ 像素的候选图像；由于自回归采样的随机性，为确保输出质量，系统引入了一个关键的对比性重排序步骤，即使用一个预训练的对比模型（如 CLIP）为所有候选图像计算其与原始文本的匹配分数，并选择得分最高的图像作为最终输出，从而将生成模型的创造性与判别模型的精准性相结合，有效提升了零样本文本到图像生成的可靠性与质量。","order":5,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"},{"id":543,"slug":"dalle-1-experiments","title":"实验","description":"通过系统的定量与定性分析，论文全面验证了其大规模训练范式在零样本设置下的卓越性能。在定量评估中，模型在 MS-COCO 等基准数据集上并未使用任何训练标签，但其生成质量（以 FID/IS 指标衡量）却与在该数据集上专门训练的领域特定模型相当甚至更优，尤其关键的是人工评估显示约 90% 的情况下人类更偏好 DALL·E 的结果；论文还通过高斯模糊等分析验证了评估的公平性，并深入探讨了模型涌现出的概念组合、属性绑定等高级能力。这些实验严谨地证实了论文的核心论点：当模型与数据规模足够大时，简单的两阶段架构无需特定领域微调即可实现强大的泛化与创造能力。","order":6,"sourceName":"Zero-Shot Text-to-Image Generation","sourceUrl":"https://arxiv.org/abs/2102.12092"}]},{"id":222,"slug":"clip","title":"CLIP","description":"CLIP（Contrastive Language-Image Pre-training）是 OpenAI 于 2021 年提出的里程碑工作，核心创新在于通过自然语言监督学习可迁移的视觉模型，取代传统依赖固定类别标签（如 ImageNet）的范式。该模型从互联网收集的 4 亿个图像-文本对中，通过对比学习任务训练图像编码器和文本编码器，将两者映射到同一语义空间，实现零样本迁移：预训练后，可直接使用自然语言描述（如 “a photo of a dog”）对未知视觉概念进行分类，无需额外训练。在超过 30 个数据集（包括 OCR、动作识别、地理定位等）上的评估表明，零样本 CLIP 竞争甚至超越许多全监督基线，例如在 ImageNet 上匹配 ResNet-50 准确率（76.2%），且展现出更强的分布外鲁棒性和多任务灵活性。这项工作证明了自然语言作为通用监督信号的潜力，为多模态基础模型（如后续的 DALL·E、GPT-4）奠定了基础，推动了通用视觉-语言理解的发展。","sourceName":"Learning Transferable Visual Models From Natural Language Supervision","sourceUrl":"https://arxiv.org/abs/2103.00020","publishedDate":"2021-02-26","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["mmlm"],"nodes":[{"id":544,"slug":"clip-training-data","title":"训练数据","description":"CLIP 论文中使用的训练数据是一个大规模自建数据集，称为 WIT（WebImageText），包含从互联网公开来源收集的 4 亿个图像-文本对。该数据集通过 500,000 个查询词（基于 Wikipedia 高频词、双字母组合、高搜索量文章和 WordNet 同义词集）搜索构建，每个查询最多保留 20,000 对以保持类别平衡，文本内容为自然语言描述（如标题或说明），旨在覆盖广泛的视觉概念，为自然语言监督学习提供丰富而多样的监督信号。","order":1,"sourceName":"","sourceUrl":""},
