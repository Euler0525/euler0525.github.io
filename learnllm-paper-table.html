{"id":545,"slug":"clip-model","title":"模型","description":"模型架构由两个核心组件组成：一个图像编码器和一个文本编码器，它们共同学习将图像和文本映射到共享的多模态嵌入空间。图像编码器可以采用 ResNet 或 Vision Transformer (ViT) 架构，负责提取图像特征，例如 ResNet 变体从输入图像中生成特征图，而 ViT 将图像分割为补丁序列并通过 Transformer 层处理；文本编码器则基于 Transformer 模型，将文本描述（如自然语言句子）编码为向量表示。训练过程中，模型通过对比学习目标（如 InfoNCE 损失）优化，使匹配的图像-文本对在嵌入空间中相似度最大化，而非匹配对相似度最小化，从而无需特定任务标注即可实现零样本迁移。这种设计允许 CLIP 直接根据文本提示进行图像分类或检索，增强了泛化能力。","order":2,"sourceName":"","sourceUrl":""},{"id":546,"slug":"clip-zero-shot-inference","title":"零样本推理","description":"CLIP 论文中的零样本推理是指模型无需在特定任务上微调，仅通过自然语言提示就能直接进行图像分类的能力。CLIP 通过对比学习预训练一个图像编码器和一个文本编码器，将图像和文本映射到同一多模态嵌入空间。在推理时，对于给定图像，模型使用一组文本描述生成对应嵌入，计算图像嵌入与每个文本嵌入的余弦相似度，并选择相似度最高的文本作为预测类别。这种方法使 CLIP 能够灵活泛化到未见过的类别，仅依靠预训练知识实现跨任务迁移，避免了传统模型对大量标注数据的依赖。","order":3,"sourceName":"","sourceUrl":""}]},{"id":223,"slug":"stable-diffusion","title":"Stable Diffusion","description":"这篇由 Robin Rombach 等人于 2021 年 12 月 20 日发布在 arXiv 上、并入选 CVPR 2022 的论文《High-Resolution Image Synthesis with Latent Diffusion Models》提出了一种名为潜在扩散模型（LDM）的创新方法。该研究旨在解决传统扩散模型（DM）因直接在像素空间操作而导致训练和推理计算成本高昂的问题。其核心思想是将扩散模型应用于预训练好的自编码器的潜在空间中，而非像素空间，从而在显著降低计算需求（仅需少量 GPU 天数）的同时，在复杂度降低与细节保留之间达到一个近乎最优的平衡，极大地提升了生成图像的视觉保真度。\r\n\r\n此外，通过在设计中加入交叉注意力（cross-attention）层，该模型能够灵活接受多种条件输入（如文本或边界框），成为一个强大且通用的生成器，并以卷积方式实现高分辨率图像合成。LDM 在图像修复任务上达到了新的最优水平，并在无条件图像生成、语义场景合成和超分辨率等多个任务上表现出极具竞争力的性能。","sourceName":"High-Resolution Image Synthesis with Latent Diffusion Models","sourceUrl":"https://arxiv.org/abs/2112.10752","publishedDate":"2021-12-20","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/stabilityai.png","types":["text-to-image"],"nodes":[{"id":547,"slug":"stable-diffusion-diffusion-model","title":"Diffusion Model","description":"扩散模型是一种深度生成模型，其核心思想是通过模拟一个“破坏与重建”的过程来学习数据分布。它包含一个固定的前向过程，通过逐步添加高斯噪声将一张原始训练图片彻底破坏成纯噪声；同时，它学习一个反向过程，训练一个神经网络（通常是U-Net）来预测每一步所添加的噪声。在训练时，模型通过不断尝试从各种噪声程度的数据中还原原始信号，从而掌握数据的内在结构。一旦训练完成，生成新样本就变为一个迭代式的采样过程：从纯粹的随机噪声开始，利用训练好的模型一步步地去除噪声，最终“重建”出一个符合训练数据分布的全新、高质量样本。这种方法因其生成样本的优异质量和训练过程的稳定性，已成为生成式人工智能领域的基石技术之一。","order":1,"sourceName":"","sourceUrl":""},{"id":548,"slug":"stable-diffusion-latent-diffusion-model","title":"Latent Diffusion Model","description":"潜在扩散模型（LDM）这篇论文的核心贡献在于通过一种新颖的两阶段框架，成功解决了传统扩散模型（DM）直接在像素空间操作时面临的计算成本极高的关键问题。具体解决方法是：首先，训练一个强大的自编码器，将高维图像压缩到一个低维的、感知等效的潜在空间，从而将计算密集型的前向/反向扩散过程从像素空间转移到低维潜在空间；然后，在这个潜在空间中训练扩散模型去学习数据的分布。这种做法不仅大幅降低了训练和推理的计算需求（例如，训练时间从数百 GPU 天显著减少），而且由于潜在空间过滤掉了高频细节，使扩散模型能更专注于学习数据的语义信息，从而在保证甚至提升生成质量（在多项任务上达到 SOTA）的同时，实现了高效的高分辨率图像合成。此外，通过引入交叉注意力机制，LDM 巧妙地实现了多模态（如文本、布局）条件控制，使其成为一个强大且通用的生成模型框架。","order":2,"sourceName":"","sourceUrl":""}]},{"id":224,"slug":"dalle-2","title":"DALL·E 2","description":"论文提出了一个名为 unCLIP 的模型。其核心思想非常巧妙：与其让模型“从零开始”根据文本生成图像，不如将其分解为两步：先“理解”文本，将其转化为一个抽象的“图像概念”，再根据这个“概念”绘制出具体图像。\r\n\r\n这个“图像概念”正是由 CLIP 模型生成的图像嵌入。CLIP 模型能够将任何图像和文本映射到同一个语义空间，使得语义相似的图像和文本在空间中的位置也接近。unCLIP 的工作就是“反转” CLIP 的过程：从文本生成一个 CLIP 图像嵌入，再从这个嵌入解码出图像。","sourceName":"Hierarchical Text-Conditional Image Generation with CLIP Latents","sourceUrl":"https://arxiv.org/abs/2204.06125","publishedDate":"2022-04-13","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["text-to-image"],"nodes":[{"id":549,"slug":"dalle-2-decoder","title":"Decoder","description":"Decoder 是一个基于扩散模型的生成器，其核心任务是将 CLIP 图像嵌入（CLIP image embedding）转换回对应的像素图像。\n\n具体而言，该 Decoder 的架构是在先前发布的 GLIDE 模型基础上进行修改而成的：\n- 将 CLIP 图像嵌入（Prior 阶段学习到的）投影并添加到模型的时间步嵌入（timestep embedding）中\n- 将 CLIP 图像嵌入投影为四个额外的上下文标记，拼接到 GLIDE 文本编码器的输出序列之后\n\n尽管论文保留了文本描述作为可选条件输入，但实验发现其帮助有限，CLIP 图像嵌入本身已能提供强大的语义引导。\n\n为了提升生成质量，该模型在训练时采用了分类器无关引导（Classifier-Free Guidance）技术，即随机地将 CLIP 嵌入置零（10% 概率）或丢弃文本描述（50% 概率），从而使模型在推理时能通过调节引导尺度来平衡生成图像的逼真度与多样性。\n\n此外，为了高效生成高分辨率图像（如 1024x1024），系统还训练了两个级联的扩散上采样器：第一个将 64x64 的基础图像上采样至 256x256，第二个进一步上采样至 1024x1024。这些上采样器在训练时对条件图像施加了模糊或多样化退化以增强鲁棒性，并且仅使用卷积层而无注意力机制，使其在推理时能泛化到更高分辨率。","order":1,"sourceName":"","sourceUrl":""},{"id":550,"slug":"dalle-2-prior","title":"Prior","description":"Prior（先验模型）的核心作用是根据文本描述生成对应的 CLIP 图像嵌入，为后续的 Decoder 阶段提供语义基础。具体而言，Prior 将文本标题 $y$ 映射到 CLIP 图像嵌入 $z_i$，其生成过程遵循概率分布 $P(z_i \\mid y)$。\n\n论文探索并比较了两种先验模型：自回归（AR）先验将 CLIP 图像嵌入通过 PCA 降维和离散化后，使用 Transformer 以自回归方式预测编码序列；而扩散先验则直接基于扩散模型在连续向量空间生成 $z_i$，采用仅含解码器的 Transformer 结构，通过预测未加噪的嵌入并利用均方误差损失进行优化。\n\n实验表明，扩散先验在计算效率和质量上均优于自回归先验，训练中通过随机丢弃文本条件（10% 概率）支持分类器无关引导，采样时还采用生成多个候选并选取与文本嵌入相似度最高的策略以提升对齐质量。该设计使 Prior 能够有效桥接文本与图像语义空间，成为生成多样且高质量图像的关键组件。","order":2,"sourceName":"","sourceUrl":""},{"id":551,"slug":"dalle-2-image-manipulations","title":"图像处理","description":"Image Manipulations（图像操控）是一项核心创新功能，它充分利用了模型的两阶段生成架构（先生成 CLIP 图像嵌入，再解码为图像）来实现强大而灵活的图像编辑。\n\n该功能主要包含三种操作：\n- 图像变体（Variations）：能够基于单张输入图像生成在保持核心语义（如物体、构图）和风格（如画风）不变的前提下，变化非本质细节（如纹理、朝向）的多样化样本，这是通过固定 CLIP 图像嵌入（负责语义/风格）并扰动 DDIM 反转得到的潜码（负责细节）来实现的。\n- 图像插值（Interpolations）：允许在两张图像之间进行平滑过渡，通过在 CLIP 嵌入空间对它们的表征进行球面插值，从而自然融合其内容与风格。\n- 文本引导变换（Text Diffs）：利用 CLIP 将图像和文本映射到同一潜在空间的特性，通过计算目标文本与参考文本的嵌入差值向量，并将原图的 CLIP 图像嵌入朝向该方向移动，从而实现无需重新训练模型的零样本、语言驱动的语义修改（例如将“白天”的场景变为“夜晚”）。\n\n这些操控能力的根本优势在于模型将图像的高层次语义信息（由 CLIP 嵌入捕获）与具体细节信息（由扩散模型潜码捕获）进行了有效分离，使得用户能够对图像进行高度可控的、创造性的编辑，远超传统的像素级操作。","order":3,"sourceName":"","sourceUrl":""}]},{"id":225,"slug":"llava","title":"LLaVA","description":"LLaVA（Large Language and Vision Assistant）是首个将大语言模型（LLM）成功的指令微调范式系统性地引入视觉-语言多模态领域的工作。其核心贡献在于巧妙地利用纯文本的 GPT-4 作为“教师模型”，通过输入图像的文本描述（如标题、边界框）让其模拟人类对话，自动生成了包含对话、详细描述和复杂推理在内的 15.8 万条高质量视觉-语言指令数据。基于此数据，LLaVA 采用简洁的架构，仅用一个可训练的线性投影层将强大的冻结视觉编码器（CLIP-ViT）与冻结语言模型（Vicuna）连接，并通过两阶段训练（特征对齐预训练 + 端到端指令微调），成功激发出了模型的通用多模态对话能力。实验表明，LLaVA 在多项评测中展现出了接近 GPT-4 的惊艳表现，尤其在 ScienceQA 基准上，其与 GPT-4 集成后达到了 92.53% 的新 State-of-the-Art 准确率。该研究证明了用生成式数据指导视觉-语言指令调优的路径高度可行，其全面开源的数据、模型和代码为后续多模态研究奠定了重要基石，堪称开源多模态领域的“GPT-3 时刻”。","sourceName":"Visual Instruction Tuning","sourceUrl":"https://arxiv.org/abs/2304.08485","publishedDate":"2023-04-17","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/wisc.png","types":["mmlm"],"nodes":[{"id":552,"slug":"llava-visual-instruction-tuning","title":"Visual Instruction Tuning","description":"LLaVA 模型核心是将纯语言模型上成功的“指令调优”范式首次系统性地引入视觉-语言多模态领域。该方法巧妙地解决了多模态指令数据稀缺的关键难题：利用强大的纯文本 GPT-4 作为“教师”，通过输入图像的文本描述（如标题、边界框）来“脑补”图像内容，从而自动生成了包含对话、详细描述和复杂推理在内的 15.8 万条高质量视觉-语言指令数据。基于此数据，LLaVA 采用简洁的“视觉编码器（CLIP-ViT）+ 线性投影层 + 语言模型（Vicuna）”架构，并通过两阶段训练（特征对齐预训练 + 端到端指令微调）成功激发出模型的通用多模态对话能力。","order":1,"sourceName":"","sourceUrl":""},{"id":553,"slug":"llava-experiments","title":"实验效果","description":"在 LLaVA 论文的 Experiments 部分，作者通过两个核心实验全面评估了模型的性能：多模态聊天机器人对话能力和 ScienceQA 科学问答任务。在多模态聊天机器人评估中，基于构建的 LLaVA-Bench 基准（包括 COCO 和 In-the-Wild 子集），LLaVA 在指令跟随任务中表现出色，其相对分数分别达到 85.1% 和 67.3%，显著优于 BLIP-2 和 OpenFlamingo 等基线模型，展现了强大的视觉-语言对齐能力。在 ScienceQA 多模态推理基准上，LLaVA 单独训练达到了 90.92% 的准确率，接近当时 SOTA 水平，而当与 GPT-4 集成（采用 GPT-4 作为裁判决策）时，准确率进一步提升至 92.53%，创造了新的 SOTA 记录。消融实验验证了关键设计选择（如使用 CLIP 视觉编码器的倒数第二层特征、思维链生成顺序以及端到端指令调优的必要性），充分证明了视觉指令调优策略的有效性。","order":2,"sourceName":"","sourceUrl":""}]},{"id":226,"slug":"qwen-vl","title":"Qwen-VL","description":"Qwen-VL 基于 Qwen-7B 语言模型增强视觉能力，支持图像理解、定位、文本阅读及多语言对话。\r\n\r\n模型采用三组件架构：\r\n- 视觉编码器（ViT-bigG）\r\n- 位置感知 VL 适配器（压缩特征至 256 长度）\r\n- 语言模型\r\n\r\n总参数量约 9.6B。训练流程包含三阶段：\r\n- 首先使用 14 亿清洗后的图像-文本对进行预训练（分辨率 224×224）\r\n- 接着引入多任务数据（如 VQA、定位、OCR）提升分辨率至 448×448\r\n- 最后通过 35 万条指令微调数据优化交互能力，生成对话模型 Qwen-VL-Chat\r\n\r\n该模型在多项基准测试中表现领先，如零样本图像描述（Flickr30K CIDEr 得分 85.8）、视觉问答（VQAv2 准确率 79.5%）、指代表达理解（RefCOCO 准确率 89.36%）及真实对话评测（TouchStone 得分 645.2），支持多图输入、细粒度定位和中英文指令，代码和模型已公开于 GitHub。","sourceName":"Qwen-VL: A Versatile Vision-Language Model for Understanding, Localization, Text Reading, and Beyond","sourceUrl":"https://arxiv.org/abs/2308.12966","publishedDate":"2023-08-24","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/qwen.jpeg","types":["mmlm"],"nodes":[{"id":554,"slug":"qwen-vl-methodology","title":"方法论","description":"Qwen-VL 的方法论章节聚焦于模型架构设计与输入输出接口定义：模型采用三组件架构，包括基于 Qwen-7B 的大语言模型底座、从 OpenCLIP 初始化的 ViT-bigG 视觉编码器，以及核心创新点——位置感知视觉-语言适配器。\n\n该适配器通过单层交叉注意力机制，将图像特征序列压缩为固定长度 256，并引入 2D 绝对位置编码以保留空间信息，使总参数量达 9.6B（视觉编码器 1.9B + 适配器 0.08B + LLM 7.7B）。\n\n输入输出层面，图像特征通过特殊标记和标识起止，边界框坐标归一化至 $[0, 1000)$ 范围并格式化为 `(x1,y1),(x2,y2)` 字符串，结合 `\u003cref>` 与 `\u003cbox>` 标记实现文本与区域的细粒度关联。这一简洁架构通过视觉与语言的精准对齐，为多模态任务奠定了高效基础。","order":1,"sourceName":"","sourceUrl":""},{"id":555,"slug":"qwen-vl-three-stage-training","title":"三段式训练","description":"Qwen-VL 的训练流程采用三阶段渐进式策略，以系统化构建模型的多模态能力。\n\n第一阶段预训练聚焦于基础视觉-语言对齐，使用 14 亿清洗后的网络图像-文本对（含中英文），冻结语言模型仅优化视觉编码器与适配器，在 224×224 分辨率下训练 5 万步，使模型获得初步视觉理解能力。\n\n第二阶段多任务预训练引入细粒度标注数据，将分辨率提升至 448×448 以减少信息损失，同时解锁整个模型进行端到端训练，并行学习 7 项任务（如图像描述、视觉问答、定位、OCR 等），通过交错图文数据和定位标注增强模型对文本、图表、指向性理解等复杂场景的适应力。\n\n第三阶段监督微调使用 35 万指令数据优化对话能力，构建包含定位和多图像理解的对话样本，冻结视觉编码器而微调语言模型与适配器，最终得到交互式模型 Qwen-VL-Chat。","order":2,"sourceName":"","sourceUrl":""},{"id":556,"slug":"qwen-vl-evaluation","title":"评估","description":"作者通过系统性实验验证了模型在多模态任务上的综合性能。\n\n评估涵盖五大方向：在图像描述任务中，Qwen-VL 在 Flickr30K 上达到 85.8 CIDEr 分数，显著超越 Flamingo-80B 等大规模模型；在通用视觉问答（VQA）任务上，其在 VQAv2、OKVQA 和 GQA 基准分别取得 79.5%、58.6% 和 59.3% 的准确率，展现强大推理能力；在文本导向 VQA（如 TextVQA、DocVQA）任务中，模型在文字识别和图表理解上表现优异（如 TextVQA 准确率 63.8%）；在指代表达理解任务（如 RefCOCO 系列）中，定位准确率超 89%，证明其细粒度视觉定位能力；此外，模型在少样本学习场景下性能接近参数量大 10 倍的模型，凸显其高效迁移性。\n\n最终，指令调优后的 Qwen-VL-Chat 在真实对话评测（如 TouchStone、MME）中全面领先，尤其在中文多轮对话、多图像理解任务上优势明显，证实其在实际应用中的强大泛化能力。","order":3,"sourceName":"Qwen-VL: A Versatile Vision-Language Model for Understanding, Localization, Text Reading, and Beyond","sourceUrl":"https://arxiv.org/abs/2308.12966"}]},{"id":227,"slug":"lvm","title":"LVM","description":"LVM 旨在不依赖任何语言数据来构建大规模视觉模型。其核心创新是提出了“视觉句子”的概念，将图像、视频、深度图、分割标注等多样化的视觉数据统一表示为图像序列。通过使用 VQGAN 将每个图像编码为离散标记，模型（一个基于 LLaMA 架构的自回归 Transformer）可以像处理文本一样，以“下一个标记预测”为目标进行训练。研究表明，这种简单的序列建模方法展现出强大的缩放效应，即随着模型参数和数据量（使用超 16 亿图像/帧）的增加，性能持续提升。更重要的是，训练好的单一模型无需微调，仅通过设计不同的“视觉提示”就能灵活解决分割、深度估计、视频预测等多种视觉任务，证明了纯视觉数据同样能够支撑通用视觉基础模型的学习，为探索不依赖语言的视觉智能开辟了新范式。","sourceName":"Sequential Modeling Enables Scalable Learning for Large Vision Models","sourceUrl":"https://arxiv.org/abs/2312.00785","publishedDate":"2023-12-01","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/bair.png","types":["lvm"],"nodes":[{"id":557,"slug":"lvm-data","title":"数据","description":"LVM 介绍了一个为训练纯视觉大模型而构建的大规模数据集 UVDv1，其关键创新在于提出了“视觉句子”这一统一格式，用以解决视觉数据来源多样、结构异构的难题；具体而言，该数据集整合了总计 16.4 亿张图像/帧的五大类数据（包括未标注图像、带标注图像、视频、带标注视频及 3D 合成对象），并通过“视觉句子”——即一个或多个图像后接结束标记的序列——将所有这些数据（如单张图、视频帧、图像-标注对）转化为统一的序列格式，使得模型能够像处理文本序列一样，以自回归方式进行下一个标记预测，从而无需任何语言标签即可在庞大而多样的纯视觉数据上训练出能够通过提示执行多种任务的大型视觉模型。","order":1,"sourceName":"","sourceUrl":""},{"id":558,"slug":"lvm-core-methodology","title":"核心方法论","description":"这种纯视觉的大模型框架，核心是通过序列建模学习视觉表示，而无需任何语言数据。该方法首先利用 VQGAN 标记器将每个图像独立编码为 256 个离散标记，将图像转化为序列化的符号表示；然后，将所有图像的标记连接成统一的视觉句子序列，采用基于 LLaMA 架构的自回归 Transformer 进行训练，通过最小化下一个标记预测的交叉熵损失，使模型能够从图像序列的上下文中推断任务关系；最后，在推理阶段，通过设计视觉提示（如输入部分图像序列）来引导模型生成后续内容，实现多种视觉任务的零样本求解，如图像补全、分割和预测等。整个流程实现了视觉数据的统一表示和灵活的任务泛化。","order":2,"sourceName":"","sourceUrl":""},{"id":559,"slug":"lvm-experimental-results","title":"实验结果","description":"作者通过系统实验验证了 LVM 的可扩展性和多任务处理能力。实验表明，随着模型规模从 300M 参数增加到 3B 参数，训练损失（困惑度）持续下降，且下游任务（如语义分割、深度估计、表面法线估计和边缘检测）的性能显著提升，证明模型和数据规模的扩大能有效提升泛化能力。通过序列提示（Sequential Prompting），LVM 能够根据前序帧预测视频后续帧，或进行 3D 旋转预测，且更长上下文（如 11 帧以上）能改善预测准确性。类比提示（Analogy Prompting）使模型能泛化到未训练任务，如关键点检测和图像分割，其在 Pascal 3D+ 数据集上达到 81.2% 的 PCK 分数，优于部分专用模型。此外，模型能处理组合任务（如旋转与关键点跟踪）和非常规提示（如物体复制或视觉推理任务），展现出初步的推理能力，但存在提示歧义、生成质量不足等局限性，凸显了进一步扩展的需求。","order":3,"sourceName":"","sourceUrl":""}]},{"id":228,"slug":"whisper","title":"Whisper","description":"Whisper 是 OpenAI 在 2022 年提出的基于大规模弱监督训练的鲁棒语音识别模型，其核心创新在于通过收集互联网上 680,000 小时的音频-转录对进行训练，其中包含 117,000 小时的多语言数据和 125,000 小时的语音翻译数据。\r\n\r\n该研究采用编码器-解码器 Transformer 架构，通过精心设计的数据过滤机制去除低质量转录，并统一了语音识别、翻译、语言检测和语音活动检测等多任务格式。\r\n\r\n实验表明，Whisper 在零样本设置下无需针对特定数据集进行微调，就能在多个标准基准测试中达到与全监督方法竞争的性能，展现出卓越的跨领域泛化能力和接近人类水平的鲁棒性。\r\n\r\n这项工作的主要贡献在于验证了简单的大规模弱监督预训练对语音识别的有效性，并开源了模型和代码，为后续鲁棒语音处理研究提供了重要基础。","sourceName":"Robust Speech Recognition via Large-Scale Weak Supervision","sourceUrl":"https://arxiv.org/abs/2212.04356","publishedDate":"2022-12-06","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/openai.svg","types":["speech-model"],"nodes":[{"id":560,"slug":"whisper-method","title":"方案","description":"Whisper 的核心方法论包含三块：数据预处理、模型架构和多任务格式数据。\n\n预处理采用极简方法从互联网收集音频-转录对，构建了 680,000 小时的多样化数据集，并通过检测移除机器生成转录、音频语言匹配、模糊去重等自动过滤机制确保数据质量，音频被分割为 30 秒片段并包含无语音片段用于语音活动检测训练。\n\n模型架构采用标准的编码器-解码器 Transformer 设计，音频经重采样至 16 kHz 后转换为 80 通道 log-magnitude 梅尔频谱图，编码器包含卷积 stem 和 Transformer 块，解码器使用学习的位置编码和绑定表示，文本分词采用 GPT-2 的字节级 BPE。\n\n多任务格式通过特殊标记序列（如 `\u003c|startoftranscript|>`、语言标记、任务标记等）统一语音识别、翻译、语音活动检测、语言识别等多种功能，使单一模型能够执行完整语音处理流水线，并利用历史转录文本作为上下文解决音频歧义。","order":1,"sourceName":"","sourceUrl":""},{"id":561,"slug":"whisper-experiments-ablation","title":"实验分析与消融","description":"Whisper 论文的 Experiments 章节系统评估了模型在零样本（zero-shot）设置下的性能，核心发现是：通过在大规模（680,000 小时）、多样化、弱监督数据上进行多任务预训练，单一模型无需任何任务或数据集特定的微调，即可在多种语音任务上实现强大的泛化能力和接近人类的鲁棒性。\n\n在英语语音识别上，模型在 LibriSpeech 等标准基准上达到与全监督方法竞争的性能（词错率 WER 低至约 3.4%），且在分布外（out-of-distribution）数据集上展现出远优于传统监督模型的鲁棒性，将分布外平均错误率降低了 55.2%。\n\n在多语言语音识别中，性能与每种语言的训练数据量强相关（数据量每增 16 倍，WER 约减半），但非印欧语系语言因字节级 BPE 分词器不匹配而表现低于预期。\n\n在语音翻译（$X \\rightarrow en$）任务上，模型在低资源语言上表现出色，体现了零样本迁移优势。语言识别准确率在其训练覆盖的语言上可达 80.3%。鲁棒性测试证实模型对加性噪声和环境噪声的抵抗力更强。长文本转录评估显示其能有效处理 30 秒片段并整合上下文。\n\n分析与消融研究进一步揭示，除英语识别因接近人类水平而收益递减外，模型性能在多语言识别、翻译等任务上随模型规模增大持续提升，且增大训练数据规模对所有任务均有积极影响；对于足够大的模型，联合多任务、多语言训练没有弊端甚至有益。","order":2,"sourceName":"","sourceUrl":""}]},{"id":229,"slug":"gptq","title":"GPTQ","description":"GPTQ（Generative Pre-trained Transformer Quantization）是一种针对大规模生成式预训练 Transformer 模型的高效后训练量化方法。该方法基于近似二阶信息，通过三个关键技术突破——任意顺序量化、懒惰批量更新和 Cholesky 重构——将算法复杂度从立方级降低到可处理千亿参数模型的水平。GPTQ 能够在约 4 个 GPU 小时内将 1750 亿参数的模型（如 OPT-175B 和 BLOOM-176B）量化到 3-4 位权重，且困惑度损失极小（如 OPT-175B 在 4 位量化下仅损失 0.03）。相比之前只能达到 8 位量化的后训练方法，GPTQ 将压缩率提高了一倍以上，首次实现了在单个 NVIDIA A100 GPU 上运行 175B 参数模型进行生成推理，并带来了显著的端到端推理加速（A100 上约 3.25 倍，A6000 上约 4.5 倍）。该方法在极端量化（2 位甚至三元）下仍能保持合理精度，为超大语言模型在资源受限环境中的部署提供了实用解决方案。","sourceName":"GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers","sourceUrl":"https://arxiv.org/abs/2210.17323","publishedDate":"2022-10-31","isFree":false,"isMajor":false,"logoUrl":"","types":["quantization"],"nodes":[{"id":562,"slug":"gptq-overview","title":"GPTQ","description":"GPTQ（Generative Pre-trained Transformer Quantization）是一种针对大规模生成式预训练 Transformer 模型的高效后训练量化方法。该方法基于近似二阶信息，通过三个关键技术突破——任意顺序量化、懒惰批量更新和 Cholesky 重构——将算法复杂度从立方级降低到可处理千亿参数模型的水平。GPTQ 能够在约 4 个 GPU 小时内将 1750 亿参数的模型（如 OPT-175B 和 BLOOM-176B）量化到 3-4 位权重，且困惑度损失极小（如 OPT-175B 在 4 位量化下仅损失 0.03）。相比之前只能达到 8 位量化的后训练方法，GPTQ 将压缩率提高了一倍以上，首次实现了在单个 NVIDIA A100 GPU 上运行 175B 参数模型进行生成推理，并带来了显著的端到端推理加速（A100 上约 3.25 倍，A6000 上约 4.5 倍）。该方法在极端量化（2 位甚至三元）下仍能保持合理精度，为超大语言模型在资源受限环境中的部署提供了实用解决方案。","order":1,"sourceName":"GPTQ: Accurate Post-Training Quantization for Generative Pre-trained Transformers","sourceUrl":"https://arxiv.org/abs/2210.17323"}]},{"id":230,"slug":"dpo","title":"DPO","description":"直接偏好优化（DPO）旨在解决传统人类反馈强化学习（RLHF）流程复杂且不稳定的问题。DPO 的核心洞察是通过巧妙的数学变换，将奖励函数重新参数化为策略的函数，从而避免显式的奖励建模和不稳定的强化学习训练循环。DPO 利用 Bradley-Terry 偏好模型，通过变量变换将奖励最大化问题转化为一个简单的分类损失函数，直接优化语言模型策略以符合人类偏好。这种方法不仅理论上有良好的保证，而且在实验中表现出与或优于现有方法（如基于 PPO 的 RLHF）的性能，同时在情感控制、摘要和对话等任务上更加稳定、计算高效且易于实现。DPO 的提出为大规模语言模型的对齐提供了一种更简洁、可靠的替代方案，显著降低了训练复杂性和部署门槛。","sourceName":"Direct Preference Optimization: Your Language Model is Secretly a Reward Model","sourceUrl":"https://arxiv.org/abs/2305.18290","publishedDate":"2023-05-19","isFree":false,"isMajor":false,"logoUrl":"","types":["alignment"],"nodes":[{"id":563,"slug":"dpo-basics","title":"DPO","description":"直接偏好优化（DPO）旨在解决传统人类反馈强化学习（RLHF）流程复杂且不稳定的问题。DPO 的核心洞察是通过巧妙的数学变换，将奖励函数重新参数化为策略的函数，从而避免显式的奖励建模和不稳定的强化学习训练循环。DPO 利用 Bradley-Terry 偏好模型，通过变量变换将奖励最大化问题转化为一个简单的分类损失函数，直接优化语言模型策略以符合人类偏好。这种方法不仅理论上有良好的保证，而且在实验中表现出与或优于现有方法（如基于 PPO 的 RLHF）的性能，同时在情感控制、摘要和对话等任务上更加稳定、计算高效且易于实现。DPO 的提出为大规模语言模型的对齐提供了一种更简洁、可靠的替代方案，显著降低了训练复杂性和部署门槛。","order":1,"sourceName":"Direct Preference Optimization: Your Language Model is Secretly a Reward Model","sourceUrl":"https://arxiv.org/abs/2305.18290"}]},{"id":231,"slug":"qlora","title":"QLoRA","description":"QLoRA（Quantized Low-Rank Adaptation）是一种高效的大语言模型微调方法，它通过将预训练模型量化为 4 位精度并冻结，然后仅训练添加的低秩适配器（LoRA）来实现。该方法首次实现了对 4 位量化模型的无损微调，其三大关键技术包括：针对正态分布权重信息论最优的 4 位 NormalFloat 量化、对量化常数进行二次量化以进一步节省内存的双重量化，以及利用分页优化器防止训练中内存峰值。基于 QLoRA 训练的 Guanaco 模型家族在 Vicuna 基准测试中表现出色，例如 Guanaco 65B 在单块 48GB GPU 上微调 24 小时后，达到了 ChatGPT 99.3% 的性能水平，显著降低了大型模型微调的内存门槛。论文的重要结论还包括：数据质量远优于数据量，以及 QLoRA 能够完全恢复 16 位全参数微调的性能。","sourceName":"QLoRA: Efficient Finetuning of Quantized LLMs","sourceUrl":"https://arxiv.org/abs/2305.14314","publishedDate":"2023-05-23","isFree":false,"isMajor":false,"logoUrl":"","types":["fine-tuning"],"nodes":[{"id":564,"slug":"qlora-overview","title":"QLoRA","description":"QLoRA（Quantized Low-Rank Adaptation）是一种高效的大语言模型微调方法，它通过将预训练模型量化为 4 位精度并冻结，然后仅训练添加的低秩适配器（LoRA）来实现。该方法首次实现了对 4 位量化模型的无损微调，其三大关键技术包括：针对正态分布权重信息论最优的 4 位 NormalFloat 量化、对量化常数进行二次量化以进一步节省内存的双重量化，以及利用分页优化器防止训练中内存峰值。基于 QLoRA 训练的 Guanaco 模型家族在 Vicuna 基准测试中表现出色，例如 Guanaco 65B 在单块 48GB GPU 上微调 24 小时后，达到了 ChatGPT 99.3% 的性能水平，显著降低了大型模型微调的内存门槛。论文的重要结论还包括：数据质量远优于数据量，以及 QLoRA 能够完全恢复 16 位全参数微调的性能。","order":1,"sourceName":"QLoRA: Efficient Finetuning of Quantized LLMs","sourceUrl":"https://arxiv.org/abs/2305.14314"}]},{"id":232,"slug":"awq","title":"AWQ","description":"AWQ（Activation-aware Weight Quantization）旨在解决模型在边缘设备部署时面临的内存和带宽挑战。该方法基于一个关键观察：并非所有权重都同等重要，仅保护 1% 的关键权重就能显著降低量化误差。与传统方法不同，AWQ 通过分析激活分布而非权重本身来识别重要通道，并采用每通道缩放技术来保护这些权重免受量化误差影响，同时避免了硬件低效的混合精度量化。AWQ 首次成功实现了多模态大语言模型的量化，在指令调优模型上表现出色，并保持了硬件友好的数据布局。","sourceName":"AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration","sourceUrl":"https://arxiv.org/abs/2306.00978","publishedDate":"2023-06-01","isFree":false,"isMajor":false,"logoUrl":"","types":["quantization"],"nodes":[{"id":565,"slug":"awq-overview","title":"AWQ","description":"AWQ（Activation-aware Weight Quantization）旨在解决模型在边缘设备部署时面临的内存和带宽挑战。该方法基于一个关键观察：并非所有权重都同等重要，仅保护 1% 的关键权重就能显著降低量化误差。与传统方法不同，AWQ 通过分析激活分布而非权重本身来识别重要通道，并采用每通道缩放技术来保护这些权重免受量化误差影响，同时避免了硬件低效的混合精度量化。AWQ 首次成功实现了多模态大语言模型的量化，在指令调优模型上表现出色，并保持了硬件友好的数据布局。","order":1,"sourceName":"AWQ: Activation-aware Weight Quantization for LLM Compression and Acceleration","sourceUrl":"https://arxiv.org/abs/2306.00978"}]},{"id":233,"slug":"kto","title":"KTO","description":"传统方法如 DPO 需要成本高昂的成对偏好数据，而 KTO（Kahneman-Tversky Optimization）仅需一个二元信号（输出是否\"可取\"）即可优化模型。论文首先提出了\"人类感知损失\"（HALOs）的概念，指出 DPO 等成功方法之所以有效，是因为其损失函数隐式地编码了人类决策中的认知偏差（如损失厌恶）。KTO 则更进一步，直接依据卡尼曼-特沃斯基的人类效用模型，设计了一个最大化人类感知效用的损失函数。实验表明，在 1B 到 30B 参数规模上，KTO 仅使用二元反馈就能匹配甚至超越 DPO 的性能，并能处理极端的数据不平衡，对于足够好的预训练模型甚至可以跳过监督微调步骤。论文的最终结论是，不存在 universally superior 的对齐损失函数，最佳选择取决于具体任务和数据环境所适用的归纳偏差，而 KTO 为获取成本更低、形式更简单的反馈数据提供了一种高效且强大的对齐方案。","sourceName":"KTO: Model Alignment as Prospect Theoretic Optimization","sourceUrl":"https://arxiv.org/abs/2402.01306","publishedDate":"2024-02-02","isFree":false,"isMajor":false,"logoUrl":"","types":["alignment"],"nodes":[{"id":566,"slug":"kto-basics","title":"KTO","description":"传统方法如 DPO 需要成本高昂的成对偏好数据，而 KTO（Kahneman-Tversky Optimization）仅需一个二元信号（输出是否\"可取\"）即可优化模型。论文首先提出了\"人类感知损失\"（HALOs）的概念，指出 DPO 等成功方法之所以有效，是因为其损失函数隐式地编码了人类决策中的认知偏差（如损失厌恶）。KTO 则更进一步，直接依据卡尼曼-特沃斯基的人类效用模型，设计了一个最大化人类感知效用的损失函数。实验表明，在 1B 到 30B 参数规模上，KTO 仅使用二元反馈就能匹配甚至超越 DPO 的性能，并能处理极端的数据不平衡，对于足够好的预训练模型甚至可以跳过监督微调步骤。论文的最终结论是，不存在 universally superior 的对齐损失函数，最佳选择取决于具体任务和数据环境所适用的归纳偏差，而 KTO 为获取成本更低、形式更简单的反馈数据提供了一种高效且强大的对齐方案。","order":1,"sourceName":"KTO: Model Alignment as Prospect Theoretic Optimization","sourceUrl":"https://arxiv.org/abs/2402.01306"}]},{"id":234,"slug":"orpo","title":"ORPO","description":"ORPO（Odds Ratio Preference Optimization）是一种创新的单阶段偏好对齐方法，它通过将几率比损失项直接整合到监督微调（SFT）的负对数似然损失中，实现了无需参考模型的偏好优化。传统 SFT 会同时提高偏好响应和拒绝响应的生成概率，而 ORPO 通过引入几率比损失 $L_{OR} = -\\log \\sigma(\\log(\\text{odds}(y_w|x) / \\text{odds}(y_l|x)))$ 来动态惩罚拒绝响应，从而在单阶段训练中同时完成领域适应和偏好对齐。实验证明，ORPO 在多个基准测试中表现出色：仅使用 UltraFeedback 数据集单轮训练，Mistral-ORPO-β（7B）在 AlpacaEval2.0 上达到 12.20%，在 IFEval 指令级宽松准确率上达到 66.19%，在 MT-Bench 上获得 7.32 分，超越了包括 Zephyr-β 和 Llama-2-Chat（13B）在内的更大规模模型。ORPO 不仅简化了训练流程（无需 SFT 预热阶段和参考模型），还显著降低了计算资源需求（相比 DPO 减少约 50% 训练时间），为资源受限环境下的高效模型对齐提供了新范式。","sourceName":"ORPO: Monolithic Preference Optimization without Reference Model","sourceUrl":"https://arxiv.org/abs/2403.07691","publishedDate":"2024-03-12","isFree":false,"isMajor":false,"logoUrl":"","types":["alignment"],"nodes":[{"id":567,"slug":"orpo-basics","title":"ORPO","description":"ORPO（Odds Ratio Preference Optimization）是一种创新的单阶段偏好对齐方法，它通过将几率比损失项直接整合到监督微调（SFT）的负对数似然损失中，实现了无需参考模型的偏好优化。传统 SFT 会同时提高偏好响应和拒绝响应的生成概率，而 ORPO 通过引入几率比损失 $L_{OR} = -\\log \\sigma(\\log(\\text{odds}(y_w|x) / \\text{odds}(y_l|x)))$ 来动态惩罚拒绝响应，从而在单阶段训练中同时完成领域适应和偏好对齐。实验证明，ORPO 在多个基准测试中表现出色：仅使用 UltraFeedback 数据集单轮训练，Mistral-ORPO-β（7B）在 AlpacaEval2.0 上达到 12.20%，在 IFEval 指令级宽松准确率上达到 66.19%，在 MT-Bench 上获得 7.32 分，超越了包括 Zephyr-β 和 Llama-2-Chat（13B）在内的更大规模模型。ORPO 不仅简化了训练流程（无需 SFT 预热阶段和参考模型），还显著降低了计算资源需求（相比 DPO 减少约 50% 训练时间），为资源受限环境下的高效模型对齐提供了新范式。","order":1,"sourceName":"ORPO: Monolithic Preference Optimization without Reference Model","sourceUrl":"https://arxiv.org/abs/2403.07691"}]},{"id":235,"slug":"simpo","title":"SimPO","description":"SimPO（Simple Preference Optimization）是一种简单而有效的离线偏好优化方法，旨在解决传统直接偏好优化（DPO）中存在的训练与推理不一致问题以及计算效率低下的缺陷。其核心创新在于采用长度归一化的奖励函数，即使用策略模型生成响应的平均对数概率作为隐式奖励，从而与生成时使用的指标直接对齐，同时引入了目标奖励边际来确保获胜响应与失败响应之间有足够的区分度。这种方法不仅消除了对参考模型的依赖，显著降低了内存和计算成本，还在多个基准测试中表现出显著优势：在 AlpacaEval 2 上比 DPO 提升高达 6.4 个百分点，在 Arena-Hard 上提升高达 7.5 个百分点，其中基于 Gemma-2-9B-it 训练的 SimPO 模型在 AlpacaEval 2 上取得了 72.4% 的长度控制胜率，在 Chatbot Arena 的 \u003c10B 参数模型中排名第一，证明了其在保持响应长度稳定的同时，能够更有效地利用偏好数据，提升模型的对齐性能。","sourceName":"SimPO: Simple Preference Optimization with a Reference-Free Reward","sourceUrl":"https://arxiv.org/abs/2405.14734","publishedDate":"2024-05-23","isFree":false,"isMajor":false,"logoUrl":"","types":["alignment"],"nodes":[{"id":568,"slug":"simpo-basics","title":"SimPO","description":"SimPO（Simple Preference Optimization）是一种简单而有效的离线偏好优化方法，旨在解决传统直接偏好优化（DPO）中存在的训练与推理不一致问题以及计算效率低下的缺陷。其核心创新在于采用长度归一化的奖励函数，即使用策略模型生成响应的平均对数概率作为隐式奖励，从而与生成时使用的指标直接对齐，同时引入了目标奖励边际来确保获胜响应与失败响应之间有足够的区分度。这种方法不仅消除了对参考模型的依赖，显著降低了内存和计算成本，还在多个基准测试中表现出显著优势：在 AlpacaEval 2 上比 DPO 提升高达 6.4 个百分点，在 Arena-Hard 上提升高达 7.5 个百分点，其中基于 Gemma-2-9B-it 训练的 SimPO 模型在 AlpacaEval 2 上取得了 72.4% 的长度控制胜率，在 Chatbot Arena 的 \u003c10B 参数模型中排名第一，证明了其在保持响应长度稳定的同时，能够更有效地利用偏好数据，提升模型的对齐性能。","order":1,"sourceName":"SimPO: Simple Preference Optimization with a Reference-Free Reward","sourceUrl":"https://arxiv.org/abs/2405.14734"}]},{"id":236,"slug":"mixtral-8x7b","title":"Mixtral 8x7B","description":"Mixtral of Experts 是 Mistral AI 于 2024 年 1 月发布的技术报告，详细介绍了其开源的稀疏混合专家语言模型 Mixtral 8x7B。该模型基于 Mistral 7B 的 Transformer 架构，但用混合专家层替代了传统前馈网络，每层包含 8 个专家，每个输入 token 仅动态选择 2 个专家进行处理，使得模型虽然拥有 47B 参数总量，但推理时仅激活 13B 参数，实现了高效计算与高性能的平衡。Mixtral 8x7B 支持 32k tokens 的上下文长度，在多语言数据上进行了强化预训练，在数学、代码生成和多语言理解任务中表现优异，整体性能超越或匹配 Llama 2 70B 和 GPT-3.5。其指令微调版本 Mixtral 8x7B - Instruct 通过监督微调和直接偏好优化，在人类评估中超越了多个主流对话模型。该模型以 Apache 2.0 许可开源，为研究社区提供了重要的稀疏混合专家架构参考实现，展示了如何在保持大模型容量的同时实现实际部署的高效推理。","sourceName":"Mixtral of Experts","sourceUrl":"https://arxiv.org/abs/2401.04088","publishedDate":"2024-02-08","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/mistral.png","types":["llm"],"nodes":[{"id":569,"slug":"mixtral-8x7b-pretraining-model","title":"预训练模型","description":"该模型使用包含多种欧洲语言的大型网络数据语料库进行训练，显著提高了多语言数据的采样比例，使其在多语言基准测试中表现出色。模型基于 Transformer 架构，采用稀疏混合专家设计，总参数量达 46.7B，但每个 token 仅激活 12.9B 参数，通过每层 8 个专家和 Top-2 路由机制实现高效计算。训练中采用了滑动窗口注意力和分组查询注意力等技术，路由器分析显示专家选择更符合语法而非领域特征，连续 token 倾向于分配给相同专家。这种稀疏激活机制使模型在保持大容量参数的同时，训练和推理效率远高于同等规模密集模型，最终在多项任务中达到或超越了 Llama 2 70B 和 GPT-3.5 的性能水平。","order":1,"sourceName":"","sourceUrl":""},{"id":570,"slug":"mixtral-8x7b-instruction-tuning","title":"指令微调","description":"Mixtral-8x7B-Instruct 模型是通过监督微调（Supervised Fine-Tuning, SFT）和直接偏好优化（Direct Preference Optimization, DPO）对基础模型进行指令微调得到的。这一过程旨在使模型更好地理解和遵循人类指令，提升其对话和任务执行能力。论文指出，经过指令微调的 Mixtral-8x7B-Instruct 在人类评估基准测试中表现优异，超越了 GPT-3.5 Turbo、Claude-2.1、Gemini Pro 以及 Llama 2 70B 聊天模型等竞争对手。研究还表明，混合专家（MoE）架构的模型相比密集模型，可能从指令微调中获得更大的性能提升。","order":2,"sourceName":"","sourceUrl":""}]},{"id":237,"slug":"gemma1","title":"Gemma 1","description":"Google DeepMind 于 2024 年 3 月发布论文正式介绍了 Gemma 系列开源轻量级语言模型。该模型基于与旗舰模型 Gemini 相同的研究和技术构建，旨在提供高性能且可商用的轻量化解决方案。论文详细阐述了 Gemma 提供 2B 和 7B 两种参数规模的模型，每种都包含预训练和指令微调版本，并采用 Transformer 解码器架构、旋转位置编码（RoPE）、GeGLU 激活函数等关键技术。\r\n\r\n在 18 个文本基准测试中，Gemma 在 11 个任务上超越了同等规模的开放模型，同时在语言理解、推理和安全性方面表现优异。论文还强调了负责任 AI 发布的重要性，提供了全面的安全评估和模型开发细节，标志着 Google 通过开源推动 AI 社区发展的战略转变。","sourceName":"Gemma: Open Models Based on Gemini Research and Technology","sourceUrl":"https://arxiv.org/abs/2403.08295","publishedDate":"2024-03-13","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":571,"slug":"gemma1-pretraining-data","title":"预训练数据","description":"Gemma 2B 模型在约 2 万亿（2T）个 token 上进行预训练，而 Gemma 7B 模型则在约 6 万亿（6T）个 token 上训练，这些数据全部来自纯英文内容，主要来源于网络文档（包括网页内容、文章、博客等）、数学内容（数学公式、证明、解题过程）和代码（各种编程语言的代码片段和文档），Gemma 不是多语言模型，也不针对多语言任务进行优化。\n\n在数据过滤方面，Gemma 实施了严格的多阶段过滤机制：首先使用启发式方法和基于模型的分类器移除有害或低质量内容，过滤掉个人信息和其他敏感数据；其次从预训练数据混合中过滤所有评估集，运行针对性的污染分析以检查评估集泄漏；最后通过在 2B 和 7B 模型上进行一系列消融实验确定最终数据混合，采用分阶段训练方法，在整个训练过程中动态调整语料库混合，使高质量数据的权重在训练后期逐渐增加，确保了数据质量与安全性的双重提升，这也是 Gemma 在关键基准测试中能超越更大规模模型的重要原因。","order":1,"sourceName":"","sourceUrl":""},{"id":572,"slug":"gemma1-pretraining-model","title":"预训练模型","description":"Gemma-1 模型架构基于 Transformer 解码器，但采用了多项改进：7B 模型使用多头注意力，而 2B 模型使用多查询注意力（`num_kv_heads = 1`）；采用旋转位置嵌入（RoPE）替代绝对位置嵌入，且在输入和输出间共享嵌入；用 GeGLU 激活函数的近似版本替代标准 ReLU；在每个 Transformer 子层使用 RMSNorm 进行归一化以稳定训练。\n\n分词器方面，Gemma 使用了 Gemini 的 SentencePiece 分词器的子集，词汇表大小为 256k tokens，具有分割数字、不移除额外空格、对未知 token 使用字节级编码的特性，继承了 Gemini 的大型词汇表（256k 条目），旨在处理多种语言，因此与仅限于一两种语言的模型相比，其嵌入参数计数更大。","order":2,"sourceName":"","sourceUrl":""},{"id":573,"slug":"gemma1-pretraining-details","title":"预训练细节","description":"Gemma 模型的训练基础设施是一个为高效训练大型语言模型而高度优化的大规模并行系统，其核心基于 Google 的专用硬件与软件栈。模型完全在 TPUv5e 张量处理单元上进行训练，其中 Gemma 2B 和 7B 版本分别动用了 512 个和 4096 个芯片，这些芯片以 16×16 的二维环面网络结构组成 Pod。软件层面，训练采用 JAX 和 ML Pathways 框架，利用其“单一控制器”编程范式，通过单个 Python 进程即可协调整个分布式训练流程，极大简化了开发。\n\n为了驾驭如此庞大的计算资源，训练采用了结合数据并行、模型分片（如 7B 模型在 Pod 内进行 16 路分片）以及类似 ZeRO-3 的优化器状态分片等精细策略，并由 GSPMD 分区器和 MegaScale XLA 编译器对计算图进行极致优化。此外，Google 特别估算了此次训练产生的碳足迹（约 131 吨二氧化碳当量），并通过提升能效、购买可再生能源和碳抵消等方式，确保了其数据中心运营及本次训练实现碳中和，体现了在追求前沿 AI 性能的同时对环境责任的考量。","order":3,"sourceName":"","sourceUrl":""},{"id":574,"slug":"gemma1-base-model-evaluation","title":"基础模型评估","description":"Gemma-1 论文对基础模型（pre-trained model）进行了全面评估，主要包括记忆评估、个人信息处理评估和学术基准测试。在记忆评估中，Gemma 预训练模型采用与 Anil 等人（2023）相同的方法进行测试，从语料库中抽取 10,000 个文档，使用前 50 个 token 作为提示，评估精确记忆（模型生成的后续 50 个 token 与真实延续完全匹配）和近似记忆（10% 编辑距离阈值）。评估结果显示，Gemma 的记忆率与 PaLM 相当，但没有发现记忆的敏感数据，仅有少量被分类为“可能个人”的数据被记忆。\n\n在个人信息评估中，Gemma 使用 Google Cloud Sensitive Data Protection 工具进行分析，将最高严重性分类为“敏感”，其余为“个人”，结果表明无敏感数据被记忆。在学术基准测试中，Gemma 基础模型在多个领域（物理推理、社会推理、问答、编码、数学、常识推理、语言建模和阅读理解）与类似规模的开源模型进行比较，Gemma 7B 在 MMLU（64.3%）和 MBPP（44.4%）等关键基准测试中表现优异，证明了其在基础语言理解和推理能力上的竞争力，这些评估与 Gemini 模型家族的评估方法一致，为 Gemma 作为负责任的开源模型提供了坚实基础。","order":4,"sourceName":"","sourceUrl":""},{"id":575,"slug":"gemma1-sft","title":"SFT","description":"Gemma-1 的 SFT（监督微调）阶段是连接其强大预训练基础模型与最终可用指令模型的关键桥梁，其核心是通过高质量的指令数据对模型进行校准。该阶段采用了一种创新的、基于模型自动评估的数据构建方法：首先，将人工生成的指令数据与由大模型合成的数据混合；其次，通过“LM 侧边评估”流程进行筛选，即让不同的候选模型对同一提示生成响应，再由一个更强的“裁判”模型评判优劣，从而自动化地构建出侧重于指令遵循、事实性、创造性和安全性的高质量训练对。\n\n在训练时，所有对话数据都经过特定的格式化处理，使用特殊令牌来明确标注对话角色和轮次边界。这一精心设计的 SFT 过程，不仅显著提升了模型遵循复杂指令的能力，也为后续基于人类反馈的强化学习（RLHF）阶段的偏好对齐奠定了坚实基础。","order":5,"sourceName":"","sourceUrl":""},{"id":576,"slug":"gemma1-rlhf","title":"RLHF","description":"其 RLHF 阶段并未使用业界常见的 PPO + RM 组合，而是采用了一种带有 Kullback–Leibler（KL）散度正则化项的 REINFORCE 算法变体。\n\n具体而言，其流程为：首先，在 Bradley-Terry 模型框架下，利用人类标注的偏好对数据训练一个奖励模型（RM）。随后，使用一个改进的 REINFORCE 算法（而非 PPO）来优化策略模型（即 Gemma 模型），目标是在最大化奖励模型给出的奖励的同时，通过 KL 散度惩罚项约束策略模型，使其输出分布不会过度偏离初始的监督微调（SFT）模型。这一设计旨在有效对齐人类偏好的同时，维持模型的稳定性并缓解奖励黑客问题。","order":6,"sourceName":"","sourceUrl":""},{"id":577,"slug":"gemma1-chat-model-evaluation","title":"对话模型评估","description":"Gemma-1 论文中对对话模型（即指令微调模型）的评估主要包含人工偏好评估和自动化基准测试两个核心部分。在人工评估中，研究团队构建了两个保留提示集：一个约 1000 条提示的集合，涵盖创意写作、编程和指令跟随等多样化任务，用于评估模型在通用指令遵循能力上的表现；另一个约 400 条提示的集合，专门设计用于测试模型对基本安全协议的遵守情况。评估采用成对比较（side-by-side comparison）的方式，将 Gemma-7B IT 和 Gemma-2B IT 的响应与强劲的竞争对手 Mistral v0.2 7B Instruct 的响应进行对比，由人类评估员选择更优的响应。\n\n此外，论文还报告了模型在包括 MMLU（大规模多任务语言理解）、GSM8K（数学）、HumanEval（代码）等广泛的自动化学术基准上的性能，这些结果进一步验证了对话模型在知识、推理和代码生成等多方面的综合能力。","order":7,"sourceName":"","sourceUrl":""}]},{"id":238,"slug":"chatglm","title":"ChatGLM","description":"ChatGLM 系列是由清华和智谱 AI 团队研发的大语言模型家族，其发展历程从千亿参数的 GLM-130B 基础模型开始，逐步演进到 ChatGLM-6B 开源对话模型，最终形成最新的 GLM-4 系列（包括 GLM-4、GLM-4-Air 和 GLM-4-9B）。\r\n\r\n该系列基于 GLM 架构，采用自回归空白填充目标，后面转向 Decoder-only 架构，在约 10 万亿 token 的多语言语料上进行预训练，并通过监督微调和人类反馈强化学习实现高质量对齐。评估显示 GLM-4 在 MMLU、GSM8K 等通用基准上接近或超越 GPT-4，在中文对齐和长上下文处理方面表现突出，特别优化的 GLM-4 All Tools 模型能自主调用网络浏览器、Python 解释器等工具完成复杂任务。","sourceName":"ChatGLM: A Family of Large Language Models from GLM-130B to GLM-4 All Tools","sourceUrl":"https://arxiv.org/abs/2406.12793","publishedDate":"2024-06-18","isFree":false,"isMajor":true,"logoUrl":"https://z-cdn.chatglm.cn/z-blog/z-icon.svg","types":["llm"],"nodes":[{"id":578,"slug":"chatglm-prefix-decoder-only-architecture","title":"Prefix Decoder-only 架构（已停用）","description":"ChatGLM 最初采用的 Prefix Decoder-only 架构是在标准 Causal Decoder-only 架构（如 GPT 系列）基础上发展而来的创新设计。其核心特点在于将注意力机制分为两部分：在处理输入内容时采用双向注意力（Prefix Attention），使模型能够同时关注前后文信息以获得更全面的理解；而在生成输出时则切换为单向注意力（Causal Attention），确保自回归生成的连贯性。\n\n这种混合注意力设计使 ChatGLM 在保持生成能力的同时，增强了上下文理解能力，特别适合对话任务。具体实现中，模型通过特殊的 attention mask 区分输入部分（Part A）和生成部分（Part B），输入部分使用双向 mask 允许关注所有位置，生成部分使用因果 mask 仅关注左侧历史信息。不过后续的 ChatGLM2 和 ChatGLM3 版本已完全转向标准的 Decoder-only 架构，统一使用 Causal Attention。","order":1,"sourceName":"","sourceUrl":""},{"id":579,"slug":"chatglm-glm4-pretraining-architecture","title":"GLM-4 预训练模型架构","description":"ChatGLM4（GLM-4 系列）的预训练模型架构基于 Transformer，并针对性能、效率和长上下文处理进行了多项关键优化：它采用分组查询注意力（GQA）来减少推理时的 KV 缓存，提升效率；使用旋转位置嵌入（RoPE）增强位置建模；以 RMSNorm 和 SwiGLU 激活函数改善性能；并采用 \"No Bias Except QKV\" 设计来提升训练速度与长度外推能力。\n\n模型规模显著扩大，例如 GLM-4-9B 的层数增至 40 层，词表扩至 151,552，支持 128K 标准长上下文及 1M 超长上下文专项版本。预训练数据约 10 万亿 token，涵盖多语言。自 ChatGLM2 起，该系列已从早期的 Prefix Decoder-only 架构（混合注意力）完全转向标准 Decoder-only 架构（全程单向注意力），以提升训练效率、降低工程复杂度并更好地兼容主流生态。","order":2,"sourceName":"","sourceUrl":""},{"id":580,"slug":"chatglm-glm4-alignment","title":"GLM-4 对齐","description":"ChatGLM 的对齐（Alignment）过程主要通过多阶段、组合式的对齐技术实现。首先，监督微调使用高质量的真实人类指令-输出配对数据，唤醒模型的指令遵循能力，为其后续优化奠定基础。随后，基于人类反馈的强化学习（RLHF，具体通过 ChatGLM-RLHF 流程实现）对模型进行精细化校准：通过收集人类对多个回答的偏好数据、训练奖励模型、并利用 PPO/DPO 等算法优化策略模型，使模型的输出在安全性、事实性、相关性、帮助性等维度上更贴合人类的主观偏好，有效缓解了响应不当拒绝、双语混合生成不流畅、多轮对话不连贯等问题。\n\n为了降低对昂贵人类反馈数据的依赖，智谱 AI 还研发了 Self-Contrast 技术，这是一种无反馈对齐策略，它利用目标大模型自身自动生成大量负样本，用于构建对比数据以高效训练奖励模型。","order":3,"sourceName":"","sourceUrl":""}]},{"id":239,"slug":"llama3-1","title":"Llama 3","description":"Llama 3 系列是一个原生支持多语言、编码、推理和工具使用的密集 Transformer 语言模型家族，其旗舰版本拥有 4050 亿参数和 128K token 的上下文窗口；开发过程围绕数据、规模和管理复杂性三大杠杆展开，通过在约 15T 多语言 tokens 上预训练（数据量为 Llama 2 的 8 倍以上）、投入 $3.8 \\times 10^{25}$ FLOPs 的算力（约为 Llama 2 最大版本的 50 倍），并坚持使用标准密集架构与相对简洁的监督微调（SFT）、拒绝采样（RS）和直接偏好优化（DPO）后训练流程来实现稳定扩展与对齐；论文详细说明了模型训练分为在 15.6T tokens 和 8K 上下文窗口上的标准预训练、将上下文扩展至 128K 的持续预训练，以及通过多轮 SFT 和 DPO 注入指令遵循、工具使用和安全对齐的后训练阶段；在广泛评估中，旗舰 405B 模型在 MMLU、HumanEval 等基准上取得了与 GPT-4（包括 GPT-4o）相当的性能，而 8B 和 70B 模型在同参数量级中表现最佳。","sourceName":"The Llama 3 Herd of Models","sourceUrl":"https://arxiv.org/abs/2407.21783","publishedDate":"2024-07-23","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/meta.png","types":["llm"],"nodes":[{"id":581,"slug":"llama3-1-pretraining-data","title":"预训练数据","description":"Llama 3 的预训练数据在数量和质量上都进行了重大升级，构成了模型性能提升的基石。具体来说，团队构建了一个包含约 15T 多语言 tokens 的庞大语料库，其中旗舰 405B 模型使用了 15.6T tokens 进行训练，这一数据规模是前代 Llama 2 所用 1.8T tokens 的 8 倍以上。除了规模的飞跃，团队还开发了更精细的预处理和数据整理流程，对预训练数据进行严格筛选以提升质量，并确保了数据的多语言特性，为模型最终原生支持多语言能力奠定了基础。","order":1,"sourceName":"","sourceUrl":""},{"id":582,"slug":"llama3-1-pretraining-model","title":"预训练模型","description":"Llama 3 的预训练模型架构以标准密集 Transformer 为基础，其性能飞跃主要归功于数据质量、多样性和训练规模的提升，而非架构的剧烈变革。\n\n团队在坚持这一稳定架构的前提下，引入了四项关键改进：采用分组查询注意力（GQA）以提升推理效率并减少键值缓存，使用能防止跨文档注意力的掩码以支持超长序列的持续预训练，将词汇表大幅扩展至 128K tokens（结合 tiktoken 的 100K 和新增的 28K 多语言 token）以提升压缩率和多语言能力，并将 RoPE 基频提高至 500,000 以更好地支持长上下文。\n\n在此基础上，通过系统的规模定律（Scaling Laws）实验，确定了旗舰 405B 模型的超参数（如 126 层、16,384 维度、128 个注意力头），确保其在给定算力预算下接近计算最优。","order":2,"sourceName":"","sourceUrl":""},{"id":583,"slug":"llama3-1-large-scale-engineering","title":"大规模工程","description":"支撑 Llama 3 405B 旗舰模型训练的大规模工程创新，核心是：\n\n- 通过构建一个由 16,000 块 H100 GPU、240 PB 容量的 Tectonic 存储和基于 RoCE 的 400 Gbps 三层 Clos 网络组成的生产级基础设施；\n- 并针对超大规模训练设计了按 `[TP, CP, PP, DP]` 顺序优化的 4D 并行策略，其中通过灵活的微批次调度和负载均衡改进了流水线并行（PP）；\n- 并采用基于全收集（all-gather）的上下文并行（CP）以高效支持长达 128K tokens 的序列训练，同时开发定制的 NCCLX 通信库以提升多跳网络性能，并采用 FP32 梯度累积确保数值稳定性；\n- 此外，团队还通过工具链（如 NCCL 飞行记录器）和自动化运维，在 54 天预训练周期内面对 466 次任务中断（78% 由硬件故障导致）的情况下，仍实现了超过 90% 的有效训练时间，并观察到温度变化引起每日 1-2% 吞吐量波动、大规模 GPU 同步导致数十兆瓦电力冲击等超大规模训练特有的工程挑战。","order":3,"sourceName":"","sourceUrl":""},{"id":584,"slug":"llama3-1-pretraining-details","title":"预训练细节","description":"Llama 3 405B 的预训练配方（Training Recipe）是一个由初始预训练、长上下文预训练和退火构成的三阶段流程，并通过动态调整数据混合来精细调控模型能力：\n\n- 在初始预训练阶段，使用 AdamW 优化器和余弦学习率调度（峰值 $8 \\times 10^{-5}$，经 8,000 步预热后衰减），并通过将批量大小从 400 万 tokens 逐步翻倍至 1600 万 tokens 来平衡稳定性与效率，同时动态增加非英语、数学和最新网页数据的比例以提升多语言、推理能力并更新知识截止期；\n- 随后进入长上下文预训练阶段，为避免早期高计算成本，分六个阶段逐步将上下文窗口从 8K 扩展到 128K tokens，并确保模型在短任务上性能恢复且完美通过“大海捞针”测试后才推进；\n- 最后在退火阶段，将学习率在 4000 万 tokens 上线性衰减至 0，并上采样高质量代码和数学数据（但不含任何基准测试集）以进一步提升关键性能，最终对检查点进行 Polyak 平均得到最终模型。","order":4,"sourceName":"","sourceUrl":""},{"id":585,"slug":"llama3-1-post-training-data","title":"后训练数据","description":"后训练数据是决定 Llama 3 模型有用性和行为的关键，其构建围绕偏好数据与监督微调数据展开：偏好数据通过在每个后训练轮次后部署多个不同模型，为同一用户提示采样两个响应以增加多样性，并由标注者进行四级偏好强度评级，同时引入编辑步骤让标注者进一步改进被选中的响应，从而形成部分包含“编辑后的 > 被选的 > 被拒的”三个明确排序响应的数据，且与 Llama 2 相比，提示和响应的平均长度均有所增加，表明训练任务更复杂；监督微调数据则混合了利用奖励模型从人类标注提示中采样并经筛选的拒绝采样数据、合成数据及其他数据源，并经过严格的质量控制与清洗，以覆盖知识性问答、精确指令跟随、推理、编码、多语言、工具使用等多个方面。","order":5,"sourceName":"","sourceUrl":""},{"id":586,"slug":"llama3-1-post-training-model","title":"后训练模型","description":"该流程以奖励模型（RM）、监督微调（SFT）和直接偏好优化（DPO）为三大支柱，并迭代进行六轮以逐步提升模型能力；\n\n- 首先，为支持工具调用等复杂功能，设计了使用特殊头部和终止 token 的多消息聊天协议；\n- 在每一轮中，先在人类标注的偏好数据上训练覆盖不同能力的奖励模型，该模型用于后续的拒绝采样；\n- 随后，利用奖励模型对提示进行拒绝采样，并结合合成数据等来源构成 SFT 数据，对预训练模型进行监督微调（学习率 $10^{-5}$，仅对目标响应计算损失）；\n- 在此基础上，使用最先进批次的偏好数据进行直接偏好优化（DPO），并引入关键改进，即掩码格式化 token 以避免学习目标冲突，以及添加 NLL 损失正则化以稳定训练；\n- 最后，在各阶段对来自不同实验的模型进行平均以增强稳健性。","order":6,"sourceName":"","sourceUrl":""}]},{"id":240,"slug":"gemma2","title":"Gemma 2","description":"Gemma 2 是 Google Gemma 团队于 2024 年 7 月 31 日发布的轻量级开源语言模型系列，参数规模覆盖 20 亿到 270 亿。该论文介绍了模型在架构上的关键改进，包括采用交错局部 - 全局注意力机制和分组查询注意力，并对 20 亿和 90 亿参数模型创新性地使用了知识蒸馏训练方法，而非传统的下一个词预测。\r\n\r\n这些改进使得 Gemma 2 在各自规模下提供了最佳性能，甚至能与参数规模大 2-3 倍的模型竞争，其中 270 亿参数版本专门优化，可在单个 TPU 主机或最新 NVIDIA GPU 上高效运行，所有模型均以商业友好型许可向社区开源。","sourceName":"Gemma 2: Improving Open Language Models at a Practical Size","sourceUrl":"https://arxiv.org/abs/2408.00118","publishedDate":"2024-07-31","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":587,"slug":"gemma2-pretraining-data","title":"预训练数据","description":"Gemma 2 的预训练数据精心设计，包含 27B 模型在 13 万亿 token 的英语数据上训练，9B 模型在 8 万亿 token 上训练，2B 模型在 2 万亿 token 上训练，数据主要来自网络文档、代码和科学文章，以英语为主但使用了 Gemini 设计的 256k 词表（支持多语言）。\n\n数据经过严格过滤，包括减少不安全输出风险、过滤个人信息、去污染评估集以及最小化敏感输出传播，确保模型安全可靠。","order":1,"sourceName":"","sourceUrl":""},{"id":588,"slug":"gemma2-pretraining-model","title":"预训练模型","description":"Gemma 2 是一个基于 Transformer 解码器架构的开放语言模型系列，提供 27B、9B 和 2.6B 三种参数规模，其上下文长度为 8192 个 token，并采用了旋转位置编码（RoPE）与近似 GeGLU 激活函数。\n\n该系列模型在架构上进行了多项关键改进以提升性能与效率：\n\n- 引入了交替注意力机制，通过在网络中间隔使用局部滑动窗口注意力（窗口为 4096 token）与全局注意力（跨度为 8192 token）来平衡计算成本与长程依赖建模能力。\n- 实施了 Logit 软上限技术，即在每个注意力层及最终输出层通过以下公式将 logit 值限制在特定范围内：\n\n  $$\n  logits \\leftarrow soft\\_cap \\cdot \\tanh(logits / soft\\_cap)\n  $$\n\n- 广泛使用 RMSNorm 对各子层的输入输出进行归一化，以增强训练稳定性。\n- 在 9B 和 27B 参数模型中采用了分组查询注意力（GQA，组数为 2），这能在基本保持下游任务性能的同时显著提升推理速度。","order":2,"sourceName":"","sourceUrl":""},{"id":589,"slug":"gemma2-pretraining-details","title":"预训练细节","description":"Gemma 2 在预训练的数据规模、处理流程和训练方法上进行了全面优化，并创新性地将知识蒸馏应用于大规模预训练中。预训练核心细节如下：\n\n- 模型在不同参数规模上使用了差异化的数据量，27B 参数模型在 13 万亿个 token 上训练，9B 模型在 8 万亿个 token 上训练，2.6B 模型则在 2 万亿个 token 上训练。\n- 这些 token 主要来自英语网页文档、代码和科学文章，最终的数据混合比例是通过类似于 Gemini 1.0 的消融实验确定的。\n- 模型沿用了与 Gemma 1 和 Gemini 相同的 SentencePiece 分词器，其词汇表大小为 256k，具备拆分数字、保留空白和字节级编码的特性。\n- 在数据安全方面，使用了与 Gemma 1 相同的过滤技术，以降低不适当或敏感内容的风险。\n- 训练基于 Google 的 TPU 集群，例如 27B 模型在 6144 个 TPUv5p 芯片上训练，采用了 768 路数据复制和 8 路模型分片。","order":3,"sourceName":"","sourceUrl":""},{"id":590,"slug":"gemma2-base-model-evaluation","title":"基础模型评估","description":"Gemma 2 基础模型的评估体系主要分为学术能力基准测试和伦理与安全评估两部分。\n\n在学术基准上，模型在 MMLU（多任务语言理解）、GSM8K（数学推理）、HumanEval（代码生成）等一系列广泛认可的任务上进行了系统测试，结果显示其性能与模型规模呈显著正相关：27B 模型在 MMLU 上达到 75.2 分，在 GSM8K 上达到 74.0 分，确立了同尺寸模型的新标杆；9B 模型表现卓越，在 MMLU 上取得 71.3 分，超越了同级别许多开源模型；即便是 2B 轻量级模型也具备实用的基础能力。评估同时指出，模型在语言理解、知识问答、数学和代码生成是其强项领域。\n\n在伦理与安全方面，模型通过了内部严格的红队测试，在防止生成有害内容、减少偏见以及记忆风险控制等方面均符合安全政策阈值，并在 BBQ、TruthfulQA 等外部安全基准上提供了测试结果。总体而言，该评估证实了 Gemma 2 基础模型在参数量与性能之间取得了出色平衡，为开发者提供了强大且高效的基础模型选择。","order":4,"sourceName":"","sourceUrl":""},{"id":591,"slug":"gemma2-post-training","title":"Post-Training","description":"Gemma 2 的后训练阶段旨在将通用预训练基础模型转化为安全、有用且能遵循指令的对话模型，其核心流程包括监督微调（SFT）和基于人类反馈的强化学习（RLHF）。\n\n在 SFT 阶段，模型使用一个由人工生成与更强大“教师模型”合成内容混合而成的纯英文指令 - 响应对数据集进行训练，并采用数据驱动的“侧向选择”方法自动筛选能针对模型弱点强化的高质量数据，同时经过严格过滤以移除不安全内容。随后，在 RLHF 阶段，模型首先在一个规模更大的独立奖励模型（侧重于评估对话能力）指导下进行优化，该奖励模型基于人类偏好数据训练；然后通过带有 KL 散度约束的策略优化算法（如 PPO 变体）微调模型行为，使其输出更符合人类在有用性和无害性方面的偏好，同时防止过度偏离 SFT 基础。最终，采用模型融合技术（如 WARP）对多个策略模型进行加权平均，以提升鲁棒性和稳定性。","order":5,"sourceName":"","sourceUrl":""},{"id":592,"slug":"gemma2-chat-model-evaluation","title":"对话模型评估","description":"评估主要包含基于人类评估的多轮对话场景测试和在公开竞技场上的盲测排名两个核心部分。\n\n在人类评估中，研究团队使用了一个包含 500 个多样化场景的保留测试集，每个场景描述了对模型的一系列多轮请求（如头脑风暴、制定计划或学习新知识），用户与模型的平均交互轮次为 8.4 次。评估结果显示，与 Gemma 1.1 7B 相比，人类评估员对 Gemma 2 9B 和 27B 模型的对话满意度和对话目标实现率的评价均显著更高。此外，Gemma 2 模型在从对话开始到后续轮次中，能更好地保持高质量的回应。这一评估结果与后训练阶段的改进直接相关：Gemma 2 在 RLHF 阶段使用了一个规模更大、且专门针对对话能力（特别是多轮交互）进行优化的奖励模型，以更好地对齐人类偏好。\n\n在自动评估与公开排名方面，Gemma 2 的指令微调模型在权威的盲测平台 LMSYS Chatbot Arena 上取得了优异成绩。其中，270 亿参数（27B）的 Gemma 2 指令模型击败了参数规模大得多的 Llama 3 70B 等模型，在所有开源权重的模型中位列第一；而 90 亿参数（9B）的模型则是当时 15B 以下参数规模中成绩最好的。后续发布的 20 亿参数（2B）模型同样表现突出，其得分超越了 GPT-3.5 以及参数规模数十倍于它的 Mixtral 8x7B 和 Llama 2 70B 等模型。","order":6,"sourceName":"","sourceUrl":""}]},{"id":241,"slug":"gemma3","title":"Gemma 3","description":"Gemma 3 是由 Google DeepMind 开发的 Gemma 系列最新多模态开源语言模型，作为 Gemma 家族的轻量级扩展版本，其规模从 1B 到 27B 参数不等。该模型首次引入了图像理解能力，采用定制版 SigLIP 视觉编码器处理图像，将图像转换为 256 个固定大小的向量嵌入，并通过 \"Pan & Scan\" 方法处理不同纵横比的图像。\r\n\r\nGemma 3 支持长达 128K tokens 的上下文（1B 模型支持 32K），通过 5:1 局部 / 全局注意力层交错设计显著降低 KV 缓存内存使用。在性能上，Gemma 3-4B-IT 可与 Gemma 2-27B-IT 竞争，而 Gemma 3-27B-IT 在 LMSYS Chatbot Arena 上获得 1338 Elo 评分，跻身前 10 名，性能接近 Gemini-1.5-Pro。模型专为消费级硬件设计，提供多种量化版本，同时通过严格的安全过滤和评估，确保了较低的文本记忆率和有害内容生成风险。","sourceName":"Gemma 3 Technical Report","sourceUrl":"https://arxiv.org/abs/2503.19786","publishedDate":"2025-03-25","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/google.svg","types":["llm"],"nodes":[{"id":593,"slug":"gemma3-pretraining-data","title":"预训练数据","description":"Gemma 3 的预训练数据在规模、组成和处理上均有显著改进：\n\n- 数据规模方面，27B 模型使用 14 万亿 tokens，12B 模型为 12 万亿 tokens，4B 模型为 4 万亿 tokens，1B 模型为 2 万亿 tokens。\n- 数据组成包含图文混合内容，涵盖网页文档、代码、数学文本和图像，并大幅增加多语言数据比例，支持超过 140 种语言，采用类似 Chung 等人的策略平衡语言分布。\n- 数据处理采用多重过滤机制，包括严格的 CSAM（儿童性虐待材料）过滤、敏感个人信息去除以及质量重新加权步骤以减少低质量内容。\n- 训练数据的知识截止日期为 2024 年 8 月。","order":1,"sourceName":"","sourceUrl":""},{"id":594,"slug":"gemma3-pretraining-model","title":"预训练模型","description":"Gemma 3 的预训练模型架构采用了多项创新设计，实现了多模态能力与长上下文处理的高效结合。\n\n- 其核心创新在于 5:1 的局部 / 全局注意力层交错设计，每 5 个局部层后跟 1 个全局层，局部层跨度仅 1024 tokens，而全局层的 RoPE 基频率从 10k 提升至 1M。\n- 模型能有效处理长达 128K tokens 的上下文（1B 模型支持 32K），同时将 KV 缓存内存开销从 \"global only\" 配置的 60% 大幅降低至 15% 以下。\n- 在多模态方面，Gemma 3 使用 400M 参数的 SigLIP 视觉编码器（Vision Transformer）处理图像，将输入图像标准化为 896×896 像素并转换为 256 个固定大小的向量。\n- 为解决非方形图像处理问题，Gemma 3 引入了 Pan & Scan（P&S）方法，在推理时将图像分割为非重叠的等大小裁剪块并调整为 896×896 像素。\n- 所有 4B、12B 和 27B 模型共享同一个视觉编码器，且在预训练前对图像进行预计算嵌入，不增加语言模型训练成本。","order":2,"sourceName":"","sourceUrl":""},{"id":595,"slug":"gemma3-pretraining-details","title":"预训练细节","description":"Gemma 3 的预训练核心在于高效的知识蒸馏（Knowledge Distillation）与量化感知训练（Quantization-Aware Training, QAT）的结合。\n\n在知识蒸馏中，模型采用了一种高效的采样策略：对于训练数据中的每个 token，仅从教师模型输出的完整 logits 中采样 256 个最有可能的候选，并根据教师模型的概率进行加权，学生模型通过交叉熵损失学习这个分布，未被采样的 logits 目标概率设为零。研究还发现，在短训练周期（\u003c100B tokens）使用与学生规模相近的 \"小老师\" 模型效果更佳，而在长训练周期（>100B tokens）使用更大的教师模型能带来更显著的性能提升。预训练数据规模根据模型参数不同而调整，例如 27B 模型使用了 14 万亿 tokens。\n\n在预训练完成后，为了优化部署效率，模型进行了约 5,000 步的量化感知训练微调，使用原始非量化检查点的概率作为目标，使模型提前适应低精度运算。经过 QAT 优化后，量化至 Q4_0 格式时的困惑度下降减少了 54%，并大幅降低了内存占用，例如 27B 模型的权重所需显存从 BF16 精度的 54GB 降至 INT4 的 14.1GB，使其能在消费级 GPU 上运行。","order":3,"sourceName":"","sourceUrl":""},{"id":596,"slug":"gemma3-base-model-evaluation","title":"基础模型评估","description":"在预训练阶段，团队通过科学推理、代码、事实性、多语言、视觉和推理六项能力探测确保模型全面发展，其中多语言能力因更丰富的语料和平衡训练而提升最为显著。在标准基准测试中，Gemma 3 27B 参数版本表现卓越：在 MATH 测试中达到 89.0%，接近 Gemini 1.5 Pro；在 MMLU-Pro、LiveCodeBench、Bird-SQL、GPQA Diamond、FACTS Grounding 及 MMMU 等任务上均取得领先或媲美更大闭源模型的成绩。\n\n它支持至少 128K tokens 的上下文，在 RULER 128K 基准上准确率达 66.0%，展现了强大的长文档处理能力。集成 SigLIP 视觉编码器后，其在文档理解任务（如 DocVQA、InfoVQA、TextVQA）上的性能甚至优于更大的 PaliGemma 2 模型，且通过 Pan & Scan 图像处理方法提升了处理不同宽高比图像的鲁棒性。效率方面，27B 模型在单张 H100 GPU 上即可高效推理，算力需求仅为同类模型的约 1/10，并采用 5:1 交错的局部 / 全局注意力层架构优化了长上下文下的内存占用。安全性上，其记忆化率显著低于前代，在 CBRN 知识评估中显示有害知识水平极低，且经扫描未发现个人信息泄露。","order":4,"sourceName":"","sourceUrl":""},{"id":597,"slug":"gemma3-instruction-tuning","title":"Instruction Tuning","description":"指令微调模型的过程，旨在显著提升模型的实用性、交互性与安全性。该过程采用了一套先进的两阶段技术组合：\n\n- 首先，通过改进版的知识蒸馏，从一个大规模的指令微调教师模型中提取知识，使学生模型（Gemma 3）能够学习教师的策略分布。\n- 其次，进入强化学习微调阶段，采用了多种前沿的奖励优化算法，包括 BOND、WARM 和 WARP。\n- 这些方法共同作用，通过多样化的奖励函数来同步提升模型在多个维度的能力，包括对话的有用性、数学推理、代码生成、复杂推理、指令遵循以及多语言理解，同时致力于最小化模型的有害输出。\n- 奖励信号来源于多个渠道：基于人类反馈数据训练的加权平均奖励模型、代码执行反馈的真实结果，以及数学问题求解的准确性评估。","order":5,"sourceName":"","sourceUrl":""},{"id":598,"slug":"gemma3-chat-model-evaluation","title":"对话模型评估","description":"对话模型涵盖了人类主观评估和自动化客观基准测试。在最具代表性的人类评估平台 LMSYS Chatbot Arena（采用盲测对比）上，Gemma 3 27B 指令微调模型获得了 1338 的 ELO 评分，位列所有模型第 9 名，超越了包括 LLaMA 3 405B、Qwen2.5-70B 在内的多个参数量更大的开源模型，证明了其卓越的对话交互能力。在自动化基准测试中，该模型在衡量多学科理解的 MMLU-Pro 上得分 67.5，在数学推理基准 MATH 上得分 69.0，在代码生成基准 LiveCodeBench 上得分 29.7，在 SQL 查询基准 Bird-SQL 上得分 54.4，在科学推理基准 GPQA Diamond 上得分 42.4，在事实准确性基准 FACTS Grounding 上得分 74.9，并在多模态理解基准 MMMU 上得分 64.9，全面展示了其在知识、推理、代码及多模态方面的强大综合性能。此外，其在全球多语言理解测试中达到 75.1 分，体现了优秀的跨语言能力。在安全与责任评估方面，其记忆率（memorization rate）低至 0.001%，且在隐私检测中未发现个人敏感信息，符合负责任 AI 的开发要求。","order":6,"sourceName":"","sourceUrl":""}]},{"id":242,"slug":"deepseek-v2","title":"DeepSeek-V2","description":"DeepSeek-V2 是一款强大、经济且高效的混合专家（MoE）语言模型，总参数量达 236B，每个 token 仅激活 21B 参数，支持 128K 上下文长度。\r\n\r\n该模型通过两大创新架构实现显著性能提升：\r\n- 多头潜在注意力（MLA）采用低秩键值联合压缩技术，将 KV 缓存减少 93.3%，极大提升推理效率；\r\n- DeepSeekMoE 架构通过细粒度专家分割和共享专家隔离，在保持强大性能的同时降低训练成本 42.5%。\r\n\r\n模型在 8.1T tokens 的高质量多源语料上预训练，并在多个基准测试中表现优异，在 MMLU、AlpacaEval 2.0、MT-Bench 和 AlignBench 等评估中均达到开源模型顶级水平，最大生成吞吐量相比 DeepSeek 67B 提升至 5.76 倍，成为当时最强的开源 MoE 语言模型。","sourceName":"DeepSeek-V2: A Strong, Economical, and Efficient Mixture-of-Experts Language Model","sourceUrl":"https://arxiv.org/abs/2405.04434","publishedDate":"2024-05-07","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/deepseek.svg","types":["llm"],"nodes":[{"id":599,"slug":"deepseek-v2-mla","title":"MLA","description":"MLA 旨在解决传统多头注意力（MHA）中 KV 缓存过大导致的推理效率瓶颈问题。\n\nMLA 通过低秩键值联合压缩技术，将高维的键值向量压缩为低维潜在向量，具体通过下投影矩阵将输入压缩为潜在向量，再通过上投影矩阵重建键值，在推理时上投影矩阵可吸收到查询和输出投影矩阵中，从而只需缓存压缩向量而非完整键值对，显著减少 93.3% 的 KV 缓存。\n\n为解决旋转位置编码（RoPE）与低秩压缩的兼容性问题，MLA 采用解耦 RoPE 策略，使用额外的多头查询和共享键来承载位置信息。\n\n相比传统 MHA，MLA 不仅将 KV 缓存减少，支持 128K 长上下文，还将最大生成吞吐量提升至 5.76 倍，同时在 MMLU 等基准测试中表现优于 MHA，实现了性能与效率的双重提升。","order":1,"sourceName":"","sourceUrl":""},{"id":600,"slug":"deepseek-v2-deepseekmoe","title":"DeepSeekMoE","description":"DeepSeekMoE 的核心思想是对传统的 FFN（前馈网络）层进行改造，将其转换为由大量小型专家（Expert）组成的稀疏激活网络。每个专家本质上是一个独立的小型 FFN。对于每个输入令牌（Token），路由器（Router）会根据其内容选择激活最相关的少数几个专家（例如 Top-2），并将它们的输出加权组合。这样，虽然模型总参数量巨大（DeepSeek-V2 总参数量为 236B），但每个令牌实际激活的参数量仅为 21B，极大地减少了计算和内存开销。","order":2,"sourceName":"","sourceUrl":""}]},{"id":243,"slug":"deepseek-v3","title":"DeepSeek-V3","description":"DeepSeek-V3 是一个拥有 6710 亿总参数、每个令牌激活 370 亿参数的混合专家模型，它采用了多头潜在注意力架构实现高效推理，并基于 DeepSeekMoE 架构实现经济训练，同时创新性地引入了无辅助损失负载均衡策略和多令牌预测训练目标以进一步提升性能。\r\n\r\n该模型在 14.8 万亿高质量令牌上进行了预训练，通过 FP8 混合精度训练、DualPipe 算法和计算 - 通信重叠等优化技术，仅用 278.8 万 H800 GPU 小时就完成了完整训练，总成本约 557.6 万美元。\r\n\r\n在性能方面，DeepSeek-V3 在 MMLU、MMLU-Pro、GPQA 等知识基准测试中超越所有开源模型，在数学推理任务上甚至超越了 o1-preview，在代码竞赛基准 LiveCodeBench 上表现最佳，整体性能接近 GPT-4o 和 Claude-3.5-Sonnet 等领先闭源模型，展现了开源模型在保持高效训练成本的同时达到顶尖性能的能力。","sourceName":"DeepSeek-V3 Technical Report","sourceUrl":"https://arxiv.org/abs/2412.19437","publishedDate":"2024-12-27","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/deepseek.svg","types":["llm"],"nodes":[{"id":601,"slug":"deepseek-v3-architecture-innovations","title":"模型架构创新","description":"V3 架构在继承 V2 框架的基础上，集成了多项核心创新以实现高效推理与经济训练：\n\n- 模型采用了多头潜在注意力（MLA），通过对注意力键值对进行低秩联合压缩，在推理时仅需缓存压缩后的潜在向量，从而大幅减少 KV 缓存的内存占用；\n- 在 FFN 部分，模型使用 DeepSeekMoE 架构，包含共享专家和路由专家，以实现参数的高效利用。其最显著的创新之一是引入了无辅助损失负载均衡策略，该策略通过为每个专家引入可动态调整的偏置项来引导路由决策，从而在保证各专家负载均衡的同时，彻底避免了传统辅助损失函数对模型主任务性能的负面影响；\n- 此外，架构还设置了多令牌预测训练目标，通过顺序预测多个未来令牌来增强模型的表示学习能力，此目标在训练后可用于推测解码以加速推理。\n\n这些技术创新，MLA 保障了推理效率，DeepSeekMoE 与创新的负载均衡策略实现了高效且高性能的训练，多令牌预测则进一步提升了模型能力，协同工作，共同使 DeepSeek-V3 能够在拥有 6710 亿总参数的规模下，实现每个令牌仅激活 370 亿参数，在性能与效率之间取得了卓越的平衡。","order":1,"sourceName":"","sourceUrl":""},{"id":602,"slug":"deepseek-v3-infrastructure-optimizations","title":"基础设施优化","description":"在计算集群方面，模型在配备 2048 个 NVIDIA H800 GPU 的集群上进行训练，采用分层互联架构，节点内通过 NVLink / NVSwitch 高速互联，节点间使用 InfiniBand 互连。\n\n训练框架基于 HAI-LLM 框架，采用 16 路流水线并行、64 路专家并行和 ZeRO-1 数据并行的混合并行策略。\n\n为解决跨节点专家并行引入的沉重通信开销，团队设计了创新的 DualPipe 双向流水线并行算法，该算法通过将每个计算块细分为注意力机制、全对全分发、MLP 处理和全对全整合四个组件，并重新排列这些组件以精确调整 GPU 流处理器资源分配比例，实现了全对全通信和 PP 通信在执行过程中的完全隐藏。\n\n为确保 DualPipe 的计算性能，团队定制了高效的跨节点全对全通信内核，充分利用 NVLink（约 160GB/s）和 InfiniBand（约 50GB/s）的带宽差异，通过分层转发机制和节点限制路由（每令牌最多分配到 4 个节点）减少 IB 通信流量。\n\n内存优化方面，通过重计算技术、CPU 异步更新和参数共享等技术，使得 DeepSeek-V3 能够在不需要昂贵张量并行的情况下进行训练。\n\nFP8 混合精度训练框架首次在超大规模模型上验证了可行性，采用细粒度混合精度策略，大多数计算密集型操作在 FP8 精度下执行（理论上计算速度比 BF16 提高一倍），而对数值敏感的关键组件保持原始精度。通过细粒度量化（激活采用 1 × 128 的 tile-wise 分组，权重采用 128 × 128 的 block-wise 分组）、高精度累加和统一 E4M3 格式等技术，FP8 训练的相对损失误差始终保持在 BF16 基线的 0.25% 以内。\n\n推理部署分为预填充阶段（最小部署单元 4 节点 32 GPU）和解码阶段（最小部署单元 40 节点 320 GPU），采用冗余专家策略和计算 - 通信重叠优化。\n\n硬件设计建议包括为通信任务设计专用协处理器、提供跨 IB 和 NVLink 的统一通信原语、改进 Tensor Core 支持 FP32 累加精度和在线量化加速等。","order":2,"sourceName":"","sourceUrl":""},{"id":603,"slug":"deepseek-v3-pretraining","title":"预训练","description":"DeepSeek-V3 的预训练阶段在 14.8 万亿个高质量、多样化的 token 上进行，采用 129,280 词汇表和 128K 最大上下文长度，数据预处理包含文档打包和 Fill-in-Middle 策略以增强模型上下文理解能力。\n\n模型架构采用 61 层 Transformer，隐藏维度 7168，配备多头潜在注意力（MLA）和 DeepSeekMoE 混合专家系统，其中包含 1 个共享专家和 256 个路由专家，每个 token 激活 8 个专家。\n\n训练采用 AdamW 优化器，学习率经过精心调度，从初始线性增长到 $2.2 \\times 10^{-4}$，随后按余弦衰减至 $2.2 \\times 10^{-5}$，最终阶段降至 $7.3 \\times 10^{-6}$，批量大小从 3072 逐步增加到 15360。\n\n预训练完成后，通过两阶段 YaRN 方法将上下文窗口从 4K 扩展到 32K 再扩展到 128K，每个扩展阶段包含 1000 步训练。\n\n整个预训练过程表现出卓越的稳定性，未出现任何不可恢复的损失尖峰或需要回滚的情况，仅消耗 2.664M H800 GPU 小时（相当于每万亿 token 180K GPU 小时），最终产出 DeepSeek-V3-Base 基础模型，该模型在多项基准测试中展现出顶尖性能，特别是在代码和数学任务上表现突出。","order":3,"sourceName":"","sourceUrl":""},{"id":604,"slug":"deepseek-v3-post-training","title":"后训练","description":"后训练阶段包括监督微调和强化学习两个关键环节，总成本仅 5K H800 GPU 小时。\n\n- 监督微调使用高质量人类标注对话数据对基础模型进行对齐，使其更好地遵循人类指令和偏好；\n- 强化学习采用创新的组相对策略优化方法，通过响应分组比较和相对排名而非绝对分数来优化模型策略，这种方法更稳定且能更好捕捉人类偏好的细微差别；\n- 评估结果显示 DeepSeek-V3-Chat 在标准基准测试中与 GPT-4o 和 Claude-3.5-Sonnet 等领先闭源模型性能相当，在开放式评估中于帮助性、安全性、事实准确性和创造性等方面获得高度评价。","order":4,"sourceName":"","sourceUrl":""}]},{"id":244,"slug":"deepseek-r1","title":"DeepSeek-R1","description":"DeepSeek-R1 是深度求索（DeepSeek-AI）在 2025 年 1 月发布并于同年 9 月登上《Nature》封面的重要论文，其核心贡献在于首次系统性地验证了通过纯强化学习（RL）激发大语言模型推理能力的全新范式。\r\n\r\n论文提出了完全无需监督微调（SFT）冷启动的 DeepSeek-R1-Zero 模型，证明了 LLM 仅通过奖励信号就能自主发展出反思、验证等复杂推理行为；在此基础上，通过创新的四阶段训练流程（冷启动、推理导向 RL、拒绝采样与 SFT、全场景 RL）和 GRPO 算法，最终优化出 DeepSeek-R1 模型，在 AIME 2024、MATH-500 等推理基准上达到与 OpenAI o1 系列相当的性能。\r\n\r\n此外，论文还展示了高效的蒸馏技术，能够将大模型的推理能力有效迁移至小模型，显著降低了部署成本。这项工作的意义不仅在于技术突破，更在于其完全开源的精神，为整个 AI 研究社区提供了宝贵的模型、代码和方法论，推动了推理模型的发展并挑战了闭源模型的领先地位。","sourceName":"DeepSeek-R1: Incentivizing Reasoning Capability in LLMs via Reinforcement Learning","sourceUrl":"https://arxiv.org/abs/2501.12948","publishedDate":"2025-01-22","isFree":false,"isMajor":true,"logoUrl":"https://learnllm.ai/logo/deepseek.svg","types":["llm"],"nodes":[{"id":605,"slug":"deepseek-r1-r1-zero-experiment","title":"一个实验（第 0 次 Post-Training）DeepSeek-R1-Zero","description":"R1-Zero 首次证明了大语言模型可以完全通过强化学习（RL）自主发展出强大的推理能力，无需任何监督微调（SFT）数据作为冷启动。\n\n该研究基于 DeepSeek-V3-Base（671B 参数）基座模型，采用创新的 GRPO 算法和基于规则的奖励系统进行纯 RL 训练，模型在训练过程中展现出“顿悟时刻”，自主学会了反思、验证和生成长思维链等复杂推理行为。\n\n在 AIME 2024 数学竞赛中，其准确率从基座模型的 15.6% 大幅提升至 71.0%（多数投票后达 86.7%），性能与 OpenAI o1-0912 相当。\n\n这一成果挑战了传统依赖大量标注数据的训练范式，证明了推理能力可能是模型的内在属性，只需适当的奖励信号就能被激发出来，为降低数据依赖、实现更自主的 AI 能力发展提供了全新路径。\n\n尽管存在可读性差、语言混合等局限性，但 R1-Zero 的成功直接催生了后续通过多阶段训练优化的 DeepSeek-R1 完整版本。","order":1,"sourceName":"","sourceUrl":""},{"id":606,"slug":"deepseek-r1-first-post-training","title":"第一次 Post-Training","description":"DeepSeek-R1 的训练流程，第一次 Post-Training 包含 SFT 和 RL 两个阶段：\n\n阶段 1 的冷启动监督微调（Cold Start SFT）旨在解决纯强化学习训练中出现的输出可读性差和语言混合问题，通过使用数千条高质量的长思维链数据对基础模型进行微调，为模型注入规范化推理模式和语言一致性，建立稳定的初始策略。\n\n在此基础上，阶段 2 的面向推理强化学习（Reasoning-Oriented RL）采用 GRPO 算法，结合基于规则的准确性奖励和语言一致性奖励，在数学、编程和科学推理等任务上进行大规模训练，显著提升模型的推理能力，同时保持输出的可读性。\n\n这两个阶段协同作用，既通过 SFT 引入人类先验知识以规范行为，又通过 RL 允许模型自主探索更优的推理策略，最终实现了强大的推理性能与良好可读性的平衡。\n\n- 阶段 1：冷启动监督微调（Cold Start SFT）\n- 阶段 2：面向推理的强化学习（Reasoning-Oriented RL）\n- 阶段 3：拒绝采样与监督微调（Rejection Sampling & SFT）\n- 阶段 4：全场景强化学习（RL for All Scenarios）","order":2,"sourceName":"","sourceUrl":""},{"id":607,"slug":"deepseek-r1-second-post-training","title":"第二次 Post-Training","description":"第二次 Post-Training 是为了将专项推理能力泛化到通用场景并实现全面对齐。\n\n阶段 3 的核心是通过拒绝采样技术从阶段 2 的 RL 检查点中筛选高质量样本，构建大规模训练数据集，其中推理数据（约 60 万个样本）通过基于规则的奖励或 DeepSeek-V3 作为生成式奖励模型（LLM as Judge）进行评估，非推理数据（约 20 万个样本）则复用 DeepSeek-V3 的 SFT 数据集并增强多样性，混合后对 DeepSeek-V3-Base 进行两轮监督微调，从而将模型在数学、编程等专项任务上涌现的推理能力迁移到更广泛的通用任务中，显著提升输出可读性和通用表现。\n\n阶段 4 则在阶段 3 的 SFT 模型基础上进行最终对齐优化，采用组合奖励策略：对于推理任务（如数学、编程）沿用基于规则的准确性奖励，对于开放域通用任务（如创意写作、多轮对话）则引入基于人类偏好的奖励模型来评估输出的帮助性和无害性，通过这种混合奖励机制和覆盖所有场景的多样化提示词训练，模型在保持甚至增强专项推理能力的同时，实现了与人类价值观的全面对齐，最终产出既强大又实用的 DeepSeek-R1 最终版本。","order":3,"sourceName":"","sourceUrl":""}]},{"id":245,"slug":"h200","title":"H200","description":"H200 是 NVIDIA 推出的 \"Hopper Refresh\" 数据中心 GPU，于 2023 年 11 月 13 日在 Supercomputing 2023（SC23）大会上正式发布。H200 在架构上沿用 H100 的 Hopper 核心（同样为 800 亿晶体管、TSMC 4N 工艺），并非一款全新架构产品，而是对 H100 的\"显存子系统升级 + 容量升级\"。\r\n\r\nH200 最关键的升级在于显存：首次将 **HBM3e** 引入数据中心 GPU，单卡容量从 H100 的 80 GB 跃升至 **141 GB**（提升约 76%），带宽从 3.35 TB/s 提升到 **4.8 TB/s**（提升约 43%）。更大的显存和更高的带宽直接缓解了大模型推理的\"内存墙\"瓶颈——70B 级别模型可单卡容纳、175B 级别模型仅需 2 张卡即可装下权重，KV Cache 也能保留更长上下文。\r\n\r\nH200 的算力、NVLink 4.0（900 GB/s）、TDP（700W SXM5）等关键参数与 H100 保持一致，硬件形态（SXM5 / PCIe）和软件栈（CUDA、cuDNN、Transformer Engine）完全兼容，已部署 H100 的数据中心可以\"drop-in\"替换。这意味着 H200 不是为重训而生，而是 H100 退役后接棒 LLM 推理时代的产品。\r\n\r\n与 H100 配合使用的 NVLink Network、DGX H200 / HGX H200 等整机柜方案让单节点即可拥有 1.1 TB 级别的 HBM3e 显存，构成了 2024 年大模型推理与长上下文应用的核心算力底座。","sourceName":"NVIDIA H200 Tensor Core GPU Datasheet","sourceUrl":"https://www.nvidia.com/en-us/data-center/h200/","publishedDate":"2023-11-13","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":608,"slug":"h200-architecture","title":"H200","description":"NVIDIA H200 是 H100 的 \"Hopper Refresh\" 版本，沿用 Hopper 架构与 NVLink 4.0，主要升级是 HBM3e 显存：141GB 容量与 4.8TB/s 带宽。","order":1,"sourceName":"","sourceUrl":""}]},{"id":249,"slug":"b200","title":"B200","description":"$14","sourceName":"NVIDIA Blackwell Tuning Guide","sourceUrl":"https://docs.nvidia.com/cuda/archive/12.8.0/pdf/Blackwell_Tuning_Guide.pdf","publishedDate":"2024-06-07","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":612,"slug":"b200-architecture","title":"B200","description":"英伟达 B200 是基于 Blackwell 架构、面向 AI 工厂时代的旗舰数据中心 GPU，搭载双 die 封装、第二代 Transformer 引擎、第五代 NVLink 与 192 GB HBM3e，将单卡算力、显存容量与多机互联规模推到了新的量级。","order":1,"sourceName":"","sourceUrl":""}]},{"id":250,"slug":"b300","title":"B300","description":"Blackwell Ultra（产品代号 B300，平台代号 GB300 NVL72）是 NVIDIA 在 2025 年 3 月 GTC 大会上公布的 Blackwell 同代 refresh 升级版，2025 年末到 2026 年上半年开始大规模量产。Ultra 不引入新架构，而是把同一颗 Blackwell die 在 HBM、Transformer Engine、互联拓扑三个维度上做到\"推理极致\"，是 NVIDIA 在 LLM 进入\"agentic AI / reasoning\"时代后押注的硬件主力。\r\n\r\n与 B200 相比，Blackwell Ultra 最显著的三项升级全部围绕\"推理\"展开：HBM3e 显存从 192 GB 提升到 288 GB（+50%），单卡就能放下 Llama-3.1-405B 这样的稠密千亿模型；Transformer Engine 升级为第二代 Ultra，attention-layer 路径实现 2× 加速；NVFP4（4-bit）原生支持从 weight 延伸到 attention 的 softmax / QK^T 路径，使得长上下文推理在精度几乎不掉的情况下把 token 成本砍掉一半。整机柜层面，GB300 NVL72 沿用 72 颗 Blackwell Ultra + Grace CPU 的 NVL72 形态。NVIDIA 公开数据：相比 NVIDIA Hopper 平台，GB300 NVL72 整机柜 AI 工厂产出提升最高达 50×。\r\n\r\n软件侧的关键配套是 NVIDIA Dynamo——取代 Triton Inference Server 的下一代推理服务栈，原生支持跨 GPU / 跨节点的 KV cache 卸载与调度，配合 TensorRT-LLM 在 GB300 上实现相比 Hopper 平台最高 35× 更低的推理成本（NVIDIA 官方：\"35× lower cost for agentic AI\"）。GB300 NVL72 已被 Microsoft Azure、CoreWeave、Oracle Cloud Infrastructure 等超大规模云厂商部署用于低延迟、长上下文的 agentic 编码与编程助手等场景。","sourceName":"NVIDIA GTC 2025 Keynote & Blackwell Ultra Architecture Brief","sourceUrl":"https://www.nvidia.com/en-us/data-center/technologies/blackwell-architecture/","publishedDate":"2025-03-18","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":613,"slug":"b300-architecture","title":"B300","description":"英伟达 B300（Blackwell Ultra）是 NVIDIA 在 2025 年 3 月 GTC 大会上公布的 Blackwell 同代 refresh 升级版，搭载 288 GB HBM3e、第二代 Transformer Engine Ultra 与 NVFP4 at attention 路径，是 2026 年之后 LLM 推理与 agentic AI 部署的主力硬件。","order":1,"sourceName":"","sourceUrl":""}]},{"id":251,"slug":"rubin-gpu","title":"Rubin GPU","description":"$15","sourceName":"NVIDIA Vera Rubin NVL72 Product Page","sourceUrl":"https://www.nvidia.com/en-us/data-center/vera-rubin/","publishedDate":"2026-01-07","isFree":false,"isMajor":false,"logoUrl":"","types":["gpu"],"nodes":[{"id":614,"slug":"rubin-gpu-architecture","title":"Rubin GPU","description":"NVIDIA Vera Rubin 是面向 AI 工厂时代的下一代数据中心 GPU 架构，旗舰产品 Rubin GPU 与 Vera Rubin NVL72 整机柜以 HBM4 首代引入、NVLink 6.0 翻倍带宽、260 TB/s 域内聚合带宽为核心创新，将单卡算力、显存带宽与整机柜互联规模推到了新的量级。","order":1,"sourceName":"","sourceUrl":""}]}]}</script>
  <script>
    (() => {
      "use strict";

      const data = JSON.parse(document.getElementById("learning-data").textContent);
      const byId = new Map(data.milestones.map((item) => [String(item.id), item]));
      const typeNames = new Map(data.types.map((type) => [type.slug, type.title]));
      const dialog = document.getElementById("detail-dialog");
      const dialogTitle = document.getElementById("dialog-title");
      const dialogDate = document.getElementById("dialog-date");
      const dialogSource = document.getElementById("dialog-source");
      const dialogBadges = document.getElementById("dialog-badges");
      const dialogDescription = document.getElementById("dialog-description");
      const nodeCount = document.getElementById("node-count");
      const nodeList = document.getElementById("node-list");
      const logoWrap = document.getElementById("logo-wrap");
      const sourceLink = document.getElementById("source-link");
      let previousFocus = null;

      function appendInlineMarkup(parent, text) {
        const parts = String(text).split(/(\*\*[^*]+\*\*)/g);
        for (const part of parts) {
          if (part.startsWith("**") && part.endsWith("**")) {
            const strong = document.createElement("strong");
            strong.textContent = part.slice(2, -2);
            parent.append(strong);
          } else {
            parent.append(document.createTextNode(part));
          }
        }
      }

      function renderText(target, value) {
        target.replaceChildren();
        const text = String(value || "").trim();
        if (!text) {
          const empty = document.createElement("p");
          empty.textContent = "暂无补充说明。";
          target.append(empty);
          return;
        }

        const blocks = text.split(/\n\s*\n/);
        for (const block of blocks) {
          const lines = block.split("\n");
          const isList = lines.every((line) => /^\s*-\s+/.test(line));
          if (isList) {
            const list = document.createElement("ul");
            for (const line of lines) {
              const item = document.createElement("li");
              appendInlineMarkup(item, line.replace(/^\s*-\s+/, ""));
              list.append(item);
            }
            target.append(list);
          } else {
            const paragraph = document.createElement("p");
            lines.forEach((line, index) => {
              if (index) paragraph.append(document.createElement("br"));
              appendInlineMarkup(paragraph, line);
            });
            target.append(paragraph);
          }
        }
      }

      function createBadge(label, className = "") {
        const badge = document.createElement("span");
        badge.className = ("badge " + className).trim();
        badge.textContent = label;
        return badge;
      }

      function renderLogo(item) {
        logoWrap.replaceChildren();
        const fallback = document.createElement("span");
        fallback.textContent = item.title.slice(0, 2).toUpperCase();
        logoWrap.append(fallback);
        if (!item.logoUrl) return;

        const image = document.createElement("img");
        image.alt = "";
        image.src = item.logoUrl;
        image.addEventListener("load", () => logoWrap.replaceChildren(image), { once: true });
        image.addEventListener("error", () => image.remove(), { once: true });
      }

      function renderNodes(item) {
        nodeList.replaceChildren();
        nodeCount.textContent = item.nodes.length + " 个节点";
        for (const node of item.nodes) {
          const details = document.createElement("details");
          details.className = "node";

          const summary = document.createElement("summary");
          const index = document.createElement("span");
          index.className = "node-index";
          index.textContent = String(node.order).padStart(2, "0");
          const title = document.createElement("span");
          title.textContent = node.title;
          summary.append(index, title);

          const body = document.createElement("div");
          body.className = "node-body description";
          renderText(body, node.description);
          details.append(summary, body);
          nodeList.append(details);
        }
      }

      function openDetails(item, trigger) {
        previousFocus = trigger;
        dialogDate.textContent = item.publishedDate.replaceAll("-", " / ");
        dialogTitle.textContent = item.title;
        dialogSource.textContent = item.sourceName;
        dialogBadges.replaceChildren();
        for (const type of item.types) dialogBadges.append(createBadge(typeNames.get(type) || type, "badge-accent"));
        if (item.isMajor) dialogBadges.append(createBadge("关键里程碑", "badge-gold"));
        if (item.isFree) dialogBadges.append(createBadge("原站免费内容", "badge-accent"));
        renderText(dialogDescription, item.description);
        renderNodes(item);
        renderLogo(item);
        sourceLink.href = item.sourceUrl;
        sourceLink.setAttribute("aria-label", "打开 " + item.title + " 的论文原文或官方技术文档");
        dialog.showModal();
        document.getElementById("close-dialog").focus();
      }

      document.querySelector("tbody").addEventListener("click", (event) => {
        const trigger = event.target.closest("[data-milestone-id]");
        if (!trigger) return;
        const item = byId.get(trigger.dataset.milestoneId);
        if (item) openDetails(item, trigger);
      });

      document.getElementById("close-dialog").addEventListener("click", () => dialog.close());
      dialog.addEventListener("click", (event) => {
        if (event.target === dialog) dialog.close();
      });
      dialog.addEventListener("close", () => {
        if (previousFocus?.isConnected) previousFocus.focus();
      });

      const nodeTotal = data.milestones.reduce((sum, item) => sum + item.nodes.length, 0);
      const invalidSources = data.milestones.filter((item) => !item.sourceUrl.startsWith("https://") || /learnllm\.ai\/learning/i.test(item.sourceUrl));
      if (data.types.length !== 14 || data.milestones.length !== 70 || nodeTotal !== 180 || invalidSources.length) {
        console.error("LearnLLM snapshot integrity check failed", {
          types: data.types.length,
          milestones: data.milestones.length,
          nodes: nodeTotal,
          invalidSources,
        });
      }
    })();
  </script>
</body>
</html>
